<!doctype html><html><head><meta charset="utf-8"><title>READY:computer-tool</title><style>body{margin:0;background:#162430;color:white;font:24px sans-serif;padding:50px 80px}input,button{font:24px sans-serif;padding:12px}input{width:1000px;display:block;margin:20px 0}button{display:block}#result{color:#8df6b2}footer{margin-top:1800px;padding:50px;background:#30475b}</style></head><body><h1>One visible computer. Six agent actions.</h1><p>The agent and Builder see this same Chromium window.</p><label>Shared desktop message<input id="message" aria-label="Shared desktop message" oninput="document.title='INPUT:'+this.value"></label><button id="show" onclick="const value=document.querySelector('#message').value;document.querySelector('#result').textContent=value;document.title='RESULT:'+value">Show the agent's message</button><h2 id="result">Waiting for OpenClaw computer tool</h2><footer>Scroll acceptance reached the footer.</footer><script>addEventListener('scroll',()=>document.title='SCROLL:'+Math.round(scrollY))</script></body></html>
