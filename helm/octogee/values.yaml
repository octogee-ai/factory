# ── Octogee Umbrella Chart — Shared Defaults ────────────────────────────────
# Override per-environment in values.prod.yaml / values.test.yaml

# ── Global values (shared across sub-charts) ────────────────────────────────
global:
  mattermost:
    # K8s Secret containing admin credentials for Mattermost.
    # This secret MUST exist before `helm upgrade`. Create it via:
    #   ./scripts/setup-mattermost.sh --env=ENV
    #
    # Required keys: admin_user, admin_pass, admin_token, admin_user_id,
    #                bot_token, bot_user_id, team_id
    #
    # Consumed by: chat-proxy, gateway-edge, gateway
    adminSecret:
      name: mattermost-gateway
      tokenKey: admin_token
  # Fleet-controller HTTP port. Single source of truth referenced by
  #   - templates/gateway-fleet.yaml (alias Service port + BackendConfig
  #     healthCheck port + per-instance Ingress backend ports)
  #   - charts/glm-controller/templates/deployment.yaml (FLEET_CONTROLLER_PORT
  #     env, used to render Ingress paths at runtime)
  # If you change this value, both consumers update together — no drift.
  fleetControllerPort: "3003"

# Single shared GKE Ingress for the public app hosts. When disabled, the
# legacy per-host Ingresses render exactly as before. When enabled, this
# parent Ingress owns the edge, while the per-service templates still render
# their ManagedCertificate and BackendConfig resources.
edgeIngress:
  enabled: false
  name: octogee-edge-ingress
  staticIpName: ""
  hosts:
    api: ""
    git: ""
    mattermost: ""
    preview: ""
  managedCertificates: []

# ── cloud-sql-proxy ─────────────────────────────────────────────────────────
cloud-sql-proxy:
  image:
    repository: gcr.io/cloud-sql-connectors/cloud-sql-proxy
    tag: "2.11.4"
  connectionName: "octogee:us-central1:octogee-pg"
  usePrivateIp: true
  serviceAccountName: octogee-api
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# ── mattermost ──────────────────────────────────────────────────────────────
mattermost:
  enabled: true
  image:
    repository: mattermost/mattermost-team-edition
    tag: "11.8.1"
  db:
    user: mattermost
    name: mattermost_prod
    passwordSecret: mattermost-cloud-sql
    passwordKey: password
  # Default SiteURL is the IAP-protected admin host (overridable per-env).
  # Browser-direct path uses MM_PUBLIC_URL + ALLOWCORSFROM, not SiteURL.
  siteUrl: "https://mattermost.octogee.com"
  allowedInternalConnections: "octogee-gateway.octogee.svc.cluster.local"
  # Space-separated origins allowed to call MM cross-origin (REST + WS).
  # Required for browser-direct access from app.octogee.com → mattermost.octogee.com.
  # Override per-env.
  allowedCorsOrigins: ""
  serviceAccountName: octogee-gateway
  pvc:
    size: 20Gi
    storageClass: standard-rwo
  # Single public ingress for Mattermost. Pre-Option-C this was IAP-gated
  # for ops-only access; Option C drops IAP so the browser app can hit MM
  # directly with a per-user PAT (no Google OAuth in the data path).
  # Admin login still requires the MM admin password; Cloud Armor rate-limits.
  ingress:
    enabled: false
    host: ""
    staticIpName: ""
    certName: ""
    backendConfigName: mattermost-backend
    iap:
      enabled: false
      oauthClientCredentialsSecretName: ""
  # MM's published minimum is 1 vCPU / 2 GiB; the prior 500m/512Mi request
  # would OOM as soon as a few users joined. Autopilot requires
  # limits.memory == requests.memory for non-bursty pods, so memory is
  # fixed at 2Gi on both sides. CPU can burst to 2000m on the general
  # compute class.
  resources:
    requests:
      cpu: "1000m"
      memory: "2Gi"
      ephemeral-storage: "1Gi"
    limits:
      cpu: "2000m"
      memory: "2Gi"
      ephemeral-storage: "5Gi"

# ── gitea (upstream chart) ──────────────────────────────────────────────────
# networkPolicy is managed in the parent chart (templates/gitea-network-policy.yaml)
# because Gitea is a packaged upstream chart — can't inject templates into .tgz
# We do NOT pin gitea.image.tag: it defaults to the chart's appVersion, so the
# `gitea` dependency version in Chart.yaml is the single version knob — Renovate
# bumps the chart and the matching binary rides along (.github/renovate.json5).
gitea:
  # The chart's helm-test hook (a busybox wget → gitea:3000) can't pass under the
  # networkPolicy below, which intentionally blocks arbitrary pods — and it adds
  # no signal over gitea's own readiness probe + the deploy's `helm --wait` gate.
  # Disabled so releases don't leave a failed test-connection pod behind.
  test:
    enabled: false
  networkPolicy:
    enabled: true
  ingress:
    enabled: false
  webIngress:
    enabled: false
    host: ""
    staticIpName: ""
    certName: ""
    backendConfigName: gitea-backend
    iap:
      enabled: false
      oauthClientCredentialsSecretName: ""
  gitea:
    admin:
      username: octogee-admin
      email: ops@octogee.com
      existingSecret: gitea-admin
    config:
      database:
        DB_TYPE: postgres
        HOST: cloud-sql-proxy:5432
        NAME: gitea_prod
        USER: gitea
      server:
        DOMAIN: git.octogee.com
        ROOT_URL: https://git.octogee.com
      repository:
        DEFAULT_PRIVATE: "true"
      service:
        DISABLE_REGISTRATION: "true"
        REQUIRE_SIGNIN_VIEW: "true"
      metrics:
        ENABLED: "true"
  service:
    http:
      annotations:
        cloud.google.com/backend-config: '{"default":"gitea-backend"}'
        cloud.google.com/neg: '{"ingress":true}'
      clusterIP: ""
  postgresql:
    enabled: false
  postgresql-ha:
    enabled: false
  redis-cluster:
    enabled: false
  valkey-cluster:
    enabled: false
  valkey:
    enabled: false
  redis:
    enabled: false
  persistence:
    enabled: true
    storageClass: premium-rwo
    size: 50Gi
  strategy:
    type: Recreate

# ── gateway-edge ────────────────────────────────────────────────────────
gateway-edge:
  image:
    repository: us-central1-docker.pkg.dev/octogee/octogee/gateway-edge
    tag: latest
  replicas: 1
  port: 3001
  serviceAccountName: octogee-gateway
  env:
    GITEA_ORG: "octogee"
    FIREBASE_PROJECT_ID: "octogee"
    GCLOUD_PROJECT: "octogee"
    APP_URL: "https://app.octogee.com"
    API_PUBLIC_URL: "https://api.octogee.com"
    SITE_URL: "https://octogee.com"
    K8S_NAMESPACE: "octogee"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ── gateway-fleet (spanning resources only) ─────────────────────────────────
# Per-instance gateway pods + their per-instance Services + PDB are
# rendered by helm/octogee-gateway/, not the umbrella. The umbrella
# only owns the cross-instance resources: alias Service, NetworkPolicy,
# preview Ingress. Defaults below are overridden
# per env in values.{test,prod}.yaml.
gatewayFleet:
  # NOTE: the fleet-controller HTTP port now lives at
  # `.Values.global.fleetControllerPort`. Both the templates here and
  # the glm-controller subchart's Deployment env read from there so a
  # change updates both atomically.
  aliasService:
    enabled: true
  networkPolicy:
    enabled: true
  # Platform-owned TokenReview capability for dynamic gateway KSAs.
  # Per-gateway releases are installed by Cowboy and intentionally remain
  # namespace-scoped; this umbrella binding is cluster-scoped but grants only
  # authentication.k8s.io/tokenreviews.create to service accounts in the
  # release namespace.
  tokenReviewRbac:
    enabled: true
  previewIngress:
    enabled: false
    host: ""
    staticIpName: ""
    certName: ""
    cloudArmor:
      enabled: false
      policyName: ""
  # Vestigial since FLEET-CONTROL-NEG-SHED removed the fleet host: no
  # template consumes this. Cowboy (glm-controller) owns the dynamic
  # per-instance api/preview Ingress paths via host-scoped JSON patch.
  instances: []
  # Cluster-scoped custom compute class for gateway nodes (rendered by
  # templates/gateway-compute-class.yaml). Empty name = not rendered; set
  # per env to a cluster-unique name the per-gateway chart's
  # .Values.computeClass matches.
  computeClass:
    name: ""
    spotName: ""

# ── llm-broker ───────────────────────────────────────────────────────────────
# Dedicated, shell-less cluster service that holds the real platform model key
# and accepts only per-gateway broker tokens from exec-capable builder pods.
# It runs from the octogee-api image for now so the platform release carries one
# singleton image tag; split to a separate image only when traffic/load demands.
llmBroker:
  enabled: true
  image:
    repository: us-central1-docker.pkg.dev/octogee/octogee/octogee-api
    tag: latest
  replicas: 2
  port: 3010
  serviceAccountName: octogee-api
  upstream:
    anthropicBaseUrl: "https://api.anthropic.com"
  providerSecret:
    name: octogee-anthropic
    key: api_key
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ── Service Account ──────────────────────────────────────────────────────────
serviceAccount:
  gcpServiceAccount: "octogee-gateway@octogee.iam.gserviceaccount.com"

# ── glm-controller (subchart values) ─────────────────────────────────────────
# Helm subchart values must be nested under the chart name. Without this
# block the glm-controller subchart sees gcpServiceAccount: "" and renders
# a KSA missing the iam.gke.io/gcp-service-account annotation, so Workload
# Identity falls back to the cluster's default node identity which lacks
# Firestore access. Cowboy runs as its OWN dedicated GSA (octogee-glm-controller)
# rather than the shared gateway SA, so its privileged teardown grants — Secret
# Manager admin + per-gateway SA delete — are not inherited by cattle gateway
# pods. Per-env override in values.test.yaml swaps to the env's GSA.
glm-controller:
  gcpServiceAccount: "octogee-glm-controller@octogee.iam.gserviceaccount.com"
  # Gateway-pod consumer GSA for new per-gateway auth-token secrets (NOT Cowboy's).
  gatewayServiceAccount: "octogee-gateway@octogee.iam.gserviceaccount.com"
