image:
  repository: us-central1-docker.pkg.dev/octogee/octogee/glm-controller
  tag: latest

# Workload Identity binding — KSA `glm-controller` impersonates this GSA
# for Firestore admin access. The GSA needs `roles/datastore.user` on the
# project. Per-env values.yaml overrides this with the env-suffixed GSA.
gcpServiceAccount: ""

# Helm release the controller manages. The controller runs `helm upgrade`
# against `release` using the chart at `chartPath`. Both default to the
# umbrella chart layout baked into the controller image; overridable for
# tests / non-standard deploys.
helm:
  release: octogee
  # Path inside the controller image where the chart source is baked at
  # build time. See glm-controller/Dockerfile.
  chartPath: /charts/octogee

# Customer-cleanup target endpoints (Gitea + Mattermost). Defaults
# resolve to in-cluster ClusterIP Services for the same Helm release;
# operator can override per-env if cluster topology changes.
env:
  gitApiUrl: ""
  gitOrg: ""
  mmUrl: ""

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

# Cowboy HTTP — admin / fleet API surface served from the control
# plane. Mounts the same admin-fleet-router factory workspace-api uses,
# so the admin Gateways tab keeps responding when no gateway pods are
# booted. The api[-test].octogee.com Ingress (in workspace-api chart)
# routes specific fleet paths to this Service.
http:
  port: 8080
