image:
  repository: ""
  tag: latest

# Workload Identity binding — KSA `glm-controller` impersonates THIS GSA:
# Cowboy's own dedicated identity (octogee-glm-controller), which carries the
# privileged teardown grants. Per-env values.yaml overrides with the
# env-suffixed GSA.
gcpServiceAccount: ""

# The gateway-POD consumer GSA (octogee-gateway) that new per-gateway
# auth-token Secret Manager secrets are bound to when an admin adds a gateway.
# Distinct from gcpServiceAccount above — Cowboy's identity must NOT be granted
# access to gateway token secrets. Per-env values.yaml sets the env-suffixed GSA.
gatewayServiceAccount: ""

# GKE Workload Identity pool project. Test and prod share the octogee GKE
# cluster, so TEST must still emit serviceAccount:octogee.svc.id.goog[...] IAM
# members even though its runtime Google project is octogee-test.
workloadIdentityProject: ""

kmsKeyName: ""

# Path inside the controller image where the standalone per-instance
# gateway chart is baked at build time (see glm-controller/Dockerfile,
# which COPYs helm/octogee-gateway → /charts/octogee-gateway). The
# reconciler installs `octogee-gw-<gatewayId>` releases off this
# chart. Override only for tests / non-standard image layouts.
gatewayChart: /charts/octogee-gateway

# Customer-cleanup target endpoints (Gitea + Mattermost). Defaults
# resolve to in-cluster ClusterIP Services for the same Helm release;
# operator can override per-env if cluster topology changes.
env:
  gitApiUrl: ""
  gitOrg: ""
  mmUrl: ""

modelKeyIssuer:
  enabled: true
  issueUrl: ""
  revokeUrl: ""
  bearerSecretName: gateway-model-key-issuer
  bearerSecretKey: bearer_token
  timeoutMs: "10000"

# Ingress shells whose dynamic per-gateway paths are owned by Cowboy.
# `sharedName` points all writers at the consolidated app Ingress; leave
# it empty for the legacy per-host Ingress names below.
ingress:
  sharedName: ""
  apiName: gateway-edge-ingress
  apiHost: ""
  previewName: preview-ingress
  previewHost: ""

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

# Cowboy HTTP — admin / fleet API surface served from the control
# plane. Mounts the same admin-fleet-router factory gateway-edge uses,
# so the admin Gateways tab keeps responding when no gateway pods are
# booted. The api[-test].octogee.com Ingress (in gateway-edge chart)
# routes specific fleet paths to this Service.
http:
  port: 8080

backendConfig:
  name: glm-controller-backend
  timeoutSec: 3600
  healthCheck:
    path: /healthz
    port: 8080

activationLease:
  sweepMs: "30000"

dedicatedGatewayIdle:
  idleMs: "1800000"
  sweepMs: "60000"

preemptionHandoff:
  sweepMs: "15000"
