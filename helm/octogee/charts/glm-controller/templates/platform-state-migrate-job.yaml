{{- if ne (((.Values.global).platformState).backend | default "firestore") "firestore" -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: platform-state-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    app: platform-state-migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: platform-state-migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        cloud.google.com/private-node: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: platform-state-migrate
          image: "{{ required "glm-controller.image.repository is required" .Values.image.repository }}:{{ required "glm-controller.image.tag is required" .Values.image.tag }}@{{ required "glm-controller.image.digest is required" .Values.image.digest }}"
          command: ["/usr/bin/tini", "--", "node", "dist/glm-controller/src/platform-state-migrate.js"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: LOG_LEVEL
              value: {{ ((.Values.global).logLevel | default "info") | quote }}
            - name: DEPLOYMENT_TARGET_ID
              value: {{ required "global.deploymentTargetId is required" (.Values.global).deploymentTargetId | quote }}
            {{- include "octogee.platformStateConnectionEnv" . | nindent 12 }}
            {{- include "octogee.platformStateSecretEnv" (dict "name" "PLATFORM_DB_USER" "key" "migration-user") | nindent 12 }}
            {{- include "octogee.platformStateSecretEnv" (dict "name" "PLATFORM_DB_PASSWORD" "key" "migration-password") | nindent 12 }}
            {{- include "octogee.platformStateSecretEnv" (dict "name" "PLATFORM_DB_RUNTIME_USER" "key" "runtime-user") | nindent 12 }}
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
{{- end }}
