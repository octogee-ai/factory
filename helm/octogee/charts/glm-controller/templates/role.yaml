apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: glm-controller
  namespace: {{ .Release.Namespace }}
  labels:
    app: glm-controller
rules:
  # CRUD on resource kinds the gateway subchart emits — `helm upgrade`
  # against the umbrella renders these and reconciles to live state.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies", "ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.gke.io"]
    resources: ["managedcertificates"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["cloud.google.com"]
    resources: ["backendconfigs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Helm release state lives in Secrets named sh.helm.release.v1.{release}.v{n}.
  # Full CRUD so `helm upgrade` can read + write release history.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Read-only on resources emitted by non-gateway subcharts (mattermost,
  # gitea, workspace-api, chat-proxy) plus the controller's own SA. Helm
  # needs to GET these to compute the diff; CRUD stays out of reach so
  # the controller can't accidentally touch the Mattermost/Gitea PVCs
  # (pets per docs/operations/RUNBOOK.md) or escalate via SA/RBAC churn.
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "pods", "events", "configmaps", "serviceaccounts"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: glm-controller
  namespace: {{ .Release.Namespace }}
  labels:
    app: glm-controller
subjects:
  - kind: ServiceAccount
    name: glm-controller
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: glm-controller
  apiGroup: rbac.authorization.k8s.io
