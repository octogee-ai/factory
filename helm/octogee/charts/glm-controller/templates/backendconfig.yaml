apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: {{ .Values.backendConfig.name | default "glm-controller-backend" }}
  namespace: {{ .Release.Namespace }}
spec:
  healthCheck:
    type: HTTP
    requestPath: {{ .Values.backendConfig.healthCheck.path | default "/healthz" }}
    port: {{ .Values.backendConfig.healthCheck.port | default .Values.http.port }}
  timeoutSec: {{ .Values.backendConfig.timeoutSec | default 3600 }}
