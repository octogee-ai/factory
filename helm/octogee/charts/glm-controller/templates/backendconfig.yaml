{{- if eq ((.Values.global).ingressClassName | default "traefik") "gce" }}
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: {{ .Values.backendConfig.name | default "glm-controller-backend" }}
  namespace: {{ .Release.Namespace }}
spec:
  {{- if .Values.backendConfig.cloudArmor.enabled }}
  securityPolicy:
    name: {{ .Values.backendConfig.cloudArmor.policyName }}
  {{- end }}
  healthCheck:
    type: HTTP
    requestPath: {{ .Values.backendConfig.healthCheck.path | default "/healthz" }}
    port: {{ .Values.backendConfig.healthCheck.port | default .Values.http.port }}
  timeoutSec: {{ .Values.backendConfig.timeoutSec | default 3600 }}
{{- end }}
