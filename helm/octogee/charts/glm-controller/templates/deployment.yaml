{{- $sharedIngressName := .Values.ingress.sharedName | default "" -}}
{{- $apiIngressName := default (.Values.ingress.apiName | default "gateway-edge-ingress") $sharedIngressName -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glm-controller
  namespace: {{ .Release.Namespace }}
  labels:
    app: glm-controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: glm-controller
  template:
    metadata:
      labels:
        app: glm-controller
    spec:
      serviceAccountName: glm-controller
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: glm-controller
          image: "{{ required "glm-controller.image.repository is required" .Values.image.repository }}:{{ required "glm-controller.image.tag is required" .Values.image.tag }}@{{ required "glm-controller.image.digest is required" .Values.image.digest }}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DEPLOYMENT_TARGET_ID
              value: {{ required "global.deploymentTargetId is required" (.Values.global).deploymentTargetId | quote }}
            # GATEWAY_CHART tells the controller where the standalone
            # per-instance chart is baked in the image (Dockerfile copies
            # helm/octogee-gateway/ → /charts/octogee-gateway). The
            # reconciler installs `octogee-gw-<gatewayId>` releases
            # off this chart. The umbrella `octogee` release is now
            # written by CI, not by the controller, so HELM_RELEASE +
            # HELM_CHART are no longer needed.
            - name: GATEWAY_CHART
              value: {{ .Values.gatewayChart | default "/charts/octogee-gateway" | quote }}
            - name: GOOGLE_CLOUD_PROJECT
              value: {{ required "global.deploymentProjectId is required" (.Values.global).deploymentProjectId | quote }}
            - name: GCP_PROJECT_ID
              value: {{ required "global.deploymentProjectId is required" (.Values.global).deploymentProjectId | quote }}
            - name: OCTOGEE_KMS_KEY_NAME
              value: {{ required "glm-controller.kmsKeyName is required" .Values.kmsKeyName | quote }}
            - name: GKE_WORKLOAD_IDENTITY_PROJECT
              value: {{ required "glm-controller.workloadIdentityProject is required" .Values.workloadIdentityProject | quote }}
            {{- $computer := (.Values.global).computer | default dict }}
            {{- if $computer.enabled }}
            - name: GATEWAY_BUILDER_RUNTIME
              value: "gce-vm"
            - name: GATEWAY_COMPUTE_PROJECT_ID
              value: {{ required "global.computer.projectId is required" $computer.projectId | quote }}
            - name: GATEWAY_VM_SPEC_JSON
              value: {{ required "global.computer.vmSpec is required" $computer.vmSpec | toJson | quote }}
            - name: GATEWAY_VM_KUBERNETES_API_HOST
              value: {{ required "global.computer.kubernetesApiHost is required" $computer.kubernetesApiHost | quote }}
            - name: GATEWAY_VM_BRIDGE_SERVICE
              value: "octogee-vm-bridge"
            - name: GATEWAY_VM_ROUTES_CONFIGMAP
              value: "octogee-vm-routes"
            - name: GATEWAY_VM_WARM_POOL_SIZE
              value: {{ $computer.warmPoolSize | default 0 | quote }}
            {{- end }}
            - name: FLEET_CONTROLLER_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: octogee-fleet-controller
                  key: private-key
            # Gitea + Mattermost admin credentials for cloud-side
            # customer cleanup (deprovision-customer op handler). Same
            # secrets the gateway pod uses; glm-controller now needs
            # them too because customer lifecycle moved off the gateway.
            - name: GIT_API_URL
              value: {{ .Values.env.gitApiUrl | default (printf "http://octogee-gitea-http.%s.svc.cluster.local:3000/api/v1" .Release.Namespace) | quote }}
            - name: GIT_ORG
              value: {{ .Values.env.gitOrg | default "octogee" | quote }}
            - name: GIT_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gitea-token
                  key: token
            - name: MM_URL
              value: {{ .Values.env.mmUrl | default (printf "http://mattermost.%s.svc.cluster.local:8065" .Release.Namespace) | quote }}
            - name: MM_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mattermost-gateway
                  key: admin_token
            - name: PROJECT_HOSTING_RETIREMENT_URL
              value: {{ printf "http://octogee-api.%s.svc.cluster.local:3001/internal/project-hosting" .Release.Namespace | quote }}
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: stripe-secrets
                  key: secret_key
            {{- if and .Values.posthog.host .Values.posthog.projectId }}
            - name: POSTHOG_HOST
              value: {{ .Values.posthog.host | quote }}
            - name: POSTHOG_PROJECT_ID
              value: {{ .Values.posthog.projectId | quote }}
            # Required, not optional: erasure config is all-three-or-nothing, so a
            # missing secret would ship a partial set and fail every erase-customer
            # op on config instead of refusing to start.
            - name: POSTHOG_PERSONAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.posthog.personalApiKeySecretName | quote }}
                  key: {{ .Values.posthog.personalApiKeySecretKey | quote }}
                  optional: false
            {{- end }}
            - name: HTTP_PORT
              value: {{ .Values.http.port | quote }}
            - name: DISPOSABLE_GATEWAY_IDLE_MS
              value: {{ (.Values.disposableGateway).idleMs | default "1800000" | quote }}
            - name: DISPOSABLE_GATEWAY_IDLE_WARNING_MS
              value: {{ (.Values.disposableGateway).idleWarningMs | default "300000" | quote }}
            # Single source of truth: parent `.Values.global.fleetControllerPort`.
            # The umbrella's gateway-fleet.yaml renders Service +
            # BackendConfig + Ingress paths off the same value, so a
            # change updates both consumers atomically (no drift between
            # what the LB targets and what Cowboy writes). Parentheses
            # around `.Values.global` guard against nil when this
            # subchart is rendered standalone (helm-glm-controller test
            # cases don't merge umbrella values).
            - name: FLEET_CONTROLLER_PORT
              value: {{ (.Values.global).fleetControllerPort | default "3003" | quote }}
            - name: GATEWAY_EDGE_INGRESS_NAME
              value: {{ $apiIngressName | quote }}
            - name: GATEWAY_EDGE_INGRESS_HOST
              value: {{ .Values.ingress.apiHost | default "" | quote }}
            - name: PREVIEW_INGRESS_HOST
              value: {{ .Values.ingress.previewHost | default "" | quote }}
            # The static base routing table Cowboy merges with per-gateway paths;
            # published by the umbrella's edge-routes-configmap.yaml.
            - name: EDGE_ROUTES_CONFIGMAP
              value: "octogee-edge-routes"
            # Per-gateway auth-token Secret Manager rotation: when an
            # admin clicks "Add Gateway", the handler calls
            # provisionGatewayAuthSecret({gatewayServiceAccount}) and
            # binds the generated SM secret to this GCP service account.
            # Without this env, the request 500s with "GATEWAY_SERVICE_
            # ACCOUNT not configured — admin cannot provision gateway
            # auth-token secret". This is the gateway-POD consumer GSA
            # (octogee-gateway), NOT Cowboy's own gcpServiceAccount — the
            # token secret must be readable by the gateway pod, and must
            # never be bound to the control-plane identity.
            - name: GATEWAY_SERVICE_ACCOUNT
              value: {{ required "glm-controller.gatewayServiceAccount is required" .Values.gatewayServiceAccount | quote }}
            {{- if (.Values.modelKeyIssuer).enabled }}
            - name: GATEWAY_MODEL_KEY_ISSUER_URL
              value: {{ (.Values.modelKeyIssuer).issueUrl | default (printf "http://octogee-api.%s.svc.cluster.local:3001/internal/model-keys/issue" .Release.Namespace) | quote }}
            - name: GATEWAY_MODEL_KEY_REVOKE_URL
              value: {{ (.Values.modelKeyIssuer).revokeUrl | default (printf "http://octogee-api.%s.svc.cluster.local:3001/internal/model-keys/revoke" .Release.Namespace) | quote }}
            - name: GATEWAY_MODEL_KEY_ISSUER_TIMEOUT_MS
              value: {{ (.Values.modelKeyIssuer).timeoutMs | default "10000" | quote }}
            - name: GATEWAY_MODEL_KEY_ISSUER_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ (.Values.modelKeyIssuer).bearerSecretName | default "gateway-model-key-issuer" }}
                  key: {{ (.Values.modelKeyIssuer).bearerSecretKey | default "bearer_token" }}
            {{- end }}
            - name: BOOTSTRAP_DEFAULT_GATEWAY
              value: {{ (.Values.bootstrapDefaultGateway).enabled | default false | quote }}
            - name: SHARED_GATEWAY_IDS
              value: {{ required "glm-controller.sharedGatewayIds is required" .Values.sharedGatewayIds | toJson | quote }}
            - name: BOOTSTRAP_IMAGE_REPOSITORY
              value: {{ required "glm-controller.bootstrapDefaultGateway.imageRepository is required" (.Values.bootstrapDefaultGateway).imageRepository | quote }}
            - name: BOOTSTRAP_IMAGE_TAG
              value: {{ (.Values.bootstrapDefaultGateway).imageTag | default "latest" | quote }}
            - name: BOOTSTRAP_GATEWAY_EDGE_IMAGE_REPOSITORY
              value: {{ (.Values.bootstrapDefaultGateway).gatewayEdgeImageRepository | default "" | quote }}
            - name: BOOTSTRAP_GATEWAY_EDGE_IMAGE_TAG
              value: {{ (.Values.bootstrapDefaultGateway).gatewayEdgeImageTag | default "" | quote }}
          ports:
            - containerPort: {{ .Values.http.port }}
              name: http
          # A reconcile pass holds the event loop for seconds at a time — a full
          # convergence over the shared pool has been measured near 12s — so
          # /healthz cannot answer inside kubelet's 1s default. At that default
          # the liveness probe killed Cowboy mid-reconcile every few minutes,
          # abandoning whatever operation it had claimed: that is how a rollout
          # sat "running" with no worker while migrations queued behind it.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: project-hosting-retirement
              mountPath: /var/run/secrets/project-hosting-retirement
              readOnly: true
      volumes:
        - name: project-hosting-retirement
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: octogee-project-hosting-retirement
                  expirationSeconds: 3600
