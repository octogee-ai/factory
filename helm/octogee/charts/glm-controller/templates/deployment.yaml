apiVersion: apps/v1
kind: Deployment
metadata:
  name: glm-controller
  namespace: {{ .Release.Namespace }}
  labels:
    app: glm-controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: glm-controller
  template:
    metadata:
      labels:
        app: glm-controller
    spec:
      serviceAccountName: glm-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: glm-controller
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HELM_RELEASE
              value: {{ .Values.helm.release | quote }}
            - name: HELM_CHART
              value: {{ .Values.helm.chartPath | quote }}
            - name: GOOGLE_CLOUD_PROJECT
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: FLEET_CONTROLLER_SECRET
              valueFrom:
                secretKeyRef:
                  name: octogee-fleet-controller
                  key: secret
            # Gitea + Mattermost admin credentials for cloud-side
            # customer cleanup (deprovision-customer op handler). Same
            # secrets the gateway pod uses; glm-controller now needs
            # them too because customer lifecycle moved off the gateway.
            - name: GIT_API_URL
              value: {{ .Values.env.gitApiUrl | default (printf "http://octogee-gitea-http.%s.svc.cluster.local:3000/api/v1" .Release.Namespace) | quote }}
            - name: GIT_ORG
              value: {{ .Values.env.gitOrg | default "octogee" | quote }}
            - name: GIT_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gitea-token
                  key: token
            - name: MM_URL
              value: {{ .Values.env.mmUrl | default (printf "http://mattermost.%s.svc.cluster.local:8065" .Release.Namespace) | quote }}
            - name: MM_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mattermost-gateway
                  key: admin_token
            - name: HTTP_PORT
              value: {{ .Values.http.port | quote }}
          ports:
            - containerPort: {{ .Values.http.port }}
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
