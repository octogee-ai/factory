apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: glm-controller-apiserver-read-{{ .Release.Namespace }}
  namespace: default
  labels:
    app: glm-controller
rules:
  - apiGroups: [""]
    resources: ["endpoints", "services"]
    resourceNames: ["kubernetes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: glm-controller-apiserver-read-{{ .Release.Namespace }}
  namespace: default
  labels:
    app: glm-controller
subjects:
  - kind: ServiceAccount
    name: glm-controller
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: glm-controller-apiserver-read-{{ .Release.Namespace }}
  apiGroup: rbac.authorization.k8s.io
