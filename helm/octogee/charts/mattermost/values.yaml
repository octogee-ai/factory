image:
  repository: mattermost/mattermost-team-edition
  tag: "12.0.2"
  digest: "sha256:08c0b4b93a14196b0850f62faa4a437d2643533f009cac4868a0b793aad61fc3"

# Node architecture the image is built for. The stock image is published for
# amd64 only, and the digest names that platform's manifest. Empty schedules on
# any node.
architecture: amd64

db:
  host: postgres
  port: 5432
  user: mattermost
  name: mattermost
  passwordSecret: mattermost-cloud-sql
  passwordKey: password

siteUrl: "https://mattermost.example.com"

# Space-separated list of origins that may call MM cross-origin (REST + WS).
# A browser calling Mattermost directly needs its app origin here.
allowedCorsOrigins: ""

# Link-preview / OpenGraph fetches. When true, MM's `POST /api/v4/opengraph`
# handler is active and returns metadata for URLs posted in chat; when
# false / unset, MM 11.x returns 404 for that endpoint and the browser
# surfaces the 404 even though the app renders no preview either way.
# Default true so the env var is authoritative and pods regenerate
# config.json from env on every restart (config/ is emptyDir).
enableLinkPreviews: true

serviceAccountName: octogee-gateway

pvc:
  size: 20Gi
  storageClass: standard-rwo

ilb:
  enabled: true
  staticIp: ""  # Set via terraform output mattermost_ilb_ip

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
    ephemeral-storage: "1Gi"
  limits:
    cpu: "2000m"
    memory: "2Gi"
    ephemeral-storage: "5Gi"

networkPolicy:
  enabled: true

pdb:
  enabled: true
  minAvailable: 1
