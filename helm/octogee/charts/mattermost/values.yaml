image:
  repository: mattermost/mattermost-team-edition
  tag: "11.8.1"

db:
  user: mattermost
  name: mattermost_prod
  passwordSecret: mattermost-cloud-sql
  passwordKey: password

siteUrl: "https://mattermost.octogee.com"
allowedInternalConnections: "octogee-gateway.octogee.svc.cluster.local"

# Space-separated list of origins that may call MM cross-origin (REST + WS).
# Browser-direct path: app.octogee.com → mm.octogee.com requires the app
# origin here. Set per-env in helm/octogee/values.{test,prod}.yaml.
allowedCorsOrigins: ""

# Link-preview / OpenGraph fetches. When true, MM's `POST /api/v4/opengraph`
# handler is active and returns metadata for URLs posted in chat; when
# false / unset, MM 11.x returns 404 for that endpoint and the browser
# surfaces the 404 even though the app renders no preview either way.
# Default true so the env var is authoritative and pods regenerate
# config.json from env on every restart (config/ is emptyDir).
enableLinkPreviews: true

serviceAccountName: octogee-gateway

pvc:
  size: 20Gi
  storageClass: standard-rwo

ilb:
  enabled: true
  staticIp: ""  # Set via terraform output mattermost_ilb_ip

# MM's published minimum is 1 vCPU / 2 GiB for any real load; the prior
# 500m/512Mi request would OOM as soon as a few users joined. Autopilot
# requires limits.memory == requests.memory for non-bursty pods, so memory
# is fixed at 2Gi on both sides. CPU can burst to limit on the general
# compute class.
resources:
  requests:
    cpu: "1000m"
    memory: "2Gi"
    ephemeral-storage: "1Gi"
  limits:
    cpu: "2000m"
    memory: "2Gi"
    ephemeral-storage: "5Gi"

networkPolicy:
  enabled: true

pdb:
  enabled: true
  minAvailable: 1
