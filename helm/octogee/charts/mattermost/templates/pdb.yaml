{{- if .Values.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "mattermost.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: mattermost
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      app: mattermost
{{- end }}
