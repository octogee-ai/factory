apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mattermost-data
  annotations:
    "helm.sh/resource-policy": keep
  labels:
    {{- include "mattermost.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.pvc.size }}
  storageClassName: {{ .Values.pvc.storageClass }}
