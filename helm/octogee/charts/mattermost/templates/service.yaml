apiVersion: v1
kind: Service
metadata:
  name: mattermost
  labels:
    {{- include "mattermost.labels" . | nindent 4 }}
spec:
  selector:
    app: mattermost
  ports:
    - port: 8065
      targetPort: 8065
      name: http
    - port: 8067
      targetPort: 8067
      name: metrics
  type: ClusterIP
