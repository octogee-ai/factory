{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mattermost-ingress
spec:
  podSelector:
    matchLabels:
      app: mattermost
  policyTypes:
    - Ingress
  ingress:
    # Allow GCE health checks and load balancer traffic (required for NEG-based ingress)
    - from:
        - ipBlock:
            cidr: 35.191.0.0/16
        - ipBlock:
            cidr: 130.211.0.0/22
      ports:
        - protocol: TCP
          port: 8065
    # chat-proxy traffic is covered by the gateway selector below — chat-proxy
    # runs as a sidecar of the octogee-gateway pod (helm/octogee/charts/gateway
    # /templates/deployment.yaml), so its source pod label is `app: octogee-gateway`.
    # Allow from gateway pod (OpenClaw bot, provisioner, site-build-api,
    # chat-proxy sidecar, AND the workspace-api sidecar — Phase 6.B
    # collocation made workspace-api a sibling container in this pod, so
    # one selector covers all three).
    - from:
        - podSelector:
            matchLabels:
              app: octogee-gateway
      ports:
        - protocol: TCP
          port: 8065
{{- end }}
