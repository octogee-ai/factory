{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mattermost-ingress
spec:
  podSelector:
    matchLabels:
      app: mattermost
  policyTypes:
    - Ingress
  ingress:
    # Allow GCE health checks and load balancer traffic (required for NEG-based ingress)
    - from:
        - ipBlock:
            cidr: 35.191.0.0/16
        - ipBlock:
            cidr: 130.211.0.0/22
      ports:
        - protocol: TCP
          port: 8065
    # Gateway pod: OpenClaw bot, provisioner, site-build-api, and the
    # gateway-edge sidecar (the folded chat-proxy WS bridge + activity
    # bridge dial MM here). One selector covers every container in the pod.
    - from:
        - podSelector:
            matchLabels:
              app: octogee-gateway
      ports:
        - protocol: TCP
          port: 8065
    # octogee-api cluster singleton: the MM REST proxy (/api/v4/*) +
    # credential mint forward to MM here (POST-BENDER-CLEANUP-SPEC §2.7).
    - from:
        - podSelector:
            matchLabels:
              app: octogee-api
      ports:
        - protocol: TCP
          port: 8065
{{- end }}
