apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-sql-proxy
  labels:
    app: cloud-sql-proxy
    {{- include "cloud-sql-proxy.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cloud-sql-proxy
  template:
    metadata:
      labels:
        app: cloud-sql-proxy
    spec:
      serviceAccountName: {{ .Values.serviceAccountName }}
      containers:
        - name: cloud-sql-proxy
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          args:
            - "--structured-logs"
            - "--address=0.0.0.0"
            - "--port=5432"
            {{- if .Values.usePrivateIp }}
            - "--private-ip"
            {{- end }}
            - {{ .Values.connectionName | quote }}
          ports:
            - containerPort: 5432
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          # Catch the zombie-proxy failure mode: the process stays alive but stops
          # accepting connections (connection-pool hang / unrecovered Cloud SQL
          # blip), so K8s otherwise never restarts it. A TCP probe on 5432 forces
          # a restart in ~90s instead of a multi-minute outage.
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
