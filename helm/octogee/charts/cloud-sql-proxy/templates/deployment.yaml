apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-sql-proxy
  labels:
    app: cloud-sql-proxy
    {{- include "cloud-sql-proxy.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloud-sql-proxy
  template:
    metadata:
      labels:
        app: cloud-sql-proxy
    spec:
      serviceAccountName: {{ .Values.serviceAccountName }}
      containers:
        - name: cloud-sql-proxy
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          args:
            - "--structured-logs"
            - "--address=0.0.0.0"
            - "--port=5432"
            {{- if .Values.usePrivateIp }}
            - "--private-ip"
            {{- end }}
            - {{ .Values.connectionName | quote }}
          ports:
            - containerPort: 5432
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
