apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cloud-sql-proxy
spec:
  # The proxy serves the platform DB to in-namespace clients (octogee-api,
  # mattermost, gitea). Restrict :5432 to this namespace as defence-in-depth.
  # Scoped to the proxy alone — never an empty podSelector, which would flip
  # every other pod to default-deny and drop their LB health checks.
  podSelector:
    matchLabels:
      app: cloud-sql-proxy
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
      ports:
        - protocol: TCP
          port: 5432
