{{- if .Values.serviceAccount.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: octogee-api-tokenreview-{{ .Release.Namespace }}
  labels:
    app: octogee-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccountName }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: octogee-api-gateway-pod-reader
  namespace: {{ .Release.Namespace }}
  labels:
    app: octogee-api
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: octogee-api-gateway-pod-reader
  namespace: {{ .Release.Namespace }}
  labels:
    app: octogee-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: octogee-api-gateway-pod-reader
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccountName }}
    namespace: {{ .Release.Namespace }}
{{- end }}
