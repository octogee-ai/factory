apiVersion: apps/v1
kind: Deployment
metadata:
  name: octogee-api
  namespace: {{ .Release.Namespace }}
  labels:
    app: octogee-api
spec:
  replicas: {{ .Values.replicas }}
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: octogee-api
  template:
    metadata:
      labels:
        app: octogee-api
    spec:
      terminationGracePeriodSeconds: 30
      serviceAccountName: {{ .Values.serviceAccountName }}
      automountServiceAccountToken: false
      {{- with .Values.global.platformComputeClass }}
      nodeSelector:
        cloud.google.com/compute-class: {{ . | quote }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: octogee-api
          image: "{{ required "octogee-api.image.repository is required" .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 15"]
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          env:
            - name: PORT
              value: {{ .Values.port | quote }}
            - name: NODE_EXTRA_CA_CERTS
              value: /var/run/secrets/kubernetes-api/ca.crt
            # K8S_NAMESPACE + the four legacy GCP-project env-var
            # spellings the route handlers use (GCLOUD_PROJECT,
            # GCP_PROJECT_ID, GOOGLE_CLOUD_PROJECT, FIREBASE_PROJECT_ID)
            # all derive from the pod's namespace via downward API.
            # PROD namespace `octogee` = PROD project `octogee`,
            # TEST namespace `octogee-test` = TEST project `octogee-test`.
            # Matches the glm-controller pattern; eliminates the
            # values.test.yaml override surface and the no-env-conditionals
            # rule (memory feedback_no_env_conditionals).
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DEPLOYMENT_TARGET_ID
              value: {{ required "global.deploymentTargetId is required" (.Values.global).deploymentTargetId | quote }}
            - name: GCLOUD_PROJECT
              value: {{ required "global.deploymentProjectId is required" (.Values.global).deploymentProjectId | quote }}
            - name: GCP_PROJECT_ID
              value: {{ required "global.deploymentProjectId is required" (.Values.global).deploymentProjectId | quote }}
            - name: GOOGLE_CLOUD_PROJECT
              value: {{ required "global.deploymentProjectId is required" (.Values.global).deploymentProjectId | quote }}
            - name: FIREBASE_PROJECT_ID
              value: {{ required "global.deploymentProjectId is required" (.Values.global).deploymentProjectId | quote }}
            {{- if .Values.gatewayServiceAccount }}
            # Admin fleet fulfillment provisions per-gateway auth-token
            # Secret Manager shells for gateway pods. This is the cattle
            # gateway-pod consumer GSA, not octogee-api's own Workload Identity.
            - name: GATEWAY_SERVICE_ACCOUNT
              value: {{ .Values.gatewayServiceAccount | quote }}
            {{- end }}
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range .Values.secrets }}
            - name: {{ .envName }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .secretKey }}
                  optional: {{ .optional | default false }}
            {{- end }}
          startupProbe:
            httpGet:
              path: {{ .Values.healthCheck.path }}
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: {{ .Values.healthCheck.path }}
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: {{ .Values.healthCheck.path }}
              port: http
            periodSeconds: 30
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: octogee-api-sa-token
              mountPath: /var/run/secrets/octogee-api
              readOnly: true
            - name: kubernetes-api-identity
              mountPath: /var/run/secrets/kubernetes-api
              readOnly: true
      volumes:
        - name: octogee-api-sa-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: octogee-api
                  expirationSeconds: 3600
        - name: kubernetes-api-identity
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
