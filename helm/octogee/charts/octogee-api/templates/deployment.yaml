apiVersion: apps/v1
kind: Deployment
metadata:
  name: octogee-api
  namespace: {{ .Release.Namespace }}
  labels:
    app: octogee-api
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: octogee-api
  template:
    metadata:
      labels:
        app: octogee-api
    spec:
      serviceAccountName: {{ .Values.serviceAccountName }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: octogee-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          env:
            - name: PORT
              value: {{ .Values.port | quote }}
            # K8S_NAMESPACE + the four legacy GCP-project env-var
            # spellings the route handlers use (GCLOUD_PROJECT,
            # GCP_PROJECT_ID, GOOGLE_CLOUD_PROJECT, FIREBASE_PROJECT_ID)
            # all derive from the pod's namespace via downward API.
            # PROD namespace `octogee` = PROD project `octogee`,
            # TEST namespace `octogee-test` = TEST project `octogee-test`.
            # Matches the glm-controller pattern; eliminates the
            # values.test.yaml override surface and the no-env-conditionals
            # rule (memory feedback_no_env_conditionals).
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: GCLOUD_PROJECT
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: GCP_PROJECT_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: GOOGLE_CLOUD_PROJECT
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: FIREBASE_PROJECT_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range .Values.secrets }}
            - name: {{ .envName }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .secretKey }}
                  optional: {{ .optional | default false }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: {{ .Values.healthCheck.path }}
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: {{ .Values.healthCheck.path }}
              port: http
            periodSeconds: 30
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: octogee-api-sa-token
              mountPath: /var/run/secrets/octogee-api
              readOnly: true
      volumes:
        - name: octogee-api-sa-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: octogee-api
                  expirationSeconds: 3600
