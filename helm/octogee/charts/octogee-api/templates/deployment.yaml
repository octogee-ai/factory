apiVersion: apps/v1
kind: Deployment
metadata:
  name: octogee-api
  namespace: {{ .Release.Namespace }}
  labels:
    app: octogee-api
spec:
  replicas: {{ .Values.replicas }}
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: octogee-api
  template:
    metadata:
      labels:
        app: octogee-api
    spec:
      {{- with (.Values.global).nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      serviceAccountName: {{ .Values.serviceAccountName }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: octogee-api
          image: "{{ required "octogee-api.image.repository is required" .Values.image.repository }}:{{ required "octogee-api.image.tag is required" .Values.image.tag }}@{{ required "octogee-api.image.digest is required" .Values.image.digest }}"
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 15"]
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          env:
            - name: NATIVE_SHARED_CONTEXT_WORKER_IMAGE
              value: "{{ .Values.image.repository }}:{{ .Values.image.tag }}@{{ .Values.image.digest }}"
            - name: LOG_LEVEL
              value: {{ (.Values.global).logLevel | default "info" | quote }}
            - name: LOG_KEEP_LONG_IDENTIFIERS
              value: {{ (.Values.global).logKeepLongIdentifiers | default false | quote }}
            - name: PORT
              value: {{ .Values.port | quote }}
            - name: NODE_EXTRA_CA_CERTS
              value: /var/run/secrets/kubernetes-api/ca.crt
            # K8S_NAMESPACE + the four legacy GCP-project env-var
            # spellings the route handlers use (GCLOUD_PROJECT,
            # GCP_PROJECT_ID, GOOGLE_CLOUD_PROJECT, FIREBASE_PROJECT_ID)
            # all derive from the pod's namespace via downward API.
            # Each environment's namespace is named after its Google project.
            # Matches the glm-controller pattern; eliminates the
            # values.test.yaml override surface and the no-env-conditionals
            # rule (memory feedback_no_env_conditionals).
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DEPLOYMENT_TARGET_ID
              value: {{ required "global.deploymentTargetId is required" (.Values.global).deploymentTargetId | quote }}
            - name: PUBLIC_APP_ORIGINS
              value: {{ join "," (required "global.publicAppOrigins is required" (.Values.global).publicAppOrigins) | quote }}
            - name: GCLOUD_PROJECT
              value: {{ required "global.deploymentProjectId is required" (.Values.global).deploymentProjectId | quote }}
            - name: GCP_PROJECT_ID
              value: {{ required "global.deploymentProjectId is required" (.Values.global).deploymentProjectId | quote }}
            - name: GOOGLE_CLOUD_PROJECT
              value: {{ required "global.deploymentProjectId is required" (.Values.global).deploymentProjectId | quote }}
            - name: FIREBASE_PROJECT_ID
              value: {{ required "global.deploymentProjectId is required" (.Values.global).deploymentProjectId | quote }}
            - name: OCTOGEE_CUSTOMER_HOSTING_PROJECT_ID
              value: {{ required "global.customerHostingProjectId is required" (.Values.global).customerHostingProjectId | quote }}
            {{- $computer := (.Values.global).computer | default dict }}
            {{- if $computer.enabled }}
            - name: GATEWAY_COMPUTER_SERVICE_ACCOUNT_EMAIL
              value: {{ required "global.computer.serviceAccountEmail is required" $computer.serviceAccountEmail | quote }}
            - name: GATEWAY_COMPUTER_PROJECT_ID
              value: {{ required "global.computer.projectId is required" $computer.projectId | quote }}
            {{- end }}
            - name: PROJECT_RUNNER_IMAGE
              value: "{{ required "global.projectRunnerImage.repository is required" (.Values.global).projectRunnerImage.repository }}:{{ required "global.projectRunnerImage.tag is required" (.Values.global).projectRunnerImage.tag }}@{{ required "global.projectRunnerImage.digest is required" (.Values.global).projectRunnerImage.digest }}"
            - name: PROJECT_RUN_BROKER_URL
              value: "http://octogee-project-run-broker.{{ .Release.Namespace }}.svc.cluster.local:3002"
            - name: PROJECT_RUN_CONTROLLER_URL
              value: "http://octogee-project-run-controller.{{ .Release.Namespace }}.svc.cluster.local:3003"
            - name: PROJECT_PUBLISHER_URL
              value: "http://octogee-project-publisher.{{ .Release.Namespace }}.svc.cluster.local:3005"
            {{- if .Values.gatewayServiceAccount }}
            # Admin fleet fulfillment provisions per-gateway auth-token
            # Secret Manager shells for gateway pods. This is the cattle
            # gateway-pod consumer GSA, not octogee-api's own Workload Identity.
            - name: GATEWAY_SERVICE_ACCOUNT
              value: {{ .Values.gatewayServiceAccount | quote }}
            {{- end }}
            {{- include "octogee.blobStoreEnv" . | nindent 12 }}
            {{- with (include "octogee.platformStateEnv" .) }}{{ . | nindent 12 }}{{ end }}
            {{- include "octogee.runtimeSecretStoreEnv" . | nindent 12 }}
            {{- if not .Values.env.OCTOGEE_KMS_KEY_NAME }}
            {{- with (.Values.global).encryptionRootKeySecretName }}
            - name: ENCRYPTION_ROOT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . | quote }}
                  key: root-key
            {{- end }}
            {{- end }}
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- $secretEnv := .Values.secrets }}
            {{- range $path, $_ := .Files.Glob "**/secret-env.yaml" }}
            {{- $secretEnv = concat $secretEnv ($.Files.Get $path | fromYamlArray) }}
            {{- end }}
            {{- range $secretEnv }}
            - name: {{ .envName }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .secretKey }}
                  optional: {{ .optional | default false }}
            {{- end }}
          startupProbe:
            httpGet:
              path: {{ .Values.healthCheck.path }}
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: {{ .Values.healthCheck.path }}
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: {{ .Values.healthCheck.path }}
              port: http
            periodSeconds: 30
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: octogee-api-sa-token
              mountPath: /var/run/secrets/octogee-api
              readOnly: true
            - name: kubernetes-api-identity
              mountPath: /var/run/secrets/kubernetes-api
              readOnly: true
            - name: project-run-control
              mountPath: /var/run/secrets/project-run-control
              readOnly: true
            - name: project-publisher
              mountPath: /var/run/secrets/project-publisher
              readOnly: true
      volumes:
        - name: octogee-api-sa-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: octogee-api
                  expirationSeconds: 3600
        - name: kubernetes-api-identity
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
        - name: project-run-control
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: octogee-project-runs
                  expirationSeconds: 3600
        - name: project-publisher
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: octogee-project-publisher
                  expirationSeconds: 3600
