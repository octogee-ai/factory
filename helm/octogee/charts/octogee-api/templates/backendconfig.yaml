apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: {{ .Values.backendConfig.name | default "octogee-api-backend" }}
  namespace: {{ .Release.Namespace }}
spec:
  healthCheck:
    type: HTTP
    requestPath: {{ .Values.backendConfig.healthCheck.path | default "/health" }}
    port: {{ .Values.backendConfig.healthCheck.port | default .Values.port }}
  timeoutSec: {{ .Values.backendConfig.timeoutSec | default 30 }}
