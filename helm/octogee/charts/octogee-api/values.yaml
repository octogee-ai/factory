image:
  repository: us-central1-docker.pkg.dev/octogee/octogee/octogee-api
  tag: latest

replicas: 1
port: 3001

backendConfig:
  name: octogee-api-backend
  healthCheck:
    path: /health
    port: 3001
  timeoutSec: 30

serviceAccountName: octogee-api
serviceAccount:
  create: true
  annotations:
    iam.gke.io/gcp-service-account: octogee-api@octogee.iam.gserviceaccount.com

# Distinct from octogee-api's own Workload Identity GSA. Admin fleet routes use
# this as the consumer member when creating gateway-auth-token-* Secret Manager
# secrets for cattle gateway pods.
gatewayServiceAccount: octogee-gateway@octogee.iam.gserviceaccount.com

env:
  GITEA_URL: ""  # auto-computed from K8S_NAMESPACE
  GITEA_ORG: "octogee"
  # In-cluster Mattermost base for the trusted-side provisioning broker
  # (provisionMattermostUser reads MM_URL). TEST overrides in values.test.yaml.
  MM_URL: "http://mattermost.octogee.svc.cluster.local:8065"
  APP_URL: "https://app.octogee.com"
  SITE_URL: "https://octogee.com"
  # Single public host (POST-BENDER-CLEANUP-SPEC §2.7). API_PUBLIC_URL is
  # returned by the credential mint (mmUrl) + the openclaw/builder-shell
  # ticket endpoints as the WS base; the browser pins WS to the home pod
  # via /api/g/<gw>/. MM_INTERNAL_URL is the in-cluster Mattermost the REST
  # proxy (/api/v4/*) forwards to.
  API_PUBLIC_URL: "https://api.octogee.com"
  MM_INTERNAL_URL: "http://mattermost.octogee.svc.cluster.local:8065"
  # Envelope-encryption key for per-user connector tokens (users/{uid}/secrets/*).
  # TEST override lives in helm/octogee/values.test.yaml.
  OCTOGEE_KMS_KEY_NAME: "projects/octogee/locations/us-central1/keyRings/octogee-creds/cryptoKeys/integrations-at-rest"
  # octogee-api holds the connector secrets + KMS key and serves the broker route, so it
  # reads connector tokens directly. Cattle gateways carry no creds and set
  # CONNECTOR_TOKEN_BROKER_URL instead; they never get this flag.
  CONNECTOR_TOKEN_AUTHORITY: "1"
  # GCLOUD_PROJECT / GCP_PROJECT_ID / GOOGLE_CLOUD_PROJECT / FIREBASE_PROJECT_ID
  # are NOT set here — the deployment template wires them all from
  # metadata.namespace via downward API. PROD ns "octogee" = PROD project,
  # TEST ns "octogee-test" = TEST project. Matches the glm-controller pattern.
  # K8S_NAMESPACE is also downward API, not values-driven.
  # Model broker issuer defaults. Spend caps come from the owner tier unless
  # glmGateways/{gatewayId}.modelBrokerLimits.spendWindowUsd overrides them.
  MODEL_BROKER_REQUESTS_PER_MINUTE: "60"

# Mirrors gateway-edge's secret list — same routes, same secret needs.
# When gateway-edge is later renamed gateway-edge and slimmed to ~3
# locality routes, this list shrinks back to only what octogee-api needs.
secrets:
  - envName: STRIPE_SECRET_KEY
    secretName: stripe-secrets
    secretKey: secret_key
    optional: true
  - envName: STRIPE_WEBHOOK_SECRET
    secretName: stripe-secrets
    secretKey: webhook_secret
    optional: true
  - envName: GITEA_TOKEN
    secretName: gitea-token
    secretKey: token
    optional: true
  - envName: MM_ADMIN_TOKEN
    secretName: mattermost-gateway
    secretKey: admin_token
    optional: true
  - envName: GOOGLE_CLIENT_ID
    secretName: google-oauth
    secretKey: client_id
    optional: true
  - envName: GOOGLE_CLIENT_SECRET
    secretName: google-oauth
    secretKey: client_secret
    optional: true
  - envName: MICROSOFT_CLIENT_ID
    secretName: microsoft-oauth
    secretKey: client_id
    optional: true
  - envName: MICROSOFT_CLIENT_SECRET
    secretName: microsoft-oauth
    secretKey: client_secret
    optional: true
  - envName: GITHUB_CLIENT_ID
    secretName: github-oauth
    secretKey: client_id
    optional: true
  - envName: GITHUB_CLIENT_SECRET
    secretName: github-oauth
    secretKey: client_secret
    optional: true
  - envName: CONNECT_STATE_SECRET
    secretName: connect-state-secret
    secretKey: secret
    optional: true
  - envName: DISCORD_CLIENT_SECRET
    secretName: discord-secrets
    secretKey: client_secret
    optional: true
  - envName: DISCORD_COACH_TOKEN
    secretName: discord-secrets
    secretKey: coach_token
    optional: true
  - envName: DISCORD_MAC_TOKEN
    secretName: discord-secrets
    secretKey: mac_token
    optional: true
  - envName: OCTOGEE_GUILD_ID
    secretName: discord-secrets
    secretKey: guild_id
    optional: true
  - envName: INTERNAL_SERVICE_KEY
    secretName: internal-service-key
    secretKey: key
    optional: false
  # Dedicated bearer for the out-of-cluster Cloud Functions social producer.
  # Optional during rollout; once provisioned it replaces the social route's
  # reliance on internal-service-key.
  - envName: SOCIAL_NOTIFICATION_BEARER_TOKEN
    secretName: social-notification-bearer
    secretKey: bearer-token
    optional: true
  - envName: INVITE_SECRET
    secretName: invite-secret
    secretKey: secret
    optional: true
  - envName: RESEND_API_KEY
    secretName: resend-secrets
    secretKey: api_key
    optional: true
  - envName: RESEND_FROM_EMAIL
    secretName: resend-secrets
    secretKey: from_email
    optional: true
  - envName: RESEND_FROM_NAME
    secretName: resend-secrets
    secretKey: from_name
    optional: true
  - envName: RESEND_WEBHOOK_SECRET
    secretName: resend-secrets
    secretKey: webhook_secret
    optional: true
  - envName: EMAIL_UNSUBSCRIBE_SECRET
    secretName: resend-secrets
    secretKey: unsubscribe_secret
    optional: true
  - envName: GATEWAY_MODEL_KEY_ISSUER_BEARER_TOKEN
    secretName: gateway-model-key-issuer
    secretKey: bearer_token
    optional: false

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

healthCheck:
  path: /health
  port: 3001
  timeoutSec: 30
