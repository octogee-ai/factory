image:
  repository: us-central1-docker.pkg.dev/octogee/octogee/gateway-edge
  tag: latest

replicas: 1
port: 3001

serviceAccountName: octogee-gateway

env:
  # K8s DNS — no hardcoded IPs
  GITEA_URL: ""  # leave empty to auto-compute from K8S_NAMESPACE
  GITEA_ORG: "octogee"
  MM_URL: ""  # leave empty to auto-compute from K8S_NAMESPACE
  FIREBASE_PROJECT_ID: "octogee"
  GCLOUD_PROJECT: "octogee"
  APP_URL: "https://octogee.com"
  CHAT_PROXY_URL: "https://api.octogee.com"
  SITE_URL: "https://octogee.com"
  K8S_NAMESPACE: "octogee"

secrets:
  # References to K8s Secret objects
  - envName: STRIPE_SECRET_KEY
    secretName: stripe-secrets
    secretKey: secret_key
    optional: true
  - envName: STRIPE_WEBHOOK_SECRET
    secretName: stripe-secrets
    secretKey: webhook_secret
    optional: true
  - envName: GITEA_TOKEN
    secretName: gitea-token
    secretKey: token
    optional: true
  - envName: MM_ADMIN_TOKEN
    secretName: mattermost-gateway
    secretKey: admin_token
    optional: true
  - envName: GOOGLE_CLIENT_ID
    secretName: google-oauth
    secretKey: client_id
    optional: true
  - envName: GOOGLE_CLIENT_SECRET
    secretName: google-oauth
    secretKey: client_secret
    optional: true
  - envName: MICROSOFT_CLIENT_ID
    secretName: microsoft-oauth
    secretKey: client_id
    optional: true
  - envName: MICROSOFT_CLIENT_SECRET
    secretName: microsoft-oauth
    secretKey: client_secret
    optional: true
  - envName: DISCORD_CLIENT_SECRET
    secretName: discord-secrets
    secretKey: client_secret
    optional: true
  - envName: DISCORD_COACH_TOKEN
    secretName: discord-secrets
    secretKey: coach_token
    optional: true
  - envName: DISCORD_MAC_TOKEN
    secretName: discord-secrets
    secretKey: mac_token
    optional: true
  - envName: OCTOGEE_GUILD_ID
    secretName: discord-secrets
    secretKey: guild_id
    optional: true
  - envName: INTERNAL_SERVICE_KEY
    secretName: internal-service-key
    secretKey: key
    optional: false
  # Resend — email digest delivery (P6)
  - envName: RESEND_API_KEY
    secretName: resend-secrets
    secretKey: api_key
    optional: true
  - envName: RESEND_FROM_EMAIL
    secretName: resend-secrets
    secretKey: from_email
    optional: true
  - envName: RESEND_FROM_NAME
    secretName: resend-secrets
    secretKey: from_name
    optional: true

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Ingress (public routes only — /api/* and /health)
ingress:
  enabled: true
  host: api.octogee.com
  staticIpName: workspace-api-ip
  certName: workspace-api-cert
  # Service the api ingress backs onto. Defaults to the alias
  # Service `gateway-edge` (rendered by this sub-chart, selects every
  # gateway pod via app=octogee-gateway). The alias survives fresh
  # clusters and any moment between per-instance releases. Override
  # to a per-instance Service like `gateway-edge-canary` if an env
  # wants to pin the data plane to a specific gateway pod.
  targetService: gateway-edge

# RETIRED. This was a sibling Ingress on the same host/IP as `ingress`,
# betting GCE would merge two Ingresses into one URL map — it does not, so
# the sibling never provisioned (no address) and all `/api/g/*` 404'd.
# Cowboy now patches the per-gateway `/api/g/<gatewayId>/*` paths directly
# onto the single `gateway-edge-ingress` (glm-controller/src/fleet-ingress.ts).
# Keep disabled; revisit only if GKE ever supports Ingress merging.
gatewayEdgeFleetIngress:
  enabled: false

# Cloud Armor WAF (policy created by Terraform, referenced by name)
cloudArmor:
  enabled: false
  policyName: octogee-waf

# BackendConfig for health checks
healthCheck:
  path: /health
  port: 3001
  timeoutSec: 30
