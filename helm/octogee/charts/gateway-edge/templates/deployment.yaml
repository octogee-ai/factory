{{- $router := .Values.router | default dict -}}
{{- $routerEnabled := true -}}
{{- if hasKey $router "enabled" -}}
{{- $routerEnabled = $router.enabled -}}
{{- end -}}
{{- if $routerEnabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $router.serviceName | default "gateway-router" }}
  labels:
    {{- include "gateway-edge.labels" . | nindent 4 }}
    app: {{ $router.serviceName | default "gateway-router" }}
spec:
  replicas: {{ $router.replicas | default 2 }}
  selector:
    matchLabels:
      app: {{ $router.serviceName | default "gateway-router" }}
  template:
    metadata:
      labels:
        {{- include "gateway-edge.labels" . | nindent 8 }}
        app: {{ $router.serviceName | default "gateway-router" }}
    spec:
      serviceAccountName: {{ .Values.serviceAccountName }}
      containers:
        - name: gateway-router
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ $router.port | default .Values.port }}
          env:
            - name: GATEWAY_EDGE_MODE
              value: "router"
            - name: PORT
              value: {{ printf "%v" ($router.port | default .Values.port) | quote }}
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: GATEWAY_ROUTER_PREVIEW_HOST
              value: {{ $router.previewHost | default "" | quote }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- $routerResources := $router.resources | default .Values.resources -}}
            {{- toYaml $routerResources | nindent 12 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $router.serviceName | default "gateway-router" }}
  labels:
    {{- include "gateway-edge.labels" . | nindent 4 }}
    app: {{ $router.serviceName | default "gateway-router" }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: {{ $router.serviceName | default "gateway-router" }}
{{- end }}
