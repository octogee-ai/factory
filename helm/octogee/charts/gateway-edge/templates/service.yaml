apiVersion: v1
kind: Service
metadata:
  name: gateway-edge
  labels:
    {{- include "gateway-edge.labels" . | nindent 4 }}
spec:
  # Phase 6.B collocation: gateway-edge now runs as a sidecar inside the
  # octogee-gateway pod. Selector flips from `app: gateway-edge` to the
  # gateway pod's labels so the existing api[-test].octogee.com ingress
  # (still pointed at this Service) routes to the new sidecar port. Same
  # pattern chat-proxy already uses.
  selector:
    app: octogee-gateway
  ports:
    - port: {{ .Values.port }}
      targetPort: {{ .Values.port }}
      name: http
  type: ClusterIP
