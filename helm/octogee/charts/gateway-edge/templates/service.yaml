apiVersion: v1
kind: Service
metadata:
  name: gateway-edge
  labels:
    {{- include "gateway-edge.labels" . | nindent 4 }}
spec:
  # Phase 6.B collocation: gateway-edge now runs as a sidecar inside the
  # octogee-gateway pod. This alias backs legacy bare /api/* fallback
  # paths only; per-gateway /api/g/<gatewayId>/* paths use the standalone
  # chart's gateway-edge-<instance> Services. Keep operator pods out of
  # this alias so generic fallback traffic cannot land on tenant-untrusted
  # gateway-edge sidecars.
  selector:
    app: octogee-gateway
    gateway-profile: standard
  ports:
    - port: {{ .Values.port }}
      targetPort: {{ .Values.port }}
      name: http
  type: ClusterIP
