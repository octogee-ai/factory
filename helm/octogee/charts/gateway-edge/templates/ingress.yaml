{{- $resourcesEnabled := or .Values.ingress.enabled (.Values.ingress.resourcesEnabled | default false) -}}
{{- if $resourcesEnabled }}
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: {{ .Values.ingress.certName }}
spec:
  domains:
    - {{ .Values.ingress.host }}
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: gateway-edge-backend
spec:
  healthCheck:
    type: HTTP
    requestPath: {{ .Values.healthCheck.path }}
    port: {{ .Values.healthCheck.port }}
  # 3600s + connectionDraining: gateway-edge now serves the long-lived
  # WebSocket surfaces (MM WS bridge, OpenClaw WS, builder-shell) folded
  # in from chat-proxy (POST-BENDER-CLEANUP-SPEC §2.7). The per-instance
  # gateway-edge-<instance> Services (fleet seam) reference this backend,
  # so the timeout governs WS connections routed via /api/g/<gw>/*. A long
  # timeout is harmless for the HTTP locality routes (they complete fast).
  timeoutSec: 3600
  connectionDraining:
    drainingTimeoutSec: 300
  {{- if .Values.cloudArmor.enabled }}
  securityPolicy:
    name: {{ .Values.cloudArmor.policyName }}
  {{- end }}
{{- end }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway-edge-ingress
  annotations:
    kubernetes.io/ingress.class: "gce"
    networking.gke.io/managed-certificates: {{ .Values.ingress.certName }}
    kubernetes.io/ingress.global-static-ip-name: {{ .Values.ingress.staticIpName }}
spec:
  ingressClassName: gce
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          {{- /* Default to the alias Service `gateway-edge` (rendered
              by this sub-chart, selects every gateway pod via
              app=octogee-gateway). The alias survives fresh clusters
              and any moment between per-instance releases — the
              per-instance `gateway-edge-<instance>` Services from
              helm/octogee-gateway/ aren't always present. Override to
              a per-instance Service when an env wants to pin the
              data plane to a specific pod. */}}
          {{- $svc := .Values.ingress.targetService | default "gateway-edge" }}
          {{- $glm := .Values.ingress.glmService | default "glm-controller" }}
          {{- $api := .Values.ingress.octogeeApiService | default "octogee-api" }}
          {{- /* Cluster prefixes lifted from gateway-edge → octogee-api per
              docs/specs/POST-BENDER-CLEANUP-SPEC.md §2. GCE Ingress
              evaluates rules in document order; these must precede the
              /api/* catch-all that lands on gateway-edge. Each prefix
              renders BOTH `/api/<p>/*` and `/api/<p>` because GCE
              `/foo/*` does not match the bare `/foo`.

              Locality sub-routes are handled in two ways:
                - /api/workspace/git/STAR — carved out below (more-specific
                  rule placed BEFORE the workspace migration so GCE picks
                  the carve first). Stays on workspace-api because git
                  ops read/write /home/node/.openclaw/customers (pod-local
                  FS).
                - projects/:wid/:pid/deploy-preview — GCE doesn't match
                  wildcard middles, so the app calls this via the
                  gateway-scoped /api/g/:gid/projects/... seam
                  (workspace-api-fleet-ingress). All of /api/projects on
                  THIS ingress safely goes to octogee-api.

              The /api/admin/* catch-all is included; the more-specific
              glm-controller admin paths above keep their precedence
              because they appear earlier in the rules list. */}}
          {{- /* v4 = MM REST proxy (/api/v4/*), auth = credential mint
              (/api/auth/mattermost) — both relocated from the chat-proxy
              sidecar to octogee-api (POST-BENDER-CLEANUP-SPEC §2.7). The
              long-lived MM WebSocket is NOT here: provisioned users reach
              it via the fleet seam (/api/g/<gw>/api/v4/websocket →
              gateway-edge home pod), so the bare /api/v4/* → octogee-api
              is REST-only. */}}
          {{- $octogeeApiPrefixes := list "workspace" "projects" "sharing" "entities" "mattermost" "v4" "auth" "openclaw" "billing" "invites" "integrations" "byosub" "discord" "notifications" "profile" "onboarding" "posts" "agents" "builder" "shells" "admin" }}
          # Cowboy HTTP — fleet routes served from glm-controller so the
          # admin Gateways tab keeps responding when no gateway pods are
          # booted. GCE URL maps prefer most-specific path; these rules
          # take precedence over the /api/* catch-all below. GCE
          # `/foo/*` is "starts with /foo/", so the bare path `/foo`
          # (no trailing slash) does NOT match — it needs its own rule.
          # The original PR #855 comment claimed /* covered the bare
          # path; turns out it doesn't, and bare /api/admin/gateways
          # was 502-ing through to gateway-edge on no-gateway-pod
          # clusters until both rules were present.
          - path: /api/admin/gateways/*
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $glm }}
                port:
                  name: http
          - path: /api/admin/gateways
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $glm }}
                port:
                  name: http
          - path: /api/admin/operations
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $glm }}
                port:
                  name: http
          # restore-jobs needs both the bare path (GET list) AND `/*`
          # (sub-paths like `<jobId>/kick`). GCE `/foo/*` is "starts with
          # /foo/", so it does NOT match the bare path — and `/foo` does
          # NOT match sub-paths. Hit this same pattern previously on
          # `/api/admin/gateways` (PR #855 → 8dd0f709). Without the `/*`
          # rule, the operator's Kick button POSTs to
          # `/api/admin/restore-jobs/<jobId>/kick` and falls through the
          # catch-all `/api/*` to gateway-edge, which 404s if it's
          # running an older image without the kick endpoint.
          - path: /api/admin/restore-jobs/*
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $glm }}
                port:
                  name: http
          - path: /api/admin/restore-jobs
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $glm }}
                port:
                  name: http
          - path: /api/admin/builds
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $glm }}
                port:
                  name: http
          - path: /api/admin/rollouts
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $glm }}
                port:
                  name: http
          - path: /api/admin/customer-distribution
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $glm }}
                port:
                  name: http
          - path: /api/admin/customers/by-slug/*
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $glm }}
                port:
                  name: http
          # Customers tab + per-customer drawer also lifted to glm-controller
          # so it survives no-gateway-pod scenarios. The /api/admin/customer/*
          # prefix matches /customer/:uid + all sub-paths (usage, throttle,
          # audit, ops, csi-refresh, delete). /api/admin/customers/* matches
          # the list + stats endpoints.
          - path: /api/admin/customer/*
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $glm }}
                port:
                  name: http
          - path: /api/admin/customers/*
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $glm }}
                port:
                  name: http
          - path: /api/admin/customers
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $glm }}
                port:
                  name: http
          - path: /api/admin/funnel
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $glm }}
                port:
                  name: http
          # ── workspace/git locality carve-out ────────────────────
          # Must precede the /api/workspace/* rule below so GCE picks
          # the more-specific match first. git ops use the gateway-local
          # /home/node/.openclaw/customers FS; octogee-api can't serve
          # them. App calls these via gatewayPath() so the request lands
          # on the user's home pod via /api/g/:gid/workspace/git/* (the
          # fleet-ingress). This bare /api/workspace/git/* rule covers
          # the legacy round-robin fallback path.
          - path: /api/workspace/git/*
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $svc }}
                port:
                  name: http
          - path: /api/workspace/git
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $svc }}
                port:
                  name: http
          # ── octogee-api cluster prefixes ────────────────────────
          # Rendered AFTER the glm-controller specifics + workspace/git
          # carve above (so the more-specific rules win) and BEFORE the
          # /api/* catch-all (so cluster routes don't fall through to
          # gateway-edge).
          {{- range $prefix := $octogeeApiPrefixes }}
          - path: /api/{{ $prefix }}/*
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $api }}
                port:
                  name: http
          - path: /api/{{ $prefix }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $api }}
                port:
                  name: http
          {{- end }}
          # ── catch-all → gateway-edge ──────────────────────────
          # After PR #1115, /api/workspace/* and /api/projects/* are
          # in the octogee-api migration list above, and the explicit
          # /api/workspace/git/* carve sends git ops to gateway-edge.
          # projects/.../deploy-preview cannot be Ingress-carved (GCE
          # doesn't match wildcard middles); the app uses the gateway-
          # scoped /api/g/:gid/projects/.../deploy-preview seam served
          # by the fleet-ingress instead.
          # This catch-all now backstops only unrecognized /api/* paths
          # — anything not matched by one of the explicit rules above.
          # Kept as defense in depth so an unknown route 404s on
          # gateway-edge with a familiar error shape rather than
          # GCE's default 404 page.
          - path: /api/*
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $svc }}
                port:
                  name: http
          - path: /health
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $svc }}
                port:
                  name: http
{{- end }}
