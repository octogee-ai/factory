{{- $resourcesEnabled := or .Values.ingress.enabled (.Values.ingress.resourcesEnabled | default false) -}}
{{- if $resourcesEnabled }}
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: {{ .Values.ingress.certName }}
spec:
  domains:
    - {{ .Values.ingress.host }}
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: gateway-edge-backend
spec:
  healthCheck:
    type: HTTP
    requestPath: {{ .Values.healthCheck.path }}
    port: {{ .Values.healthCheck.port }}
  # 3600s + connectionDraining: gateway-router carries long-lived WebSocket
  # surfaces and forwards them to the selected gateway-edge sidecar. A long
  # timeout is harmless for the HTTP locality routes (they complete fast).
  timeoutSec: 3600
  connectionDraining:
    drainingTimeoutSec: 300
  {{- if .Values.cloudArmor.enabled }}
  securityPolicy:
    name: {{ .Values.cloudArmor.policyName }}
  {{- end }}
{{- end }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway-edge-ingress
  annotations:
    kubernetes.io/ingress.class: "gce"
    networking.gke.io/managed-certificates: {{ .Values.ingress.certName }}
    kubernetes.io/ingress.global-static-ip-name: {{ .Values.ingress.staticIpName }}
spec:
  ingressClassName: gce
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          {{- $routerSvc := .Values.ingress.gatewayRouterService | default "gateway-router" }}
          {{- $glm := .Values.ingress.glmService | default "glm-controller" }}
          {{- $api := .Values.ingress.octogeeApiService | default "octogee-api" }}
          {{- /* Cluster API default: every bare /api/* request lands on
              octogee-api, which mounts the full cluster route bundle via
              mountClusterRoutes(). Gateway-local public surfaces use /g/*
              and are forwarded by the stable gateway-router Service.

              GCE evaluates path rules in document order. The more-specific
              glm-controller admin routes below must stay before the /api/*
              octogee-api catch-all so the admin fleet surfaces remain live
              even when no gateway pods are booted. */}}
          # Cowboy HTTP — fleet routes served from glm-controller so the
          # admin Gateways tab keeps responding when no gateway pods are
          # booted. GCE URL maps prefer most-specific path; these rules
          # take precedence over the /api/* catch-all below. GCE
          # `/foo/*` is "starts with /foo/", so the bare path `/foo`
          # (no trailing slash) does NOT match — it needs its own rule.
          # The original PR #855 comment claimed /* covered the bare
          # path; turns out it doesn't, and bare /api/admin/gateways
          # was 502-ing through to gateway-edge on no-gateway-pod
          # clusters until both rules were present.
          - path: /api/admin/gateways/*
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $glm }}
                port:
                  name: http
          - path: /api/admin/gateways
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $glm }}
                port:
                  name: http
          - path: /api/admin/operations
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $glm }}
                port:
                  name: http
          - path: /api/admin/fleet-events
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $glm }}
                port:
                  name: http
          # restore-jobs needs both the bare path (GET list) AND `/*`
          # (sub-paths like `<jobId>/kick`). GCE `/foo/*` is "starts with
          # /foo/", so it does NOT match the bare path — and `/foo` does
          # NOT match sub-paths. Hit this same pattern previously on
          # `/api/admin/gateways` (PR #855 → 8dd0f709). Without the `/*`
          # rule, the operator's Kick button POSTs to
          # `/api/admin/restore-jobs/<jobId>/kick` and falls through the
          # catch-all `/api/*` to gateway-edge, which 404s if it's
          # running an older image without the kick endpoint.
          - path: /api/admin/restore-jobs/*
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $glm }}
                port:
                  name: http
          - path: /api/admin/restore-jobs
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $glm }}
                port:
                  name: http
          - path: /api/admin/builds
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $glm }}
                port:
                  name: http
          - path: /api/admin/rollouts
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $glm }}
                port:
                  name: http
          - path: /api/admin/fleet-settings
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $glm }}
                port:
                  name: http
          - path: /api/admin/onboarding-placement/*
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $glm }}
                port:
                  name: http
          - path: /api/admin/onboarding-placement
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $glm }}
                port:
                  name: http
          - path: /api/admin/gateway-migrations/*
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $glm }}
                port:
                  name: http
          - path: /api/admin/builder-candidates
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $glm }}
                port:
                  name: http
          - path: /api/admin/customer-distribution
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $glm }}
                port:
                  name: http
          - path: /api/admin/customers/by-slug/*
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $glm }}
                port:
                  name: http
          # Customers tab + per-customer drawer also lifted to glm-controller
          # so it survives no-gateway-pod scenarios. The /api/admin/customer/*
          # prefix matches /customer/:uid + all sub-paths (usage, throttle,
          # audit, ops, delete). /api/admin/customers/* matches
          # the list + stats endpoints.
          - path: /api/admin/customer/*
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $glm }}
                port:
                  name: http
          - path: /api/admin/customers/*
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $glm }}
                port:
                  name: http
          - path: /api/admin/customers
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $glm }}
                port:
                  name: http
          # ── /g/* gateway-local public router ───────────────────
          - path: /g/*
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $routerSvc }}
                port:
                  name: http
          # ── /api/* cluster default → octogee-api ────────────────
          # octogee-api serves the full cluster API bundle. Gateway-local
          # routes are intentionally not carved out here; callers use
          # /g/<gatewayId>/* so they reach the correct gateway pod.
          - path: /api/*
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $api }}
                port:
                  name: http
          - path: /health
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $routerSvc }}
                port:
                  name: http
{{- end }}
