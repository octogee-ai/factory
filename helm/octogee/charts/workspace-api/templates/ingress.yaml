{{- if .Values.ingress.enabled }}
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: {{ .Values.ingress.certName }}
spec:
  domains:
    - {{ .Values.ingress.host }}
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: workspace-api-backend
spec:
  healthCheck:
    type: HTTP
    requestPath: {{ .Values.healthCheck.path }}
    port: {{ .Values.healthCheck.port }}
  timeoutSec: {{ .Values.healthCheck.timeoutSec }}
  {{- if .Values.cloudArmor.enabled }}
  securityPolicy:
    name: {{ .Values.cloudArmor.policyName }}
  {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: workspace-api-ingress
  annotations:
    kubernetes.io/ingress.class: "gce"
    networking.gke.io/managed-certificates: {{ .Values.ingress.certName }}
    kubernetes.io/ingress.global-static-ip-name: {{ .Values.ingress.staticIpName }}
spec:
  ingressClassName: gce
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          {{- /* Default to the alias Service `workspace-api` (rendered
              by this sub-chart, selects every gateway pod via
              app=octogee-gateway). The alias survives fresh clusters
              and any moment between per-instance releases — the
              per-instance `workspace-api-<instance>` Services from
              helm/octogee-gateway/ aren't always present. Override to
              a per-instance Service when an env wants to pin the
              data plane to a specific pod. */}}
          {{- $svc := .Values.ingress.targetService | default "workspace-api" }}
          {{- $glm := .Values.ingress.glmService | default "glm-controller" }}
          {{- $api := .Values.ingress.octogeeApiService | default "octogee-api" }}
          {{- /* Cluster prefixes lifted from workspace-api → octogee-api per
              docs/specs/POST-BENDER-CLEANUP-SPEC.md §2. GCE Ingress
              evaluates rules in document order; these must precede the
              /api/* catch-all that lands on workspace-api. Each prefix
              renders BOTH `/api/<p>/*` and `/api/<p>` because GCE
              `/foo/*` does not match the bare `/foo`.

              NOT in this list (deferred — have locality sub-routes):
                - workspace (has /git tied to gateway-local FS)
                - projects  (has /:wid/:pid/deploy-preview tied to gateway-local site-build-api)
              The /api/admin/* catch-all is included; the more-specific
              glm-controller admin paths above keep their precedence
              because they appear earlier in the rules list. */}}
          {{- $octogeeApiPrefixes := list "sharing" "entities" "mattermost" "openclaw" "billing" "invites" "integrations" "byosub" "discord" "notifications" "profile" "onboarding" "posts" "agents" "builder" "admin" }}
          # Cowboy HTTP — fleet routes served from glm-controller so the
          # admin Gateways tab keeps responding when no gateway pods are
          # booted. GCE URL maps prefer most-specific path; these rules
          # take precedence over the /api/* catch-all below. GCE
          # `/foo/*` is "starts with /foo/", so the bare path `/foo`
          # (no trailing slash) does NOT match — it needs its own rule.
          # The original PR #855 comment claimed /* covered the bare
          # path; turns out it doesn't, and bare /api/admin/gateways
          # was 502-ing through to workspace-api on no-gateway-pod
          # clusters until both rules were present.
          - path: /api/admin/gateways/*
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $glm }}
                port:
                  name: http
          - path: /api/admin/gateways
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $glm }}
                port:
                  name: http
          - path: /api/admin/operations
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $glm }}
                port:
                  name: http
          # restore-jobs needs both the bare path (GET list) AND `/*`
          # (sub-paths like `<jobId>/kick`). GCE `/foo/*` is "starts with
          # /foo/", so it does NOT match the bare path — and `/foo` does
          # NOT match sub-paths. Hit this same pattern previously on
          # `/api/admin/gateways` (PR #855 → 8dd0f709). Without the `/*`
          # rule, the operator's Kick button POSTs to
          # `/api/admin/restore-jobs/<jobId>/kick` and falls through the
          # catch-all `/api/*` to workspace-api, which 404s if it's
          # running an older image without the kick endpoint.
          - path: /api/admin/restore-jobs/*
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $glm }}
                port:
                  name: http
          - path: /api/admin/restore-jobs
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $glm }}
                port:
                  name: http
          - path: /api/admin/builds
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $glm }}
                port:
                  name: http
          - path: /api/admin/rollouts
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $glm }}
                port:
                  name: http
          - path: /api/admin/customer-distribution
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $glm }}
                port:
                  name: http
          - path: /api/admin/customers/by-slug/*
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $glm }}
                port:
                  name: http
          # Customers tab + per-customer drawer also lifted to glm-controller
          # so it survives no-gateway-pod scenarios. The /api/admin/customer/*
          # prefix matches /customer/:uid + all sub-paths (usage, throttle,
          # audit, ops, csi-refresh, delete). /api/admin/customers/* matches
          # the list + stats endpoints.
          - path: /api/admin/customer/*
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $glm }}
                port:
                  name: http
          - path: /api/admin/customers/*
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $glm }}
                port:
                  name: http
          - path: /api/admin/customers
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $glm }}
                port:
                  name: http
          - path: /api/admin/funnel
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $glm }}
                port:
                  name: http
          # ── octogee-api cluster prefixes ────────────────────────
          # Rendered AFTER the glm-controller specifics above (so admin
          # paths stay on glm) and BEFORE the /api/* catch-all (so
          # cluster routes don't fall through to workspace-api).
          {{- range $prefix := $octogeeApiPrefixes }}
          - path: /api/{{ $prefix }}/*
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $api }}
                port:
                  name: http
          - path: /api/{{ $prefix }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $api }}
                port:
                  name: http
          {{- end }}
          # ── catch-all → workspace-api ──────────────────────────
          # Receives /api/workspace/*, /api/projects/*, and anything
          # else not explicitly carved out above. Both prefixes have
          # locality sub-routes (workspace/git, projects/*/deploy-
          # preview) that must stay on the gateway-pod sidecar; they're
          # deferred to a follow-up PR that handles the sub-path carve.
          - path: /api/*
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $svc }}
                port:
                  name: http
          - path: /health
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $svc }}
                port:
                  name: http
{{- end }}
