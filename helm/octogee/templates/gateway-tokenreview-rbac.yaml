{{- if .Values.gatewayFleet.tokenReviewRbac.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: octogee-gateway-tokenreviewer-{{ .Release.Namespace }}
  labels:
    {{- include "octogee.labels" . | nindent 4 }}
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: octogee-gateway-tokenreview-{{ .Release.Namespace }}
  labels:
    {{- include "octogee.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: octogee-gateway-tokenreviewer-{{ .Release.Namespace }}
subjects:
  # Dynamic operator gateways use generated KSAs such as octogee-gw-eggman.
  # Kubernetes RBAC cannot prefix-match subjects, so the platform-owned
  # umbrella grants the narrow TokenReview create verb to service accounts in
  # this namespace instead of letting Cowboy manage cluster-scoped bindings.
  - kind: Group
    name: system:serviceaccounts:{{ .Release.Namespace }}
    apiGroup: rbac.authorization.k8s.io
{{- end }}
