{{- if .Values.mattermost.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ .Release.Name }}-test-mm-admin-token"
  labels:
    {{- include "octogee.labels" . | nindent 4 }}
    app: octogee-mm-admin-token-test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  serviceAccountName: octogee-gateway
  restartPolicy: Never
  containers:
    - name: test-mm-token
      image: curlimages/curl:8.7.1
      command:
        - sh
        - -ec
        - |
          echo "=== Validating MM_ADMIN_TOKEN against Mattermost API ==="

          if [ -z "$MM_ADMIN_TOKEN" ] || [ -z "$MM_ADMIN_USER" ] || [ -z "$MM_ADMIN_USER_ID" ]; then
            echo "FAIL: Mattermost admin contract inputs are empty or not injected"
            exit 1
          fi

          echo "Admin contract inputs present"

          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $MM_ADMIN_TOKEN" \
            "http://mattermost.{{ .Release.Namespace }}.svc.cluster.local:8065/api/v4/users/me")

          echo "Mattermost /api/v4/users/me → HTTP $HTTP_CODE"

          if [ "$HTTP_CODE" = "200" ]; then
            MM_ME=$(curl -s \
              -H "Authorization: Bearer $MM_ADMIN_TOKEN" \
              "http://mattermost.{{ .Release.Namespace }}.svc.cluster.local:8065/api/v4/users/me")
            if ! printf '%s' "$MM_ME" | grep -Fq "\"id\":\"$MM_ADMIN_USER_ID\"" \
              || ! printf '%s' "$MM_ME" | grep -Fq "\"username\":\"$MM_ADMIN_USER\"" \
              || ! printf '%s' "$MM_ME" | grep -Fq 'system_admin'; then
              echo "FAIL: Admin token does not resolve to the configured system administrator"
              exit 1
            fi
            echo "PASS: Admin token resolves to the configured system administrator"
            exit 0
          elif [ "$HTTP_CODE" = "401" ]; then
            echo "FAIL: Token is expired or revoked (401 Unauthorized)"
            echo "Fix: Re-run ./scripts/setup-mattermost.sh --env=ENV to generate a fresh PAT"
            exit 1
          else
            echo "FAIL: Unexpected response ($HTTP_CODE) — is Mattermost running?"
            exit 1
          fi
      env:
        - name: MM_ADMIN_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ .Values.global.mattermost.adminSecret.name }}
              key: {{ .Values.global.mattermost.adminSecret.tokenKey | default "admin_token" }}
        - name: MM_ADMIN_USER
          valueFrom:
            secretKeyRef:
              name: {{ .Values.global.mattermost.adminSecret.name }}
              key: admin_user
        - name: MM_ADMIN_USER_ID
          valueFrom:
            secretKeyRef:
              name: {{ .Values.global.mattermost.adminSecret.name }}
              key: admin_user_id
{{- end }}
