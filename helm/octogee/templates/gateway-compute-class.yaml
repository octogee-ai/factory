{{- if .Values.gatewayFleet.computeClass.enabled }}
{{- $zones := .Values.gatewayFleet.computeClass.zones }}
apiVersion: cloud.google.com/v1
kind: ComputeClass
metadata:
  name: {{ required "gatewayFleet.computeClass.name is required" .Values.gatewayFleet.computeClass.name }}
  labels:
    {{- include "octogee.labels" . | nindent 4 }}
spec:
  autopilot:
    enabled: true
  priorities:
    # podFamily is only honored in built-in Autopilot classes; in a custom
    # ComputeClass it satisfies no rule and DoNotScaleUp then never provisions.
    - spot: true
      location:
        zones:
          {{- toYaml $zones | nindent 10 }}
        locationPolicy: ANY
    - spot: false
      location:
        zones:
          {{- toYaml $zones | nindent 10 }}
        locationPolicy: ANY
  activeMigration:
    optimizeRulePriority: true
  nodePoolAutoCreation:
    enabled: true
  whenUnsatisfiable: DoNotScaleUp
{{- end }}
