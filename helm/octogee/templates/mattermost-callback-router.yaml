{{- $gatewayEdge := index .Values "gateway-edge" -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mattermost-callback-router
  labels:
    app: mattermost-callback-router
    {{- include "octogee.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mattermost-callback-router
  labels:
    app: mattermost-callback-router
    {{- include "octogee.labels" . | nindent 4 }}
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mattermost-callback-router
  template:
    metadata:
      labels:
        app: mattermost-callback-router
    spec:
      serviceAccountName: mattermost-callback-router
      {{- with .Values.global.platformComputeClass }}
      nodeSelector:
        cloud.google.com/compute-class: {{ . | quote }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: router
          image: "{{ $gatewayEdge.image.repository }}:{{ $gatewayEdge.image.tag }}@{{ required "gateway-edge.image.digest is required" $gatewayEdge.image.digest }}"
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: GATEWAY_EDGE_MODE
              value: agent-control-router
            - name: PORT
              value: "3001"
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: AGENT_CONTROL_ROUTER_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-control-router
                  key: secret
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mattermost-callback-router
  labels:
    app: mattermost-callback-router
    {{- include "octogee.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: mattermost-callback-router
  ports:
    - name: http
      port: 3001
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mattermost-callback-router
spec:
  podSelector:
    matchLabels:
      app: mattermost-callback-router
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: mattermost
      ports:
        - protocol: TCP
          port: 3001
  egress:
    - to:
        - ipBlock:
            cidr: 169.254.20.10/32
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app: octogee-gateway
      ports:
        - protocol: TCP
          port: 3001
