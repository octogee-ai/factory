{{- $gatewayEdge := index .Values "gateway-edge" -}}
{{- $computer := (.Values.global).computer | default dict -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mattermost-callback-router
  labels:
    app: mattermost-callback-router
    {{- include "octogee.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mattermost-callback-router
  labels:
    app: mattermost-callback-router
    {{- include "octogee.labels" . | nindent 4 }}
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mattermost-callback-router
  template:
    metadata:
      labels:
        app: mattermost-callback-router
    spec:
      {{- with (.Values.global).nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: mattermost-callback-router
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: router
          image: "{{ required "gateway-edge.image.repository is required" $gatewayEdge.image.repository }}:{{ required "gateway-edge.image.tag is required" $gatewayEdge.image.tag }}@{{ required "gateway-edge.image.digest is required" $gatewayEdge.image.digest }}"
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: LOG_LEVEL
              value: {{ (.Values.global).logLevel | default "info" | quote }}
            - name: GATEWAY_EDGE_MODE
              value: agent-control-router
            - name: PORT
              value: "3001"
            - name: PUBLIC_APP_ORIGINS
              value: {{ join "," (required "global.publicAppOrigins is required" (.Values.global).publicAppOrigins) | quote }}
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: AGENT_CONTROL_ROUTER_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-control-router
                  key: secret
            {{- if $computer.enabled }}
            - name: GATEWAY_VM_ROUTES_FILE
              value: /etc/octogee/vm-routes/routes.json
            {{- end }}
          {{- if $computer.enabled }}
          volumeMounts:
            - name: vm-routes
              mountPath: /etc/octogee/vm-routes
              readOnly: true
          {{- end }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 72
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 250m
              memory: 256Mi
      {{- if $computer.enabled }}
      volumes:
        - name: vm-routes
          configMap:
            name: octogee-vm-routes
            optional: true
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: mattermost-callback-router
  labels:
    app: mattermost-callback-router
    {{- include "octogee.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: mattermost-callback-router
  ports:
    - name: http
      port: 3001
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mattermost-callback-router
spec:
  podSelector:
    matchLabels:
      app: mattermost-callback-router
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: mattermost
      ports:
        - protocol: TCP
          port: 3001
  egress:
    - to:
        - ipBlock:
            cidr: 169.254.20.10/32
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app: octogee-gateway
      ports:
        - protocol: TCP
          port: 3001
    - to:
        - podSelector:
            matchLabels:
              app: octogee-api
      ports:
        - protocol: TCP
          port: 3001
    {{- if $computer.enabled }}
    - to:
        - ipBlock:
            cidr: {{ required "global.computer.cidr is required" $computer.cidr }}
      ports:
        - protocol: TCP
          port: 3001
    {{- end }}
