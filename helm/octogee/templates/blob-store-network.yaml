{{- if eq ((.Values.global).blobStoreBackend | default "s3") "s3" }}
{{- with .Values.networkPolicy.blobStoreEgress }}
{{- $labels := required "networkPolicy.blobStoreEgress.matchLabels is required" .matchLabels }}
{{- $port := required "networkPolicy.blobStoreEgress.port is required" .port }}
{{- $defaultDeny := $.Values.networkPolicy.enforceDefaultDeny }}
{{- $gateway := $.Values.gatewayFleet.networkPolicy.enabled }}
{{- if or $defaultDeny $gateway }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: blob-store-egress
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          {{- if $defaultDeny }}
          - octogee-api
          - glm-controller
          {{- end }}
          {{- if $gateway }}
          - octogee-gateway
          {{- end }}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- toYaml $labels | nindent 14 }}
      ports: [{ protocol: TCP, port: {{ $port }} }]
{{- end }}
{{- if $defaultDeny }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: blob-store-ingress
spec:
  podSelector:
    matchLabels:
      {{- toYaml $labels | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [octogee-api, glm-controller, octogee-gateway]
      ports: [{ protocol: TCP, port: {{ $port }} }]
{{- end }}
{{- end }}
{{- end }}
