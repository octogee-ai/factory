{{- if .Values.edgeIngress.enabled }}
{{- $name := .Values.edgeIngress.name | default "octogee-edge-ingress" -}}
# Metadata-only Ingress. Helm owns the object, its annotations (managed certs,
# static IP, ingress class) and ingressClassName, but deliberately NOT
# .spec.rules: that is an atomic server-side-apply field with a single owner,
# and Cowboy (glm-controller) is that owner. It applies the full rule set —
# the static base routes (octogee.edgeBaseRoutes, published via the
# octogee-edge-routes ConfigMap) plus the per-gateway locality paths — so the
# umbrella deploy never fights Cowboy over spec.rules. On a fresh install the
# LB provisions once Cowboy writes the first rules.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  annotations:
    kubernetes.io/ingress.class: "gce"
    networking.gke.io/managed-certificates: {{ join "," .Values.edgeIngress.managedCertificates | quote }}
    kubernetes.io/ingress.global-static-ip-name: {{ .Values.edgeIngress.staticIpName }}
spec:
  ingressClassName: gce
{{- end }}
