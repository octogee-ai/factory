{{- if .Values.edgeIngress.enabled }}
{{- $name := .Values.edgeIngress.name | default "octogee-edge-ingress" -}}
{{- $hosts := .Values.edgeIngress.hosts -}}
{{- $gatewayEdge := index .Values "gateway-edge" -}}
{{- $apiSvc := $gatewayEdge.ingress.octogeeApiService | default "octogee-api" -}}
{{- $edgeSvc := $gatewayEdge.ingress.targetService | default "gateway-edge" -}}
{{- $glmSvc := $gatewayEdge.ingress.glmService | default "glm-controller" -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  annotations:
    kubernetes.io/ingress.class: "gce"
    networking.gke.io/managed-certificates: {{ join "," .Values.edgeIngress.managedCertificates | quote }}
    kubernetes.io/ingress.global-static-ip-name: {{ .Values.edgeIngress.staticIpName }}
spec:
  ingressClassName: gce
  rules:
    - host: {{ $hosts.api }}
      http:
        paths:
          - path: /api/admin/gateways/*
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $glmSvc }}
                port:
                  name: http
          - path: /api/admin/gateways
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $glmSvc }}
                port:
                  name: http
          - path: /api/admin/operations
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $glmSvc }}
                port:
                  name: http
          - path: /api/admin/restore-jobs/*
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $glmSvc }}
                port:
                  name: http
          - path: /api/admin/restore-jobs
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $glmSvc }}
                port:
                  name: http
          - path: /api/admin/builds
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $glmSvc }}
                port:
                  name: http
          - path: /api/admin/rollouts
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $glmSvc }}
                port:
                  name: http
          - path: /api/admin/customer-distribution
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $glmSvc }}
                port:
                  name: http
          - path: /api/admin/customers/by-slug/*
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $glmSvc }}
                port:
                  name: http
          - path: /api/admin/customer/*
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $glmSvc }}
                port:
                  name: http
          - path: /api/admin/customers/*
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $glmSvc }}
                port:
                  name: http
          - path: /api/admin/customers
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $glmSvc }}
                port:
                  name: http
          - path: /api/admin/funnel
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $glmSvc }}
                port:
                  name: http
          # Cluster API default. Gateway-local locality routes must use the
          # per-instance /api/g/<gatewayId>/* seam; bare /api/* goes to the
          # singleton octogee-api so newly mounted cluster routes cannot fall
          # through to the gateway-edge sidecar.
          - path: /api/*
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $apiSvc }}
                port:
                  name: http
          - path: /health
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $edgeSvc }}
                port:
                  name: http
    - host: {{ $hosts.git }}
      http:
        paths:
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: octogee-gitea-http
                port:
                  number: 3000
    - host: {{ $hosts.mattermost }}
      http:
        paths:
          - path: /*
            pathType: ImplementationSpecific
            backend:
              service:
                name: mattermost
                port:
                  number: 8065
    - host: {{ $hosts.preview }}
      http:
        paths:
          - path: /health
            pathType: ImplementationSpecific
            backend:
              service:
                name: octogee-gateway
                port:
                  number: 9080
{{- end }}
