apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-scrape
spec:
  # Scope tightly to gitea. An empty podSelector ({}) would pull EVERY pod under
  # NetworkPolicy control — and a pod with no prior policy is default-allow, so
  # selecting it silently flips it to default-deny and drops all ingress not
  # listed here (this took cloud-sql-proxy's :5432 offline and 502'd prod login).
  # gitea already carries the gitea-ingress policy, so adding a rule here is
  # purely additive and flips nothing. Mattermost metrics are Enterprise-licensed
  # (404 unlicensed) so there's nothing to scrape; restricted gateways get their
  # monitoring allowance from the builder-shell policy instead.
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gitea
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 3000  # gitea /metrics (shares the http port)
