{{- if .Values.gatewayFleet.capacityObservationRbac.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: glm-controller-node-reader-{{ .Release.Namespace }}
  labels:
    {{- include "octogee.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: glm-controller-node-reader-{{ .Release.Namespace }}
  labels:
    {{- include "octogee.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: glm-controller-node-reader-{{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: glm-controller
    namespace: {{ .Release.Namespace }}
{{- end }}
