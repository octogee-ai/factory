{{- if .Values.gatewayFleet.capacityObservationRbac.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: glm-controller-node-reader-{{ .Release.Namespace }}
  labels:
    {{- include "octogee.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  # The disruption observer correlates NodeShutdown events from kube-system and
  # gke-* namespaces back to the gateway pod that was on the node. It reads
  # pod metadata only; it never mutates cluster-scoped workloads.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: glm-controller-node-reader-{{ .Release.Namespace }}
  labels:
    {{- include "octogee.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: glm-controller-node-reader-{{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: glm-controller
    namespace: {{ .Release.Namespace }}
{{- end }}
