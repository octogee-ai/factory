apiVersion: v1
kind: Service
metadata:
  name: octogee-gateway-{{ .Values.instanceName }}
  labels:
    {{- include "octogee-gateway.labels" . | nindent 4 }}
  annotations:
    cloud.google.com/backend-config: |
      {"ports":{"9080":"preview-backend","{{ .Values.env.fleetControllerPort | default "3003" }}":"octogee-gateway-fleet-control"}}
spec:
  selector:
    app: octogee-gateway
    gateway-instance: {{ .Values.instanceName }}
  ports:
    - name: http
      port: 18789
      targetPort: 18789
    - name: metrics
      port: 9091
      targetPort: 9091
    - name: preview
      port: 9080
      targetPort: 9080
    - name: fleet-http
      port: {{ .Values.env.fleetControllerPort | default "3003" }}
      targetPort: {{ .Values.env.fleetControllerPort | default "3003" }}
    {{- if eq .Values.profile "operator" }}
    - name: builder-shell
      port: {{ .Values.env.builderShellPort | default "3005" }}
      targetPort: {{ .Values.env.builderShellPort | default "3005" }}
    {{- end }}
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: workspace-api-{{ .Values.instanceName }}
  labels:
    {{- include "octogee-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/name: workspace-api
spec:
  selector:
    app: octogee-gateway
    gateway-instance: {{ .Values.instanceName }}
  ports:
    - name: http
      port: {{ .Values.workspaceApi.port }}
      targetPort: {{ .Values.workspaceApi.port }}
  type: ClusterIP
