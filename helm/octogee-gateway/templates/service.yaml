apiVersion: v1
kind: Service
metadata:
  name: octogee-gateway-{{ .Values.instanceName }}
  labels:
    {{- include "octogee-gateway.labels" . | nindent 4 }}
  annotations:
    cloud.google.com/backend-config: |
      {"ports":{"9080":"preview-backend","{{ .Values.env.fleetControllerPort | default "3003" }}":"octogee-gateway-fleet-control"}}
spec:
  selector:
    app: octogee-gateway
    gateway-instance: {{ .Values.instanceName }}
  ports:
    - name: http
      port: 18789
      targetPort: 18789
    - name: metrics
      port: 9091
      targetPort: 9091
    - name: preview
      port: 9080
      targetPort: 9080
    - name: fleet-http
      port: {{ .Values.env.fleetControllerPort | default "3003" }}
      targetPort: {{ .Values.env.fleetControllerPort | default "3003" }}
    {{- if eq .Values.profile "operator" }}
    - name: builder-shell
      port: {{ .Values.env.builderShellPort | default "3005" }}
      targetPort: {{ .Values.env.builderShellPort | default "3005" }}
    {{- end }}
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-edge-{{ .Values.instanceName }}
  labels:
    {{- include "octogee-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/name: gateway-edge
spec:
  selector:
    app: octogee-gateway
    gateway-instance: {{ .Values.instanceName }}
  ports:
    - name: http
      port: {{ .Values.gatewayEdge.port }}
      targetPort: {{ .Values.gatewayEdge.port }}
  type: ClusterIP
---
# Per-instance chat-proxy Service. Selects ONLY the chat-proxy sidecar
# in this gateway's pod. Used by chat-proxy-fleet-ingress (chat.octogee.com)
# to route /g/<gatewayId>/* to the correct gateway pod so the chat-proxy
# bridges upstream same-pod (127.0.0.1:18789) to the matching openclaw
# sidecar. Same NEG annotation as the legacy `chat-proxy` Service.
apiVersion: v1
kind: Service
metadata:
  name: chat-proxy-{{ .Values.instanceName }}
  labels:
    {{- include "octogee-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/name: chat-proxy
  annotations:
    cloud.google.com/neg: '{"ingress":true}'
    cloud.google.com/backend-config: '{"default":"chat-proxy-backend"}'
spec:
  selector:
    app: octogee-gateway
    gateway-instance: {{ .Values.instanceName }}
  ports:
    - name: http
      port: {{ .Values.chatProxy.port | default 8080 }}
      targetPort: chat-proxy
    - name: metrics
      port: {{ .Values.chatProxy.metricsPort | default 9092 }}
      targetPort: cp-metrics
  type: ClusterIP
