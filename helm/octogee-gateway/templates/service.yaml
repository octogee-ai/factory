{{- $operatorShellsEnabled := and (eq .Values.profile "operator") (.Values.operatorAccess.shellsEnabled | default false) -}}
apiVersion: v1
kind: Service
metadata:
  name: octogee-gateway-{{ .Values.gatewayId }}
  labels:
    {{- include "octogee-gateway.labels" . | nindent 4 }}
  annotations:
    cloud.google.com/backend-config: |
      {"ports":{"9080":"preview-backend"}}
spec:
  selector:
    app: octogee-gateway
    gateway-instance: {{ .Values.gatewayId }}
  ports:
    - name: http
      port: 18789
      targetPort: 18789
    - name: metrics
      port: 9091
      targetPort: 9091
    - name: runner-metrics
      port: 9092
      targetPort: 9092
    - name: preview
      port: 9080
      targetPort: 9080
    - name: fleet-http
      port: {{ .Values.env.fleetControllerPort | default "3003" }}
      targetPort: {{ .Values.env.fleetControllerPort | default "3003" }}
    {{- if $operatorShellsEnabled }}
    - name: builder-shell
      port: {{ .Values.env.builderShellPort | default "3005" }}
      targetPort: {{ .Values.env.builderShellPort | default "3005" }}
    {{- end }}
  type: ClusterIP
---
# Per-instance gateway-edge Service — the fleet seam. gateway-edge-fleet-
# ingress (api.octogee.com) routes /api/g/<gatewayId>/* here so the
# request lands on this gateway's pod. After the chat-proxy fold
# (POST-BENDER-CLEANUP-SPEC §2.7) this single port (3001) carries the
# HTTP locality routes AND the long-lived WS surfaces, so it references
# the gateway-edge-backend BackendConfig (3600s timeout + draining) and
# the NEG annotation the GCE Ingress needs.
apiVersion: v1
kind: Service
metadata:
  name: gateway-edge-{{ .Values.gatewayId }}
  labels:
    {{- include "octogee-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/name: gateway-edge
  annotations:
    cloud.google.com/neg: '{"ingress":true}'
    cloud.google.com/backend-config: '{"default":"gateway-edge-backend"}'
spec:
  selector:
    app: octogee-gateway
    gateway-instance: {{ .Values.gatewayId }}
  ports:
    - name: http
      port: {{ .Values.gatewayEdge.port }}
      targetPort: {{ .Values.gatewayEdge.port }}
  type: ClusterIP
