{{- if ne .Values.networkPolicy.enabled false }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: octogee-gateway-ingress-{{ include "octogee-gateway.revisionId" . }}
  labels:
    {{- include "octogee-gateway.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: octogee-gateway
      gateway-instance: {{ include "octogee-gateway.revisionId" . }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway-router
      ports:
        - protocol: TCP
          port: {{ .Values.gatewayEdge.port }}
        - protocol: TCP
          port: 9080
    - from:
        - podSelector:
            matchLabels:
              app: glm-controller
      ports:
        - protocol: TCP
          port: {{ .Values.env.fleetControllerPort | default "3003" }}
    - from:
        - podSelector:
            matchLabels:
              app: mattermost-callback-router
        - podSelector:
            matchLabels:
              app: octogee-api
      ports:
        - protocol: TCP
          port: {{ .Values.gatewayEdge.port }}
    - from:
        - podSelector:
            matchLabels:
              app: octogee-gateway
      ports:
        - protocol: TCP
          port: {{ .Values.env.fleetControllerPort | default "3003" }}
        - protocol: TCP
          port: {{ .Values.env.migrationRsyncPort | default "30873" }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gke-gmp-system
      ports:
        - protocol: TCP
          port: 9092
{{- end }}
