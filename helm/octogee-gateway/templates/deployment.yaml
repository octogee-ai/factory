{{- include "octogee-gateway.requireIdentity" . -}}
{{- $tier := include "octogee-gateway.effectiveTier" . -}}
{{- $preset := index .Values.tiers $tier -}}
{{- $gatewayClass := include "octogee-gateway.gatewayClass" . -}}
{{- $imageProfile := include "octogee-gateway.imageProfile" . -}}
{{- $operatorShellsEnabled := and (eq $gatewayClass "operator") (.Values.operatorAccess.shellsEnabled | default false) -}}
{{- if not $preset -}}
{{- fail (printf "octogee-gateway: no preset defined for sizingTier=%q (add it under .Values.tiers in values.yaml)" $tier) -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: octogee-gateway-{{ .Values.gatewayId }}
  labels:
    app: octogee-gateway
    gateway-class: {{ $gatewayClass | quote }}
    gateway-profile: {{ $imageProfile | quote }}
    {{- include "octogee-gateway.labels" . | nindent 4 }}
spec:
  # Use kindIs to distinguish "explicit 0 (paused)" from "unset (default to 1)" —
  # helm's `default` treats 0 as falsy and would replace it with the fallback.
  replicas: {{ if kindIs "invalid" .Values.replicas }}1{{ else }}{{ .Values.replicas }}{{ end }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: octogee-gateway
      gateway-instance: {{ .Values.gatewayId }}
  template:
    metadata:
      labels:
        app: octogee-gateway
        gateway-instance: {{ .Values.gatewayId }}
        gateway-class: {{ $gatewayClass | quote }}
        # Profile label lets the umbrella gateway-edge alias Service
        # safely exclude operator pods in a follow-up rollout after every
        # gateway pod has this label.
        gateway-profile: {{ $imageProfile | quote }}
        # Per-pod sizing tier — stamped on the pod (and matching PVC) so
        # GCP Billing Export can roll up cost by tier for the chargeback
        # surface (GATEWAY-PLATFORM-SPEC §Phase 5a).
        tier: {{ $tier | quote }}
        # Build tag this pod rolled to — `kubectl get pods -L gateway-image`
        # makes a blue/green or rolling update legible at a glance (the
        # pod-template-hash already changes per image but isn't readable back to
        # a SHA). Pod-template label ONLY, never the selector — selectors must
        # stay stable across rolls.
        gateway-image: {{ .Values.image.tag | default .Values.imageTag | quote }}
    spec:
      nodeSelector:
        cloud.google.com/compute-class: {{ include "octogee-gateway.computeClass" . | quote }}
        {{- if .Values.machineFamily }}
        cloud.google.com/machine-family: {{ .Values.machineFamily | quote }}
        {{- end }}
      serviceAccountName: {{ include "octogee-gateway.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fix-perms
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Values.imageTag }}"
          command:
            - sh
            - -c
            - |
              # First-boot seed: copy shell defaults (.bashrc, .profile,
              # .bash_logout) into the data volume the first time home is
              # empty. `cp -an` is archive + no-clobber → idempotent, so
              # subsequent boots leave existing local files alone. Durable
              # state must come from the substrate; this volume is a cache
              # unless a gateway explicitly opts into legacy persistence.
              cp -an /etc/skel/. /home/node/ 2>/dev/null || true
              chown -R 1000:1000 /home/node || true
              mkdir -p /home/node/.npm-cache && chown -R 1000:1000 /home/node/.npm-cache || true
          env:
            # OPENCLAW_GATEWAY_TOKEN is platform-owned: Cowboy creates the
            # per-gateway K8s secret `gateway-auth-token-<gatewayId>` with a
            # random hex value before this chart installs, and the same
            # secretKeyRef appears on all three containers (init / gateway /
            # gateway-edge) so they agree on the token without any in-pod
            # generation. Init seeds the PVC and the template that envsubst's
            # OPENCLAW_GATEWAY_TOKEN into openclaw.json reads it from this env.
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gateway-auth-token-{{ .Values.gatewayId }}
                  key: token
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: data
              mountPath: /home/node
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
        {{- if ne $gatewayClass "operator" }}
        - name: mac-ops-bootstrap
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Values.imageTag }}"
          command:
            - sh
            - -c
            - |
              set -eu
              export OPENCLAW_DIR=/home/node/.openclaw
              mkdir -p "$OPENCLAW_DIR/customers" "$OPENCLAW_DIR/identity" "$OPENCLAW_DIR/secrets" "$OPENCLAW_DIR/agents"
              OPERATOR_ENV="$OPENCLAW_DIR/secrets/operator.env"
              if [ -f "$OPERATOR_ENV" ]; then
                set -a
                . "$OPERATOR_ENV"
                set +a
              fi
              if [ ! -f "$OPENCLAW_DIR/openclaw.json" ]; then
                envsubst < /octogee/infra/gateway/openclaw.template.json > "$OPENCLAW_DIR/openclaw.json"
                chmod 600 "$OPENCLAW_DIR/openclaw.json"
              fi
              node /octogee/scripts/bootstrap-mac-ops.mjs || true
          env:
            - name: GATEWAY_ID
              value: {{ .Values.gatewayId | quote }}
            - name: MM_URL
              value: {{ .Values.env.mmUrl | default (printf "http://mattermost.%s.svc.cluster.local:8065" .Release.Namespace) | quote }}
            - name: MM_SITE_URL
              value: {{ .Values.env.mmSiteUrl | default .Values.env.mmUrl | default (printf "http://mattermost.%s.svc.cluster.local:8065" .Release.Namespace) | quote }}
            - name: MM_INTERACTIONS_CALLBACK_BASE_URL
              value: {{ .Values.env.mmInteractionsCallbackBaseUrl | default (printf "http://octogee-gateway-%s.%s.svc.cluster.local:18789" .Values.gatewayId .Release.Namespace) | quote }}
            - name: MM_INTERACTIONS_ALLOWED_SOURCE_IPS
              value: {{ .Values.env.mmInteractionsAllowedSourceIps | quote }}
            - name: FLEET_BROKER_URL
              value: {{ .Values.fleetBrokerUrl | default (printf "http://octogee-api.%s.svc.cluster.local:3001" .Release.Namespace) | quote }}
            - name: OCTOGEE_API_SA_TOKEN_PATH
              value: "/var/run/secrets/octogee-gateway-broker/token"
          volumeMounts:
            - name: data
              mountPath: /home/node
            - name: gateway-broker-sa-token
              mountPath: /var/run/secrets/octogee-gateway-broker
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
        {{- end }}
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Values.imageTag }}"
          ports:
            - containerPort: 18789
            - containerPort: 9091
              name: metrics
            - containerPort: 9092
              name: runner-metrics
            - containerPort: 9080
              name: preview
            - containerPort: {{ .Values.env.fleetControllerPort | default "3003" }}
              name: fleet-http
            {{- if $operatorShellsEnabled }}
            - containerPort: {{ .Values.env.builderShellPort | default "3005" }}
              name: builder-shell
            {{- end }}
          securityContext:
            {{- toYaml .Values.gatewayContainerSecurityContext | nindent 12 }}
          env:
            - name: HOME
              value: "/home/node"
            - name: NPM_CONFIG_CACHE
              value: "/home/node/.npm-cache"
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: GCLOUD_PROJECT
              value: {{ .Values.env.gcloudProject | quote }}
            - name: CLOUDSDK_CORE_PROJECT
              value: {{ .Values.env.gcloudProject | quote }}
            - name: GCP_PROJECT_ID
              value: {{ .Values.env.gcloudProject | quote }}
            - name: FIREBASE_PROJECT_ID
              value: {{ .Values.env.firebaseProjectId | quote }}
            - name: AGENT_PREFIX
              value: {{ .Values.env.agentPrefix | quote }}
            - name: GATEWAY_ID
              value: {{ .Values.gatewayId | quote }}
            - name: GATEWAY_BUILDER_SLUG
              value: {{ .Values.builderSlug | quote }}
            # Image profile (standard vs operator) — read by
            # entrypoint.sh to gate operator-only boot steps such as the
            # Claude Code first-run stamper.
            - name: GATEWAY_PROFILE
              value: {{ $imageProfile | quote }}
            - name: GATEWAY_CLASS
              value: {{ $gatewayClass | quote }}
            {{- $autosave := .Values.workspaceAutosaveEnabled | toString }}
            {{- if ne $autosave "" }}
            # Override; unset → gateway code defaults from profile
            # (operator off, cattle on). toString handles --set bool
            # coercion so "false" still renders. See
            # scripts/lib/workspace-autosave.ts.
            - name: WORKSPACE_AUTOSAVE_ENABLED
              value: {{ $autosave | quote }}
            {{- end }}
            - name: OPERATOR_SHELLS_ENABLED
              value: {{ ternary "true" "false" $operatorShellsEnabled | quote }}
            {{- if eq $gatewayClass "shared" }}
            # Shared gateways fall back to the shared platform Anthropic
            # key when a Builder has no BYOK/BYOS profile (openclaw's
            # Anthropic auth profile + the L3-throttle fallback).
            # NEVER on builder/operator gateways — they are exec-capable and must
            # use a broker token, with provider keys resolved off-pod.
            # optional: a missing secret degrades to the agent's own no-key error,
            # never a pod crash-loop.
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: octogee-anthropic
                  key: api_key
                  optional: true
            {{- else if or (eq $gatewayClass "builder") (eq $gatewayClass "operator") }}
            # Builder/operator gateways are exec-capable, so they must not receive
            # a provider key. This optional per-gateway secret contains an opaque
            # LLM broker token; the broker resolves platform/BYOT provider keys
            # off-pod and pre-boot-config.ts wires ANTHROPIC_BASE_URL into
            # models.providers.anthropic.baseUrl. The pod still boots if
            # issuance is temporarily absent.
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gateway-model-key-{{ .Values.gatewayId }}
                  key: anthropic_api_key
                  optional: true
            - name: ANTHROPIC_BASE_URL
              value: {{ .Values.env.llmBrokerUrl | default (printf "http://llm-broker.%s.svc.cluster.local:3010" .Release.Namespace) | quote }}
            {{- end }}
            {{- if eq $gatewayClass "operator" }}
            # Operator gateway shells run inside the tenant shell container,
            # which intentionally does not inherit the platform-wide
            # INTERNAL_SERVICE_KEY. The builder-shell port is exposed only
            # for explicitly unlocked operator gateways and is still scoped
            # by the per-gateway NetworkPolicy + shell ticket flow.
            - name: BUILDER_SHELL_REQUIRE_KEY
              value: "false"
            {{- end }}
            - name: OPENCLAW_BROADCAST_ALL_AGENT_RUNS
              value: "1"
            - name: OPENCLAW_BROADCAST_DIAGNOSTIC_EVENTS
              value: "1"
            # Node.js runtime tuning sized per the resolved sizing tier
            # ($preset.nodejs). UV pool default of 4 leaves parallel
            # fs/crypto/dns serialized; V8 default ~4 GiB heap caps the
            # gateway at a fraction of available pod memory. NODE_OPTIONS
            # prepends Dockerfile's --no-deprecation; Node honors the env
            # var unioned over CLI args.
            - name: UV_THREADPOOL_SIZE
              value: {{ $preset.nodejs.uvThreadpoolSize | quote }}
            - name: NODE_OPTIONS
              value: "--no-deprecation --max-old-space-size={{ $preset.nodejs.maxOldSpaceSizeMb }}"
            - name: MM_BOT_USERNAME
              value: "mac-{{ .Values.gatewayId }}"
            - name: GITHUB_ORG
              value: {{ .Values.env.githubOrg | quote }}
            - name: MM_URL
              value: {{ .Values.env.mmUrl | default (printf "http://mattermost.%s.svc.cluster.local:8065" .Release.Namespace) | quote }}
            - name: MM_SITE_URL
              value: {{ .Values.env.mmSiteUrl | default .Values.env.mmUrl | default (printf "http://mattermost.%s.svc.cluster.local:8065" .Release.Namespace) | quote }}
            - name: MM_INTERACTIONS_CALLBACK_BASE_URL
              value: {{ .Values.env.mmInteractionsCallbackBaseUrl | default (printf "http://octogee-gateway-%s.%s.svc.cluster.local:18789" .Values.gatewayId .Release.Namespace) | quote }}
            - name: MM_INTERACTIONS_ALLOWED_SOURCE_IPS
              value: {{ .Values.env.mmInteractionsAllowedSourceIps | quote }}
            - name: GIT_API_URL
              value: {{ .Values.env.gitApiUrl | default (printf "http://octogee-gitea-http.%s.svc.cluster.local:3000/api/v1" .Release.Namespace) | quote }}
            - name: GIT_SSH_HOST
              value: {{ .Values.env.gitSshHost | default (printf "octogee-gitea-ssh.%s.svc.cluster.local" .Release.Namespace) | quote }}
            - name: API_PUBLIC_URL
              value: {{ .Values.env.apiPublicUrl | quote }}
            - name: OCTOGEE_ROUTER_ENABLED
              value: {{ .Values.env.octogeeRouterEnabled | quote }}
            - name: OPENCLAW_LOG_LEVEL
              value: {{ .Values.env.openclawLogLevel | default "info" | quote }}
            {{- if .Values.env.openclawFaceModel }}
            - name: OPENCLAW_FACE_MODEL
              value: {{ .Values.env.openclawFaceModel | quote }}
            {{- end }}
            - name: FLEET_CONTROLLER_PORT
              value: {{ .Values.env.fleetControllerPort | default "3003" | quote }}
            - name: FLEET_CONTROLLER_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: octogee-fleet-controller
                  key: public-key
            - name: SITE_BUILD_API_PORT
              value: {{ .Values.env.siteBuildApiPort | default "3004" | quote }}
            {{- if .Values.preview.host }}
            # Public-facing host the gateway's preview-proxy returns in
            # URLs to the app. Must match the umbrella's
            # gatewayFleet.previewIngress.host for this env. Empty
            # value falls back to scripts/entrypoints/preview-proxy.ts's hardcoded
            # `preview.octogee.com` — fine for prod, wrong for test.
            - name: PREVIEW_HOST
              value: {{ .Values.preview.host | quote }}
            {{- end }}
            - name: PREVIEW_REQUIRE_GATEWAY_ID
              value: "true"
            # Where legacy in-pod callers reach gateway-edge. The platform
            # INTERNAL_SERVICE_KEY is intentionally not present in this
            # shell-bearing container; callers that still require it fail closed
            # until they move behind octogee-api/Cowboy.
            - name: GATEWAY_EDGE_INTERNAL_URL
              value: "http://127.0.0.1:{{ .Values.gatewayEdge.port }}"
            # Gitea admin lifecycle operations are brokered by octogee-api,
            # which holds the Gitea admin token. The shell-bearing gateway
            # presents only its projected gateway KSA token; octogee-api
            # TokenReview + tenant enforcement bind it back to this gateway.
            - name: GITEA_ADMIN_BROKER_URL
              value: "http://octogee-api.{{ .Release.Namespace }}.svc.cluster.local:3001"
            - name: FLEET_BROKER_URL
              value: "http://octogee-api.{{ .Release.Namespace }}.svc.cluster.local:3001"
            - name: OCTOGEE_API_SA_TOKEN_PATH
              value: "/var/run/secrets/octogee-gateway-broker/token"
            # Same per-gateway K8s secret as init + gateway-edge (see init
            # container env block for the rationale). Pinned via the chart
            # so kubectl-set-env side-channels can't drift the value out
            # from under helm again.
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gateway-auth-token-{{ .Values.gatewayId }}
                  key: token
          volumeMounts:
            - name: data
              mountPath: /home/node
            - name: gateway-broker-sa-token
              mountPath: /var/run/secrets/octogee-gateway-broker
              readOnly: true
            # No platform secrets are mounted here. The projected token above
            # is this gateway's KSA identity for tenant-bound broker calls.
          # Startup probe is HTTP GET /healthz (not TCP) — gates
          # liveness/readiness until openclaw is actually serving HTTP,
          # not just port-bound. Unrouted paths fall through to openclaw's
          # Control-UI static handler, which 503s (image skips ui:build);
          # /healthz returns 200 {"status":"live"}. Once it succeeds once,
          # liveness/readiness take over (TCP, won't flap on slow /healthz
          # under steady load).
          startupProbe:
            httpGet:
              path: /healthz
              port: 18789
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
          livenessProbe:
            tcpSocket:
              port: 18789
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
          # Readiness: TCP probe with `successThreshold` so a freshly-bound
          # port has to stay bound for N×periodSeconds before traffic starts
          # routing. Together with `failureThreshold`, prevents the
          # bind/ready/unready oscillation observed on customer-add bursts.
          readinessProbe:
            tcpSocket:
              port: 18789
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            successThreshold: {{ .Values.probes.readiness.successThreshold | default 1 }}
          resources:
            {{- toYaml $preset.resources | nindent 12 }}

        {{- if .Values.gatewayEdge.enabled }}
        # chat-proxy folded in — one container, one port (3001) serves the
        # API, the chat WS surface, and /metrics (POST-BENDER-CLEANUP-SPEC §2.6).
        - name: gateway-edge
          image: "{{ .Values.gatewayEdge.image.repository }}:{{ .Values.gatewayEdge.image.tag | default .Values.imageTag }}"
          ports:
            - containerPort: {{ .Values.gatewayEdge.port }}
              name: gateway-edge
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: PORT
              value: "{{ .Values.gatewayEdge.port }}"
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: K8S_SERVICE_ACCOUNT_NAME
              value: {{ include "octogee-gateway.serviceAccountName" . | quote }}
            - name: OPENCLAW_GATEWAY_URL
              value: "http://127.0.0.1:18789"
            - name: GATEWAY_API_URL
              value: "http://127.0.0.1:18789"
            - name: OPENCLAW_GATEWAY_DEVICE_TOKEN_PATH
              value: "/var/run/octogee/openclaw-device-auth/token"
            - name: GATEWAY_ID
              value: {{ .Values.gatewayId | quote }}
            - name: GATEWAY_BUILDER_SLUG
              value: {{ .Values.builderSlug | quote }}
            - name: GATEWAY_PROFILE
              value: {{ $imageProfile | quote }}
            - name: GATEWAY_CLASS
              value: {{ $gatewayClass | quote }}
            - name: MM_INTERNAL_URL
              value: {{ required "env.mmInternalUrl is required (in-cluster MM URL — the folded chat-proxy WS bridge + activity bridge use it)" .Values.env.mmInternalUrl | quote }}
            - name: MM_PUBLIC_URL
              value: {{ .Values.env.mmInternalUrl | quote }}
            - name: FIREBASE_PROJECT
              value: {{ .Values.env.firebaseProjectId | quote }}
            - name: OPENCLAW_RUNTIME_BROKER_URL
              value: "http://octogee-api.{{ .Release.Namespace }}.svc.cluster.local:3001"
            - name: CONNECTOR_TOKEN_BROKER_URL
              value: "http://octogee-api.{{ .Release.Namespace }}.svc.cluster.local:3001"
            - name: BUILDER_SHELL_BROKER_URL
              value: "http://octogee-api.{{ .Release.Namespace }}.svc.cluster.local:3001"
            # NOTE: GCP_PROJECT_ID + GITEA_ORG are NOT set here — the
            # .Values.gatewayEdge.env range below already provides the
            # non-secret project/org identifiers. Platform secrets are not
            # expanded into this sidecar.
            - name: OCTOGEE_ALLOWED_WS_ORIGINS
              value: {{ .Values.env.allowedWsOrigins | default "" | quote }}
            {{- if .Values.env.giteaPublicBaseUrl }}
            - name: GITEA_PUBLIC_BASE_URL
              value: {{ .Values.env.giteaPublicBaseUrl | quote }}
            {{- end }}
            # Every gateway needs this: wireActivityBridge() requires it for
            # approval-callback HMAC. It is not a Mattermost admin token; keep it
            # explicit even though gateway pods no longer render MM_ADMIN_PAT.
            - name: OCTOGEE_APPROVAL_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: approval-signing
                  key: secret
            # Same per-gateway K8s secret as init + gateway container (see
            # init container env block for the rationale). chat-proxy is
            # folded into this container and needs the same token openclaw
            # uses for its in-pod RPC.
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gateway-auth-token-{{ .Values.gatewayId }}
                  key: token
            {{- /* Platform secrets are intentionally absent. Locality routes
                that still need platform authority fail closed or are served by
                octogee-api/Cowboy, while builder-shell uses the per-gateway
                token and TokenReview paths. */}}
            {{- if eq $gatewayClass "operator" }}
            - name: GATEWAY_EDGE_INTERNAL_URL
              value: "http://localhost:{{ .Values.gatewayEdge.port }}"
            {{- end }}
            {{- range $key, $val := .Values.gatewayEdge.env }}
            {{- $omitKms := eq $key "OCTOGEE_KMS_KEY_NAME" -}}
            {{- if and $val (not $omitKms) }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            {{- end }}
          resources:
            {{- toYaml .Values.gatewayEdge.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /home/node
            - name: openclaw-device-auth
              mountPath: /var/run/octogee/openclaw-device-auth
            - name: octogee-api-sa-token
              mountPath: /var/run/secrets/octogee-api
              readOnly: true
            - name: k8s-api-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.gatewayEdge.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.gatewayEdge.port }}
            initialDelaySeconds: 10
            periodSeconds: 30
        {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "octogee-gateway-%s-data" .Values.gatewayId) | quote }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: octogee-api-sa-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: octogee-api
                  expirationSeconds: 3600
        - name: gateway-broker-sa-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: octogee-api
                  expirationSeconds: 3600
        - name: openclaw-device-auth
          emptyDir: {}
        - name: k8s-api-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
