{{- include "octogee-gateway.requireIdentity" . -}}
{{- $revision := include "octogee-gateway.revisionId" . -}}
{{- $tier := include "octogee-gateway.effectiveTier" . -}}
{{- $preset := index .Values.tiers $tier -}}
{{- $gatewayClass := include "octogee-gateway.gatewayClass" . -}}
{{- $imageProfile := include "octogee-gateway.imageProfile" . -}}
{{- $gatewayImageLabel := include "octogee-gateway.imageLabel" . -}}
{{- $gatewayImageTag := .Values.image.tag | default .Values.imageTag -}}
{{- $conversationMode := .Values.conversationExperiment.mode | default "broad" -}}
{{- if ne (empty .Values.ownerUid) (empty .Values.builderSlug) -}}
{{- fail "octogee-gateway: ownerUid and builderSlug must be provided together" -}}
{{- end -}}
{{- if and (ne $gatewayClass "shared") (empty .Values.ownerUid) -}}
{{- fail "octogee-gateway: ownerUid and builderSlug are required for owner-bound disposable gateways" -}}
{{- end -}}
{{- $operatorShellsEnabled := and (ne $gatewayClass "shared") (.Values.operatorAccess.shellsEnabled | default false) -}}
{{- $operatorControlUiEnabled := ne $gatewayClass "shared" -}}
{{- if and (ne $conversationMode "broad") (ne $conversationMode "publisher-live") -}}
{{- fail (printf "octogee-gateway: conversationExperiment.mode must be broad or publisher-live, got %q" $conversationMode) -}}
{{- end -}}
{{- if not $preset -}}
{{- fail (printf "octogee-gateway: no preset defined for sizingTier=%q (add it under .Values.tiers in values.yaml)" $tier) -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: octogee-gateway-{{ $revision }}
  labels:
    app: octogee-gateway
    gateway-class: {{ $gatewayClass | quote }}
    gateway-profile: {{ $imageProfile | quote }}
    {{- include "octogee-gateway.labels" . | nindent 4 }}
spec:
  # Use kindIs to distinguish "explicit 0 (paused)" from "unset (default to 1)" —
  # helm's `default` treats 0 as falsy and would replace it with the fallback.
  replicas: {{ if kindIs "invalid" .Values.replicas }}1{{ else }}{{ .Values.replicas }}{{ end }}
  {{- $rollStrategy := .Values.rollStrategy | default "recreate" }}
  {{- if eq $rollStrategy "surge" }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  {{- else if eq $rollStrategy "recreate" }}
  strategy:
    type: Recreate
  {{- else }}
  {{- fail (printf "unsupported rollStrategy %q (expected surge or recreate)" $rollStrategy) }}
  {{- end }}
  selector:
    matchLabels:
      app: octogee-gateway
      gateway-instance: {{ $revision }}
  template:
    metadata:
      annotations:
        octogee.ai/owner-uid: {{ .Values.ownerUid | quote }}
        octogee.ai/builder-slug: {{ .Values.builderSlug | quote }}
      labels:
        app: octogee-gateway
        gateway-id: {{ .Values.gatewayId }}
        gateway-instance: {{ $revision }}
        gateway-class: {{ $gatewayClass | quote }}
        {{- if .Values.builderSlug }}
        octogee.ai/builder-slug: {{ .Values.builderSlug | quote }}
        {{- end }}
        # Profile label lets the umbrella gateway-edge alias Service
        # safely exclude operator pods in a follow-up rollout after every
        # gateway pod has this label.
        gateway-profile: {{ $imageProfile | quote }}
        # Per-pod sizing tier — stamped on the pod so
        # GCP Billing Export can roll up cost by tier for the chargeback
        # surface (GATEWAY-PLATFORM-SPEC §Phase 5a).
        tier: {{ $tier | quote }}
        # Build tag this pod rolled to — `kubectl get pods -L gateway-image`
        # makes a blue/green or rolling update legible at a glance (the
        # pod-template-hash already changes per image but isn't readable back to
        # a SHA). Pod-template label ONLY, never the selector — selectors must
        # stay stable across rolls.
        gateway-image: {{ $gatewayImageLabel | quote }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.preStopFlush.terminationGracePeriodSeconds | default 30 }}
      {{- if ne $gatewayClass "shared" }}
      nodeSelector:
        cloud.google.com/compute-class: {{ required "computeClass is required for owner-bound gateways" .Values.computeClass | quote }}
      {{- end }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: octogee-gateway
              namespaceSelector: {}
              topologyKey: kubernetes.io/hostname
            {{- if eq $gatewayClass "shared" }}
            - labelSelector:
                matchLabels:
                  app: octogee-gateway
                  gateway-class: shared
                matchExpressions:
                  - key: gateway-id
                    operator: Exists
                  - key: gateway-id
                    operator: NotIn
                    values:
                      - {{ .Values.gatewayId }}
              topologyKey: topology.kubernetes.io/zone
            {{- end }}
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: octogee-gateway
                namespaceSelector: {}
                topologyKey: topology.kubernetes.io/zone
      serviceAccountName: {{ include "octogee-gateway.serviceAccountName" . }}
      {{- if eq $gatewayClass "builder" }}
      runtimeClassName: gvisor
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: fix-perms
          image: "{{ required "image.repository is required" .Values.image.repository }}:{{ .Values.image.tag | default .Values.imageTag }}"
          command:
            - sh
            - -c
            - |
              set -eu
              # -rn, not -a/-p: fsGroup owns /home/node, and preserving
              # source owner/timestamps needs FOWNER, which restricted PSA denies.
              cp -rn /etc/skel/. /home/node/
              mkdir -p /home/node/.npm-cache
          env:
            # OPENCLAW_GATEWAY_TOKEN is platform-owned: Cowboy creates the
            # per-gateway K8s secret `gateway-auth-token-<gatewayId>` with a
            # random hex value before this chart installs, and the same
            # secretKeyRef appears on all three containers (init / gateway /
            # gateway-edge) so they agree on the token without any in-pod
            # generation. Init seeds the PVC and the template that envsubst's
            # OPENCLAW_GATEWAY_TOKEN into openclaw.json reads it from this env.
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gateway-auth-token-{{ .Values.gatewayId }}
                  key: token
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /home/node
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
      containers:
        - name: gateway
          image: "{{ required "image.repository is required" .Values.image.repository }}:{{ .Values.image.tag | default .Values.imageTag }}"
          ports:
            - containerPort: 18789
            - containerPort: 9092
              name: runner-metrics
            - containerPort: 9080
              name: preview
            - containerPort: {{ .Values.env.fleetControllerPort | default "3003" }}
              name: fleet-http
            - containerPort: {{ .Values.env.migrationRsyncPort | default "30873" }}
              name: migration-rsync
            {{- if $operatorShellsEnabled }}
            - containerPort: {{ .Values.env.builderShellPort | default "3005" }}
              name: builder-shell
            {{- end }}
          securityContext:
            {{- toYaml .Values.gatewayContainerSecurityContext | nindent 12 }}
          {{- if .Values.preStopFlush.enabled }}
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - >
                    timeout {{ .Values.preStopFlush.timeoutSeconds | default 25 }}s
                    /octogee/scripts/node_modules/.bin/tsx
                    /octogee/scripts/entrypoints/prestop-flush.ts
          {{- end }}
          env:
            - name: HOME
              value: "/home/node"
            {{- if $operatorControlUiEnabled }}
            - name: OPENCLAW_DASHBOARD_BRIDGE_REQUIRED
              value: "true"
            {{- end }}
            - name: NPM_CONFIG_CACHE
              value: "/home/node/.npm-cache"
            - name: CUSTOMERS_DIR
              value: "/home/node/.openclaw/customers"
            - name: AGENTS_DIR
              value: "/home/node/.openclaw/agents"
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: GCLOUD_PROJECT
              value: {{ .Values.env.gcloudProject | quote }}
            - name: CLOUDSDK_CORE_PROJECT
              value: {{ .Values.env.gcloudProject | quote }}
            - name: GCP_PROJECT_ID
              value: {{ .Values.env.gcloudProject | quote }}
            - name: FIREBASE_PROJECT_ID
              value: {{ .Values.env.firebaseProjectId | quote }}
            - name: AGENT_PREFIX
              value: {{ .Values.env.agentPrefix | quote }}
            - name: GATEWAY_ID
              value: {{ .Values.gatewayId | quote }}
            # Identity alias — always the bare gatewayId under simple-roll.
            # gateway-edge stamps it into the Dashboard-bridge capability file.
            - name: GATEWAY_REVISION_ID
              value: {{ $revision | quote }}
            - name: GATEWAY_BUILDER_SLUG
              value: {{ .Values.builderSlug | quote }}
            - name: GATEWAY_IMAGE_TAG
              value: {{ $gatewayImageTag | quote }}
            # Image profile (standard vs operator) — read by
            # entrypoint.sh to gate operator-image boot steps such as the
            # Claude Code first-run stamper.
            - name: GATEWAY_PROFILE
              value: {{ $imageProfile | quote }}
            - name: GATEWAY_CLASS
              value: {{ $gatewayClass | quote }}
            - name: OPENCLAW_DOCTOR_MODE
              value: {{ .Values.env.openclawDoctorMode | default "skip" | quote }}
            {{- $autosave := .Values.workspaceAutosaveEnabled | toString }}
            {{- if ne $autosave "" }}
            # Override; unset → gateway code defaults from profile
            # (operator off, cattle on). toString handles --set bool
            # coercion so "false" still renders. See
            # scripts/lib/workspace-autosave.ts.
            - name: WORKSPACE_AUTOSAVE_ENABLED
              value: {{ $autosave | quote }}
            {{- end }}
            - name: OPERATOR_SHELLS_ENABLED
              value: {{ ternary "true" "false" $operatorShellsEnabled | quote }}
            {{- $llmBrokerUrl := .Values.env.llmBrokerUrl | default (printf "http://llm-broker.%s.svc.cluster.local:3010" .Release.Namespace) }}
            # Every class routes anthropic through the LLM broker — no provider key
            # is served from a pod to api.anthropic.com directly. The base URL is
            # pod-level for all; pre-boot-config.ts syncs it into
            # models.providers.anthropic.baseUrl.
            - name: ANTHROPIC_BASE_URL
              value: {{ $llmBrokerUrl | quote }}
            - name: OPENROUTER_BASE_URL
              value: {{ printf "%s/v1" (trimSuffix "/" $llmBrokerUrl) | quote }}
            # OpenAI-compatible traffic that uses platform credentials goes through
            # the broker; BYOK OpenAI keeps its provider-standard endpoint.
            - name: PLATFORM_OPENAI_BASE_URL
              value: {{ printf "%s/v1" (trimSuffix "/" $llmBrokerUrl) | quote }}
            - name: OPENAI_EMBEDDINGS_ENABLED
              value: {{ .Values.env.openaiEmbeddingsEnabled | toString | quote }}
            - name: OPENAI_EMBEDDINGS_MODEL
              value: {{ .Values.env.openaiEmbeddingsModel | toString | quote }}
            {{- if eq $gatewayClass "shared" }}
            # Shared (multi-tenant) pods carry NO pod-level provider key. Each
            # customer-agent's anthropic:default is its OWN per-customer broker token
            # (agent-model-token-<agentId>), materialized into the agent's auth-profile
            # store by pre-boot-config.ts / byot-sync and fetched at runtime via the
            # secret-resolver → POST /internal/byok/agent-model-token. The broker
            # resolves platform-or-BYOK per owner and meters per ownerUid.
            {{- end }}
            {{- if $operatorShellsEnabled }}
            # Builder/operator gateway shells run inside the tenant shell container,
            # which intentionally does not inherit the platform-wide
            # INTERNAL_SERVICE_KEY. The builder-shell port is exposed only
            # for explicitly unlocked runtime gateways and is still scoped
            # by the per-gateway NetworkPolicy + shell ticket flow.
            - name: BUILDER_SHELL_REQUIRE_KEY
              value: "false"
            {{- end }}
            - name: OPENCLAW_BROADCAST_ALL_AGENT_RUNS
              value: "1"
            - name: OPENCLAW_BROADCAST_DIAGNOSTIC_EVENTS
              value: "1"
            # Node.js runtime tuning sized per the resolved sizing tier
            # ($preset.nodejs). UV pool default of 4 leaves parallel
            # fs/crypto/dns serialized; V8 default ~4 GiB heap caps the
            # gateway at a fraction of available pod memory. NODE_OPTIONS
            # prepends Dockerfile's --no-deprecation; Node honors the env
            # var unioned over CLI args.
            - name: UV_THREADPOOL_SIZE
              value: {{ $preset.nodejs.uvThreadpoolSize | quote }}
            - name: NODE_OPTIONS
              value: "--no-deprecation --max-old-space-size={{ $preset.nodejs.maxOldSpaceSizeMb }}"
            - name: GITHUB_ORG
              value: {{ .Values.env.githubOrg | quote }}
            - name: MM_URL
              value: {{ .Values.env.mmUrl | default (printf "http://mattermost.%s.svc.cluster.local:8065" .Release.Namespace) | quote }}
            - name: MM_SITE_URL
              value: {{ .Values.env.mmSiteUrl | default .Values.env.mmUrl | default (printf "http://mattermost.%s.svc.cluster.local:8065" .Release.Namespace) | quote }}
            - name: MM_INTERACTIONS_CALLBACK_BASE_URL
              value: {{ .Values.env.mmInteractionsCallbackBaseUrl | default (printf "http://mattermost-callback-router.%s.svc.cluster.local:3001/internal/openclaw/mattermost/%s" .Release.Namespace .Values.gatewayId) | quote }}
            - name: MM_INTERACTIONS_ALLOWED_SOURCE_IPS
              value: "127.0.0.1"
            - name: OCTOGEE_ACTIVITY_BRIDGE_MODE
              value: {{ $conversationMode | quote }}
            - name: GIT_API_URL
              value: {{ .Values.env.gitApiUrl | default (printf "http://octogee-gitea-http.%s.svc.cluster.local:3000/api/v1" .Release.Namespace) | quote }}
            - name: GIT_SSH_HOST
              value: {{ .Values.env.gitSshHost | default (printf "octogee-gitea-ssh.%s.svc.cluster.local" .Release.Namespace) | quote }}
            - name: API_PUBLIC_URL
              value: {{ .Values.env.apiPublicUrl | quote }}
            - name: APP_URL
              value: {{ .Values.gatewayEdge.env.APP_URL | default .Values.env.appUrl | default "https://app.octogee.com" | quote }}
            - name: OPENCLAW_LOG_LEVEL
              value: {{ .Values.env.openclawLogLevel | default "info" | quote }}
            - name: FLEET_CONTROLLER_PORT
              value: {{ .Values.env.fleetControllerPort | default "3003" | quote }}
            - name: MIGRATION_RSYNC_PORT
              value: {{ .Values.env.migrationRsyncPort | default "30873" | quote }}
            - name: FLEET_CONTROLLER_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: octogee-fleet-controller
                  key: public-key
            - name: SITE_BUILD_API_PORT
              value: {{ .Values.env.siteBuildApiPort | default "3004" | quote }}
            {{- if .Values.preview.host }}
            # Public-facing host the gateway's preview-proxy returns in
            # URLs to the app. Must match the umbrella's
            # gatewayFleet.previewIngress.host for this env. Empty
            # value falls back to scripts/entrypoints/preview-proxy.ts's hardcoded
            # `preview.octogee.com` — fine for prod, wrong for test.
            - name: PREVIEW_HOST
              value: {{ .Values.preview.host | quote }}
            {{- end }}
            - name: PREVIEW_REQUIRE_GATEWAY_ID
              value: "true"
            # Where legacy in-pod callers reach gateway-edge. The platform
            # INTERNAL_SERVICE_KEY is intentionally not present in this
            # shell-bearing container; callers that still require it fail closed
            # until they move behind octogee-api/Cowboy.
            - name: GATEWAY_EDGE_INTERNAL_URL
              value: "http://127.0.0.1:{{ .Values.gatewayEdge.port }}"
            # Gitea admin lifecycle operations are brokered by octogee-api,
            # which holds the Gitea admin token. The shell-bearing gateway
            # presents only its projected gateway KSA token; octogee-api
            # TokenReview + tenant enforcement bind it back to this gateway.
            - name: GITEA_ADMIN_BROKER_URL
              value: "http://octogee-api.{{ .Release.Namespace }}.svc.cluster.local:3001"
            - name: FLEET_BROKER_URL
              value: "http://octogee-api.{{ .Release.Namespace }}.svc.cluster.local:3001"
            - name: OCTOGEE_API_SA_TOKEN_PATH
              value: "/var/run/secrets/octogee-gateway-broker/token"
            # Same per-gateway K8s secret as init + gateway-edge (see init
            # container env block for the rationale). Pinned via the chart
            # so kubectl-set-env side-channels can't drift the value out
            # from under helm again.
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gateway-auth-token-{{ .Values.gatewayId }}
                  key: token
          volumeMounts:
            - name: data
              mountPath: /home/node
            - name: gateway-broker-sa-token
              mountPath: /var/run/secrets/octogee-gateway-broker
              readOnly: true
            # No platform secrets are mounted here. The projected token above
            # is this gateway's KSA identity for tenant-bound broker calls.
          # Non-shared startup and liveness probe the fleet controller, which
          # starts after durable-config repair; the startup budget bounds one
          # identity-pure attempt. Readiness stays closed until Cowboy finishes
          # the surge customer handoff and OpenClaw is healthy.
          startupProbe:
            {{- if eq $gatewayClass "shared" }}
            httpGet:
              path: /healthz
              port: 18789
            {{- else }}
            httpGet:
              path: /health
              port: {{ .Values.env.fleetControllerPort | default "3003" }}
            {{- end }}
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
          livenessProbe:
            {{- if eq $gatewayClass "shared" }}
            tcpSocket:
              port: 18789
            {{- else }}
            httpGet:
              path: /health
              port: {{ .Values.env.fleetControllerPort | default "3003" }}
            {{- end }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
          readinessProbe:
            httpGet:
              path: /surge-ready
              port: {{ .Values.env.fleetControllerPort | default "3003" }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            successThreshold: {{ .Values.probes.readiness.successThreshold | default 1 }}
          resources:
            {{- toYaml $preset.resources | nindent 12 }}

        {{- if .Values.gatewayEdge.enabled }}
        # chat-proxy folded in — one container, one port (3001) serves the
        # API, the chat WS surface, and /metrics (POST-BENDER-CLEANUP-SPEC §2.6).
        - name: gateway-edge
          image: "{{ required "gatewayEdge.image.repository is required" .Values.gatewayEdge.image.repository }}:{{ .Values.gatewayEdge.image.tag | default .Values.imageTag }}"
          ports:
            - containerPort: {{ .Values.gatewayEdge.port }}
              name: gateway-edge
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: PORT
              value: "{{ .Values.gatewayEdge.port }}"
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: K8S_SERVICE_ACCOUNT_NAME
              value: {{ include "octogee-gateway.serviceAccountName" . | quote }}
            - name: OPENCLAW_GATEWAY_URL
              value: "http://127.0.0.1:18789"
            - name: GATEWAY_API_URL
              value: "http://127.0.0.1:18789"
            - name: OPENCLAW_GATEWAY_DEVICE_TOKEN_PATH
              value: "/var/run/octogee/openclaw-device-auth/token"
            - name: OPENCLAW_CONFIG
              value: {{ if eq $gatewayClass "shared" }}"/home/node/.openclaw/openclaw.json"{{ else }}"/home/node/.openclaw/system_config/openclaw.json"{{ end }}
            {{- if $operatorControlUiEnabled }}
            - name: OPENCLAW_DIR
              value: "/home/node/.openclaw"
            - name: OPENCLAW_CONFIG_PATH
              value: "/home/node/.openclaw/system_config/openclaw.json"
            - name: OPENCLAW_DASHBOARD_BRIDGE_ENABLED
              value: "true"
            - name: OPENCLAW_CONTROL_BROKER_URL
              value: "http://octogee-api.{{ .Release.Namespace }}.svc.cluster.local:3001"
            {{- end }}
            - name: GATEWAY_ID
              value: {{ .Values.gatewayId | quote }}
            # Identity alias — always the bare gatewayId under simple-roll.
            # gateway-edge stamps it into the Dashboard-bridge capability file.
            - name: GATEWAY_REVISION_ID
              value: {{ $revision | quote }}
            - name: GATEWAY_BUILDER_SLUG
              value: {{ .Values.builderSlug | quote }}
            - name: GATEWAY_PROFILE
              value: {{ $imageProfile | quote }}
            - name: GATEWAY_CLASS
              value: {{ $gatewayClass | quote }}
            - name: OPENROUTER_BASE_URL
              value: {{ printf "%s/v1" (trimSuffix "/" $llmBrokerUrl) | quote }}
            - name: PLATFORM_OPENAI_BASE_URL
              value: {{ printf "%s/v1" (trimSuffix "/" $llmBrokerUrl) | quote }}
            - name: MM_INTERNAL_URL
              value: {{ required "env.mmInternalUrl is required (in-cluster MM URL — the folded chat-proxy WS bridge + activity bridge use it)" .Values.env.mmInternalUrl | quote }}
            - name: MM_PUBLIC_URL
              value: {{ .Values.env.mmInternalUrl | quote }}
            - name: MATTERMOST_SILENT_CAPABILITY_SENTINEL
              valueFrom:
                configMapKeyRef:
                  name: mattermost-silent-capability
                  key: MATTERMOST_SILENT_CAPABILITY_SENTINEL
                  optional: true
            - name: FIREBASE_PROJECT
              value: {{ .Values.env.firebaseProjectId | quote }}
            - name: OPENCLAW_RUNTIME_BROKER_URL
              value: "http://octogee-api.{{ .Release.Namespace }}.svc.cluster.local:3001"
            - name: OCTOGEE_ACTIVITY_BRIDGE_MODE
              value: {{ $conversationMode | quote }}
            - name: CONNECTOR_TOKEN_BROKER_URL
              value: "http://octogee-api.{{ .Release.Namespace }}.svc.cluster.local:3001"
            - name: BUILDER_SHELL_BROKER_URL
              value: "http://octogee-api.{{ .Release.Namespace }}.svc.cluster.local:3001"
            - name: FLEET_BROKER_URL
              value: {{ .Values.fleetBrokerUrl | default (printf "http://octogee-api.%s.svc.cluster.local:3001" .Release.Namespace) | quote }}
            - name: OCTOGEE_API_SA_TOKEN_PATH
              value: "/var/run/secrets/octogee-api/token"
            # NOTE: GCP_PROJECT_ID + GITEA_ORG are NOT set here — the
            # .Values.gatewayEdge.env range below already provides the
            # non-secret project/org identifiers. Platform secrets are not
            # expanded into this sidecar.
            - name: OCTOGEE_ALLOWED_WS_ORIGINS
              value: {{ .Values.env.allowedWsOrigins | default "" | quote }}
            {{- if .Values.env.giteaPublicBaseUrl }}
            - name: GITEA_PUBLIC_BASE_URL
              value: {{ .Values.env.giteaPublicBaseUrl | quote }}
            {{- end }}
            # Every gateway needs this: wireActivityBridge() requires it for
            # durable control HMAC. It is not a Mattermost admin token; keep it
            # explicit even though gateway pods no longer render MM_ADMIN_PAT.
            - name: OCTOGEE_AGENT_CONTROL_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: agent-control-signing
                  key: secret
            - name: OCTOGEE_APPROVAL_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: approval-signing
                  key: secret
            - name: AGENT_CONTROL_ROUTER_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-control-router
                  key: secret
            - name: BYOT_SYNC_INTERNAL_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: byot-sync-internal
                  key: secret
            # Same per-gateway K8s secret as init + gateway container (see
            # init container env block for the rationale). chat-proxy is
            # folded into this container and needs the same token openclaw
            # uses for its in-pod RPC.
            - name: OPENCLAW_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gateway-auth-token-{{ .Values.gatewayId }}
                  key: token
            {{- /* Platform secrets are intentionally absent. Locality routes
                that still need platform authority fail closed or are served by
                octogee-api/Cowboy, while builder-shell uses the per-gateway
                token and TokenReview paths. */}}
            {{- if eq $gatewayClass "operator" }}
            - name: GATEWAY_EDGE_INTERNAL_URL
              value: "http://localhost:{{ .Values.gatewayEdge.port }}"
            {{- end }}
            {{- range $key, $val := .Values.gatewayEdge.env }}
            {{- $omitKms := eq $key "OCTOGEE_KMS_KEY_NAME" -}}
            {{- if and $val (not $omitKms) }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            {{- end }}
          resources:
            {{- toYaml .Values.gatewayEdge.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /home/node
            - name: tmp
              mountPath: /tmp
            - name: openclaw-device-auth
              mountPath: /var/run/octogee/openclaw-device-auth
            - name: octogee-api-sa-token
              mountPath: /var/run/secrets/octogee-api
              readOnly: true
            - name: k8s-api-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.gatewayEdge.port }}
            initialDelaySeconds: {{ .Values.gatewayEdge.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.gatewayEdge.probes.readiness.periodSeconds }}
          startupProbe:
            httpGet:
              path: /health
              port: {{ .Values.gatewayEdge.port }}
            initialDelaySeconds: {{ .Values.gatewayEdge.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.gatewayEdge.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.gatewayEdge.probes.startup.failureThreshold }}
            timeoutSeconds: {{ .Values.gatewayEdge.probes.startup.timeoutSeconds }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.gatewayEdge.port }}
            initialDelaySeconds: {{ .Values.gatewayEdge.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.gatewayEdge.probes.liveness.periodSeconds }}
        {{- end }}
      volumes:
        # Durable product state is substrate-backed; every pod disk is disposable.
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: octogee-api-sa-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: octogee-api
                  expirationSeconds: 3600
        - name: gateway-broker-sa-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: octogee-api
                  expirationSeconds: 3600
        - name: openclaw-device-auth
          emptyDir: {}
        - name: k8s-api-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
