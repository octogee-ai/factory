{{- /*
Operator gateway API-server egress carve-out.

Operator BuilderShell auth validates gateway-local service-account tokens with
Kubernetes TokenReview. That call goes to the in-cluster Kubernetes API server
on :443. The fleet-wide gateway-egress policy intentionally blocks RFC1918
egress, and on GKE Dataplane V2 NetworkPolicy commonly has to allow the real
control-plane endpoint IP(s), not only the `kubernetes.default` service
ClusterIP, because policy is evaluated after service DNAT.

This policy is deliberately:
  - operator-profile only;
  - per-gateway, via gateway-instance;
  - explicit-CIDR only, supplied from live `kubernetes` EndpointSlice data;
  - independent from the metadata-server carve-out.

Populate `operatorAccess.kubeApiServerEgressCidrs` with `/32` endpoint CIDRs
from:

  kubectl get endpointslices -n default \
    -l kubernetes.io/service-name=kubernetes \
    -o jsonpath='{range .items[*].endpoints[*].addresses[*]}{.}{"/32\n"}{end}'

Default OFF. The chart only accepts `/32` endpoint CIDRs here.
*/}}
{{- $apiCidrs := .Values.operatorAccess.kubeApiServerEgressCidrs | default (list) -}}
{{- $apiEgress := and (eq (include "octogee-gateway.gatewayClass" .) "operator") (gt (len $apiCidrs) 0) -}}
{{- /* `ne … false`, not `| default true`: a bool `false` is the Go zero value,
       so `.Values.networkPolicy.enabled | default true` would override an
       explicit disable back to true. */}}
{{- if and $apiEgress (ne .Values.networkPolicy.enabled false) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: octogee-gateway-apiserver-egress-{{ .Values.gatewayId }}
  labels:
    {{- include "octogee-gateway.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: octogee-gateway
      gateway-instance: {{ .Values.gatewayId }}
  policyTypes:
    - Egress
  egress:
    # Kubernetes TokenReview API (:443) for operator gateway identity checks.
    - to:
        {{- range $cidr := $apiCidrs }}
        {{- if not (hasSuffix "/32" $cidr) }}
        {{- fail (printf "operatorAccess.kubeApiServerEgressCidrs must contain /32 endpoint CIDRs only (got %q)" $cidr) }}
        {{- end }}
        - ipBlock:
            cidr: {{ $cidr | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 443
{{- end }}
