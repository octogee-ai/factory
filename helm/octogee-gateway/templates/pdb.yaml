{{- if .Values.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: octogee-gateway-{{ include "octogee-gateway.revisionId" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: octogee-gateway
    {{- include "octogee-gateway.labels" . | nindent 4 }}
spec:
  # All gateway classes are cattle: maxUnavailable:1 => disruptionsAllowed:1.
  # This lets ComputeClass activeMigration right-size + node drains evict
  # gracefully. Durability is substrate-backed, not PDB/PVC-backed.
  maxUnavailable: {{ .Values.pdb.maxUnavailable }}
  selector:
    matchLabels:
      app: octogee-gateway
      gateway-instance: {{ include "octogee-gateway.revisionId" . }}
{{- end }}
