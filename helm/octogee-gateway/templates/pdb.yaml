{{- if .Values.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: octogee-gateway-{{ include "octogee-gateway.revisionId" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: octogee-gateway
    {{- include "octogee-gateway.labels" . | nindent 4 }}
spec:
  {{- $gatewayClass := include "octogee-gateway.gatewayClass" . }}
  {{- if has $gatewayClass (.Values.availability.protectedClasses | default list) }}
  minAvailable: {{ .Values.pdb.minAvailable }}
  {{- else }}
  maxUnavailable: {{ .Values.pdb.maxUnavailable }}
  {{- end }}
  selector:
    matchLabels:
      app: octogee-gateway
      gateway-instance: {{ include "octogee-gateway.revisionId" . }}
{{- end }}
