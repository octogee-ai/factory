# helm/octogee-gateway/values.yaml — defaults for ONE gateway instance.
#
# Cowboy (glm-controller) installs this chart once per gateway instance
# under release name `octogee-gw-<gatewayId>`. The umbrella `octogee`
# release no longer manages gateway pods.

# Logical, stable, Cowboy-set gateway identity — a bare name (`default`,
# `bender`, `canary`). Written to Firestore `gateways/{gatewayId}`
# heartbeats and matched against customer `provisioning.openclaw.gatewayId`.
# Also forms the per-instance K8s resource names
# (`octogee-gateway-<gatewayId>`, `gateway-edge-<gatewayId>`) that the shared
# gateway-router forwards public `/g/<id>/*` requests to. Must be a lowercase
# DNS-safe id that fits every rendered suffix.
gatewayId: ""

# Disposable revision instance id ({gatewayId}-r{n}). Cowboy sets it per
# revision Helm release; every per-instance K8s resource NAME and the
# `gateway-instance` selector derive from it so two simultaneous revisions of
# one gateway never collide. Empty → defaults to gatewayId (legacy single-
# revision renders are unchanged). Tenant identity (KSA, secrets, GATEWAY_ID)
# stays gateway-scoped on gatewayId, never revisionId.
revisionId: ""

# Dedicated builder/operator owner slug. Shared gateways leave this empty.
# When present on builder/operator classes, the gateway restores durable
# openclaw.json from that builder's Gitea system_config repo before OpenClaw
# starts.
builderSlug: ""

systemConfigRollContext:
  migrationId: ""
  sourceRevisionId: ""
  targetRevisionId: ""
  checkpointCommit: ""
  freezeObject: ""

# Bundle SHA. All three sidecars (gateway, gateway-edge, chat-proxy)
# default to this tag for atomic rolls. Per-image overrides below take
# precedence when set, but the operator workflow is single-SHA.
imageTag: "latest"

image:
  repository: us-central1-docker.pkg.dev/octogee/octogee/octogee-gateway
  # Inherits from .Values.imageTag when empty. Override only for an
  # emergency hotfix.
  tag: ""

serviceAccountName: ""
serviceAccount:
  create: false
  annotations: {}
operatorAccess:
  # Locked by default. Cowboy may enable this only after a customer has a
  # tenant-owned operator gateway boundary (billing/reservation + scoped
  # platform credentials) and the app/user mirror has been updated.
  shellsEnabled: false
  controlUiEnabled: false
  # Platform-builder ONLY (OPERATOR-GATEWAY-IDENTITY-AND-BROKERING-SPEC D7).
  # Opens egress to the GKE metadata server (169.254.169.254) so this gateway's
  # read-only Workload-Identity GSA can mint tokens. The fleet-wide
  # gateway-egress policy blocks metadata for everyone; this carves an exception
  # for THIS pod only. Enable ONLY when the bound GSA is least-privilege +
  # read-only (so a token grab is read-only blast radius). Default off.
  platformMetadataEgress: false
  # Operator gateway TokenReview path. BuilderShell and broker identity checks
  # call the Kubernetes API server; the fleet-wide gateway-egress policy blocks
  # RFC1918, so GKE Dataplane V2 needs the real API-server endpoint /32 CIDR(s)
  # from the default/kubernetes EndpointSlice, not the Service ClusterIP.
  # Default off; set per operator gateway only.
  kubeApiServerEgressCidrs: []

# Replica count — Cowboy passes `--set replicas=0` for desiredStatus=paused.
# values.test.yaml defaults to 0 so TEST stays scaled-to-zero across release
# pushes (the manual `kubectl scale --replicas=0 --all` workaround is no longer
# needed — TEST is always paused unless an operator explicitly resumes).
replicas: 1

# Roll strategy — "recreate" (default) or "surge" (RollingUpdate maxSurge=1 /
# maxUnavailable=0: new pod Ready before the old one dies). Cowboy passes
# surge for stable-name gateway releases (GATEWAY-SIMPLE-ROLL-SPEC).
rollStrategy: recreate

# Spot/preemption drain budget. Kubernetes runs this hook before SIGTERM and
# counts it against terminationGracePeriodSeconds, so keep timeoutSeconds below
# gracePeriodSeconds to leave the entrypoint time to forward TERM to children.
preStopFlush:
  enabled: true
  terminationGracePeriodSeconds: 30
  timeoutSeconds: 25

# Product/security class. Empty keeps legacy behavior: profile=operator derives
# operator; otherwise shared. Builder is one-builder, standard image, exec-on,
# shell-feature gated. Operator is the same runtime trust boundary plus the
# operator image/BYO GCP tooling, with no shared platform model key.
gatewayClass: ""

# Installed image/tooling profile. Empty derives from gatewayClass/legacy
# profile: shared+builder => standard, operator => operator.
imageProfile: ""

# Legacy overloaded capability/image profile. Keep for existing desired-state
# docs and clients; new callers should set gatewayClass + imageProfile.
profile: ""

# Workspace auto-commit toggle. Unset (default) lets the gateway code
# decide based on profile — operator → off, standard/cattle → on. Set
# to "true" or "false" to override (e.g. an operator who wants the
# auto-save net, or a cattle gateway under debugging).
workspaceAutosaveEnabled: ""

# Gateway container security defaults stay locked down. Personal build
# gateways may override this per instance via glmGateways desired state.
gatewayContainerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# GKE Autopilot compute class (selected via nodeSelector on the pod).
# Built-in classes: "Performance", "Balanced", "Scale-Out", "Accelerator".
# Real envs override this to the umbrella-owned custom class
# "octogee-gateway[-test]" (helm/octogee/templates/gateway-compute-class.yaml),
# which pins the standard machine series across fast families so NAP cannot
# oversize the node or stall on a single-family stockout. The base default
# stays on the built-in Performance class (always available for a standalone
# render) — it keeps the V8 main thread off cost-optimized E-family cores,
# where model warmup blocked the loop for 25-30s (TEST 2026-05-13); per-core
# perf on the standard fast families is ≈ 30-50% faster than E2.
computeClass: "Performance"
computeClassByClass: {}

# Explicit per-gateway override set by Cowboy from glmGateways/{id}.computeClass.
# This intentionally sits above computeClassByClass in the helper, while the
# legacy computeClass remains the environment default.
computeClassOverride: ""

# Machine-family pin for the bare built-in Performance class. Leave EMPTY
# when computeClass is a custom class (values.{prod,test}.yaml) — that class
# already defines its families, and a pin here would fight it. Pinning a
# single family under the built-in class is what let Autopilot NAP grab
# oversized nodes and stall on a stockout (see the umbrella's
# gateway-compute-class.yaml). c2d = AMD EPYC Milan if you ever do pin one.
machineFamily: ""

# Chart fingerprint — Cowboy passes its SHA-256 of the chart bytes via
# `--set chartFingerprint=...` so subsequent reconciles can detect chart
# template drift even when image-tag is unchanged. Stored on the helm
# release; never authored by humans. The release default is empty
# because manual `helm upgrade` from operator machines should be
# allowed even when no fingerprint is computed.
#
# Metadata-only: no template renders this value. It exists solely as a
# stored helm value that `helm get values -o json` can read back during
# reconcile. The fingerprint covers the whole chart dir including
# values.test.yaml AND values.prod.yaml, so editing the test values
# triggers a one-tick re-apply in PROD even though PROD's render is
# unchanged — free no-op rolls, not a correctness issue.
chartFingerprint: ""

conversationExperiment:
  mode: "broad"

env:
  gcloudProject: "octogee"
  firebaseProjectId: "octogee"
  agentPrefix: "octogee-"
  githubOrg: "octogee"
  mmUrl: ""  # auto-computed from release namespace if empty
  octogeeApiUrl: ""  # internal octogee-api DNS; auto-computed from release namespace if empty
  mmSiteUrl: ""
  mmInteractionsCallbackBaseUrl: ""  # auto-computed per-instance if empty
  mmInteractionsAllowedSourceIps: "127.0.0.1"
  apiPublicUrl: "https://api.octogee.com"
  # Comma-separated list of allowed Origin headers on the chat-proxy
  # browser→OpenClaw WebSocket upgrade. Empty = chat-proxy falls back to
  # localhost-only (dev mode). Populate per-env in values.{prod,test}.yaml.
  allowedWsOrigins: ""
  discordOpsWebhookUrl: ""
  gitApiUrl: ""
  gitSshHost: ""
  llmBrokerUrl: ""  # auto-computed from release namespace for builder-class gateways
  openaiEmbeddingsEnabled: "true"
  openaiEmbeddingsBaseUrl: "https://api.openai.com/v1"
  openaiEmbeddingsModel: "text-embedding-3-small"
  openclawLogLevel: "info"
  openclawDoctorMode: "skip"
  fleetControllerPort: "3003"
  migrationRsyncPort: "30873"

# Preview host the gateway's preview-proxy advertises in URLs it returns
# to the app. Must match the umbrella's gatewayFleet.previewIngress.host
# for the env so users land on the right cert. Empty disables the env
# var and lets preview-proxy.ts fall back to its hardcoded default
# (preview.octogee.com) — fine for prod, wrong for test.
preview:
  host: "preview.octogee.com"

# Gateway storage is emptyDir only — all gateways are Spot + emptyDir (#1932).
# Pod-local state is disposable; customers/<slug>/ rehydrates from Gitea
# post-boot. The PVC path (persistence.*) was deleted end-to-end
# (GATEWAY-RELEASES-SPEC): PVC-backed gateways are incompatible with Spot.

# Per-pod sizing tier. Operator-facing enum that maps to the matching
# .Values.tiers entry below — drives resources + node-runtime tuning
# together. Cowboy passes `--set sizingTier=<tier>` per gateway; when
# empty the chart falls back to .Values.classDefaults[gatewayClass],
# then legacy .Values.profileDefaults[imageProfile].
sizingTier: ""

# Class → default tier mapping. Used when sizingTier is unset.
classDefaults:
  shared: "small"
  builder: "micro"
  operator: "small"

# Legacy image-profile → default tier mapping. Used when classDefaults is
# absent on old releases.
profileDefaults:
  standard: "small"
  operator: "small"

# Tier presets — the canonical sizing matrix. Mirrored in
# shared/types/sizing.ts (TS SSOT for cost-estimator + admin API);
# tests/specs/helm-octogee-gateway-sizing.spec.ts asserts the two stay
# in lockstep. Edit both sides together.
tiers:
  micro:
    resources:
      requests:
        cpu: "500m"
        memory: "2Gi"
        ephemeral-storage: "4Gi"
      limits:
        cpu: "500m"
        memory: "2Gi"
        ephemeral-storage: "4Gi"
    nodejs:
      uvThreadpoolSize: "4"
      maxOldSpaceSizeMb: "1536"
  mini:
    resources:
      requests:
        cpu: "1000m"
        memory: "4Gi"
        ephemeral-storage: "4Gi"
      limits:
        cpu: "1000m"
        memory: "4Gi"
        ephemeral-storage: "6Gi"
    nodejs:
      uvThreadpoolSize: "4"
      maxOldSpaceSizeMb: "3072"
  nano:
    resources:
      requests:
        cpu: "2000m"
        memory: "8Gi"
        ephemeral-storage: "5Gi"
      limits:
        cpu: "2000m"
        memory: "8Gi"
        ephemeral-storage: "10Gi"
    nodejs:
      uvThreadpoolSize: "4"
      maxOldSpaceSizeMb: "4096"
  small:
    resources:
      requests:
        cpu: "4000m"
        memory: "16Gi"
        ephemeral-storage: "5Gi"
      limits:
        cpu: "4000m"
        memory: "16Gi"
        ephemeral-storage: "10Gi"
    nodejs:
      uvThreadpoolSize: "6"
      maxOldSpaceSizeMb: "10240"
  medium:
    resources:
      requests:
        cpu: "8000m"
        memory: "32Gi"
        ephemeral-storage: "5Gi"
      limits:
        cpu: "8000m"
        memory: "32Gi"
        ephemeral-storage: "10Gi"
    nodejs:
      uvThreadpoolSize: "8"
      maxOldSpaceSizeMb: "20480"
  large:
    resources:
      requests:
        cpu: "16000m"
        memory: "64Gi"
        ephemeral-storage: "5Gi"
      limits:
        cpu: "16000m"
        memory: "64Gi"
        ephemeral-storage: "10Gi"
    nodejs:
      uvThreadpoolSize: "12"
      maxOldSpaceSizeMb: "40960"
  xlarge:
    resources:
      requests:
        cpu: "32000m"
        memory: "128Gi"
        ephemeral-storage: "5Gi"
      limits:
        cpu: "32000m"
        memory: "128Gi"
        ephemeral-storage: "10Gi"
    nodejs:
      uvThreadpoolSize: "16"
      maxOldSpaceSizeMb: "81920"
  "2xlarge":
    resources:
      requests:
        cpu: "56000m"
        memory: "224Gi"
        ephemeral-storage: "5Gi"
      limits:
        cpu: "56000m"
        memory: "224Gi"
        ephemeral-storage: "10Gi"
    nodejs:
      uvThreadpoolSize: "16"
      maxOldSpaceSizeMb: "147456"

probes:
  # Startup reaches the config status plane, which remains healthy during
  # isolated-gateway repair. 10s × 60 keeps a 10-minute window for failures
  # of that repair plane itself.
  startup:
    initialDelaySeconds: 15
    periodSeconds: 10
    failureThreshold: 60
    timeoutSeconds: 10
  # Liveness stays permissive during pre-boot repair, then performs a bounded
  # local OpenClaw health check after the config has been accepted.
  liveness:
    initialDelaySeconds: 0
    periodSeconds: 60
    failureThreshold: 5
    timeoutSeconds: 10
  # Readiness: TCP probe, generous tolerance, `successThreshold: 3`
  # prevents the "TCP-bound = Ready" flip from firing before openclaw
  # is stably accepting connections. 3 × 10s = 30s of consistent
  # port-bound before flipping to Ready on cold boot. failureThreshold
  # at 12 = 120s of consistent failure before flipping to NotReady,
  # absorbing transient stalls during customer-add bursts.
  readiness:
    initialDelaySeconds: 0
    periodSeconds: 10
    failureThreshold: 12
    timeoutSeconds: 10
    successThreshold: 3

pdb:
  enabled: true
  # Legacy only; kept for schema/backward compatibility. The chart now uses
  # maxUnavailable for every gateway class.
  minAvailable: 1
  # all classes — disruptionsAllowed:1 so ComputeClass activeMigration can right-size
  maxUnavailable: 1


# ── gateway-edge sidecar ──────────────────────────────────────────────────
gatewayEdge:
  enabled: true
  openClawControlRpcPolicyMode: "native"
  image:
    repository: us-central1-docker.pkg.dev/octogee/octogee/gateway-edge
    tag: ""  # inherits from imageTag
  port: 3001
  env:
    GITEA_URL: ""  # auto-computed from K8S_NAMESPACE
    GITEA_ORG: "octogee"
    MM_URL: ""  # auto-computed from K8S_NAMESPACE
    FIREBASE_PROJECT_ID: "octogee"
    GCLOUD_PROJECT: "octogee"
    GCP_PROJECT_ID: "octogee"
    APP_URL: "https://app.octogee.com"
    API_PUBLIC_URL: "https://api.octogee.com"
    SITE_URL: "https://octogee.com"
    # Credential-at-rest KMS key (terraform/modules/kms output
    # `kms_creds_key_name`). Set per environment via values.{prod,
    # test}.yaml — gateway-edge fails loud at first integrations write
    # if missing (no silent plaintext fallback). See
    # gateway-edge/src/lib/kms.ts.
    OCTOGEE_KMS_KEY_NAME: ""
  # Platform secrets (GITEA_TOKEN, MM_ADMIN_TOKEN, INTERNAL_SERVICE_KEY,
  # OAuth/Discord/Resend/Stripe/INVITE_SECRET, …) are intentionally NOT mounted on
  # the gateway-edge sidecar or the shell-bearing gateway pod — the agent runs
  # arbitrary code there, so platform credentials must stay off it. Nothing rendered
  # this list anyway (the deployment injects only gatewayEdge.env); the cluster
  # gateway-edge and the no-shell broker sidecar hold what's needed. See
  # credential-brokering #1480 / #1478 / #1493 / #1494. Do NOT add a
  # `range .Values.gatewayEdge.secrets` env loop here — it re-introduces the exact
  # exposure those PRs removed. (Dead block + unused requireGatewayEdgeSecret helper
  # removed 2026-06-15.)
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# NetworkPolicy locking down operator-profile gateway :3005 (builder
# shell) to same-pod / same-instance ingress only. See
# templates/builder-shell-network-policy.yaml. Disable per gateway if
# a cluster doesn't support NetworkPolicy enforcement.
networkPolicy:
  enabled: true
