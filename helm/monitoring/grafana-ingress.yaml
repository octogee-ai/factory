# ─────────────────────────────────────────────────────────────────────────────
# Grafana IAP Ingress — exposes Grafana at https://monitoring.octogee.com behind
# Google IAP (only IAP-allowlisted Google accounts can reach it).
#
# Applied by scripts/setup-monitoring-iap.sh (Step 5). Prereqs the script sets
# up: a global static IP `grafana-ip`, the `grafana-iap-oauth` secret, the DNS A
# record (Cloudflare proxy OFF — GKE ManagedCertificate needs direct), and IAP
# enabled + access granted in the GCP console.
#
# (Restored to helm/monitoring/ — originally lived under k8s/monitoring/ and was
# removed in the #123 k8s/ cleanup, but setup-monitoring-iap.sh still references
# it here.)
# ─────────────────────────────────────────────────────────────────────────────

# ── BackendConfig — enables IAP on the backend ──────────────────────────────
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: grafana-iap
  namespace: monitoring
spec:
  iap:
    enabled: true
    oauthclientCredentials:
      secretName: grafana-iap-oauth

---
# ── NodePort service (GKE Ingress requires NodePort/LoadBalancer) ────────────
apiVersion: v1
kind: Service
metadata:
  name: grafana-nodeport
  namespace: monitoring
  annotations:
    cloud.google.com/backend-config: '{"default": "grafana-iap"}'
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: grafana
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP

---
# ── ManagedCertificate — auto-provisioned SSL cert ──────────────────────────
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: grafana-cert
  namespace: monitoring
spec:
  domains:
    - monitoring.octogee.com

---
# ── Ingress ──────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    kubernetes.io/ingress.global-static-ip-name: grafana-ip
    networking.gke.io/managed-certificates: grafana-cert
    kubernetes.io/ingress.class: "gce"
spec:
  rules:
    - host: monitoring.octogee.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana-nodeport
                port:
                  number: 80
