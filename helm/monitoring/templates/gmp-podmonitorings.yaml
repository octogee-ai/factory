# App metrics → GMP. ClusterPodMonitoring is cluster-scoped, so each covers both
# octogee + octogee-test (matching the retired ServiceMonitors' namespaceSelector).
# GMP sets the `job` label to the resource name — kept identical to the old
# ServiceMonitor jobs so dashboards/alerts (up{job="octogee-gateway"}, the
# $gateway var, gateway-edge panels) keep working unchanged.
# Scrape at 30s: GMP bills per sample ingested, and 30s is ample for these
# cost/capacity/health metrics (shortest alert window is for:2m = 4 samples).
# 15s doubled the sample bill for no added signal. Gitea stays 60s (DB-backed).
apiVersion: monitoring.googleapis.com/v1
kind: ClusterPodMonitoring
metadata:
  name: octogee-api
  labels:
    {{- include "octogee-monitoring.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: octogee-api
  endpoints:
    - port: 3001
      path: /metrics
      interval: 30s
---
# In-pod runner heartbeats (:9092) on the gateway pod.
apiVersion: monitoring.googleapis.com/v1
kind: ClusterPodMonitoring
metadata:
  name: octogee-gateway
  labels:
    {{- include "octogee-monitoring.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: octogee-gateway
  endpoints:
    - port: 9092
      path: /metrics
      interval: 30s
---
# gateway-edge sidecar (:3001) — lives in the gateway pod, so select that pod but
# keep job="gateway-edge" (separate CR) to match the old ServiceMonitor.
apiVersion: monitoring.googleapis.com/v1
kind: ClusterPodMonitoring
metadata:
  name: gateway-edge
  labels:
    {{- include "octogee-monitoring.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: octogee-gateway
  endpoints:
    - port: 3001
      path: /metrics
      interval: 30s
---
# Gitea's gauges are DB-backed (computed per scrape over the Cloud SQL proxy) —
# give it room, like the old ServiceMonitor (60s/45s).
apiVersion: monitoring.googleapis.com/v1
kind: ClusterPodMonitoring
metadata:
  name: gitea
  labels:
    {{- include "octogee-monitoring.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: gitea
  endpoints:
    - port: 3000
      path: /metrics
      interval: 60s
      timeout: 45s
---
apiVersion: monitoring.googleapis.com/v1
kind: ClusterPodMonitoring
metadata:
  name: mattermost
  labels:
    {{- include "octogee-monitoring.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: mattermost
  endpoints:
    - port: 8067
      path: /metrics
      interval: 30s
---
apiVersion: monitoring.googleapis.com/v1
kind: ClusterPodMonitoring
metadata:
  name: glm-controller
  labels:
    {{- include "octogee-monitoring.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: glm-controller
  endpoints:
    - port: 8080
      path: /metrics
      interval: 30s
