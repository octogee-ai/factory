{{- $root := . -}}
{{- range $namespace := .Values.monitoredNamespaces }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-edge-monitoring-scrape
  namespace: {{ $namespace }}
  labels:
    {{- include "octogee-monitoring.labels" $root | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: octogee-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gke-gmp-system
      ports:
        - protocol: TCP
          port: 3001
{{- end }}
