---
# Octogee Alert Rules
# Applied via: kubectl apply -f helm/monitoring/alert-rules.yaml
# Requires Prometheus Operator (deployed by kube-prometheus-stack)
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: octogee-alerts
  namespace: monitoring
  labels:
    app: kube-prometheus-stack
    release: prometheus
spec:
  groups:

    # ── Gateway ──────────────────────────────────────────────────────────────
    - name: octogee.gateway
      rules:
        - alert: GatewayDown
          expr: absent(up{job="octogee-gateway"})
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Octogee gateway is unreachable"
            description: "No gateway metrics for 2m. Pod may be crashlooping or stuck."

        - alert: GatewayHighRestarts
          expr: kube_pod_container_status_restarts_total{container="gateway"} > 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Gateway pod has restarted {{ $value }} times"
            description: "Container {{ $labels.container }} in {{ $labels.namespace }} has restarted {{ $value }} times."

        - alert: GatewayPodNotReady
          expr: kube_pod_status_ready{pod=~"octogee-gateway-.*", condition="true"} == 0
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "Gateway pod not ready for 3m"
            description: "Pod {{ $labels.pod }} in {{ $labels.namespace }} has been not-ready for 3 minutes."

    # ── Mattermost ───────────────────────────────────────────────────────────
    - name: octogee.mattermost
      rules:
        - alert: MattermostDown
          expr: absent(up{job="mattermost"})
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Mattermost is unreachable"
            description: "No Mattermost metrics for 2m. Chat is broken for all customers."

        - alert: MattermostPodNotReady
          expr: kube_pod_status_ready{pod=~"mattermost-.*", condition="true"} == 0
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "Mattermost pod not ready for 3m"
            description: "Pod {{ $labels.pod }} in {{ $labels.namespace }} has been not-ready for 3 minutes."

    # ── Cloud SQL Proxy ───────────────────────────────────────────────────────
    - name: octogee.cloudsql
      rules:
        - alert: CloudSQLProxyDown
          expr: kube_deployment_status_replicas_available{deployment="cloud-sql-proxy"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Cloud SQL proxy has no available replicas"
            description: "Mattermost and Gitea cannot reach the database."

    # ── Namespace health ──────────────────────────────────────────────────────
    - name: octogee.pods
      rules:
        - alert: PodCrashLooping
          expr: rate(kube_pod_container_status_restarts_total{namespace=~"octogee|octogee-test"}[5m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} is crash-looping"
            description: "Container {{ $labels.container }} in {{ $labels.namespace }} is restarting frequently."

        - alert: PodOOMKilled
          expr: kube_pod_container_status_last_terminated_reason{reason="OOMKilled", namespace=~"octogee|octogee-test"} == 1
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "Pod OOMKilled: {{ $labels.pod }}"
            description: "Container {{ $labels.container }} was OOM-killed. Check memory limits."

        - alert: PVCNearFull
          expr: |
            (kubelet_volume_stats_used_bytes{namespace=~"octogee|octogee-test"}
            / kubelet_volume_stats_capacity_bytes{namespace=~"octogee|octogee-test"}) > 0.85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "PVC {{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage }} full"
            description: "PVC in {{ $labels.namespace }} is above 85% capacity. Expand or clean up."

    # ── In-pod runners + shell reconciler ─────────────────────────────────────
    # Metrics from runner-metrics-exporter on the gateway pod (:9092). These
    # catch failures that container-level alerts can't see: the runners are
    # children of PID 1 (entrypoint.sh), so a crash-looping runner never shows
    # as a container restart. See docs/specs/GATEWAY-RUNNER-OBSERVABILITY-SPEC.md.
    #
    # NOTE: there is deliberately no octogee_tmux_server_up alert — the tmux
    # server self-terminates when its last shell session closes, so up=0 is the
    # normal idle state. The gauge exists for dashboards only.
    - name: octogee.runners
      rules:
        - alert: RunnerDown
          expr: octogee_runner_up == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "In-pod runner {{ $labels.runner }} is down"
            description: "Runner {{ $labels.runner }} on {{ $labels.pod }} has reported down (or its supervisor's heartbeat went stale) for 5m."

        - alert: RunnerCrashLooping
          expr: increase(octogee_runner_restart_total[10m]) > 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "In-pod runner {{ $labels.runner }} is crash-looping"
            description: "Runner {{ $labels.runner }} on {{ $labels.pod }} restarted {{ $value }} times in 10m. Check its structured restart logs."

        - alert: ShellReconcilerStalled
          expr: (time() - octogee_shell_reconcile_last_success_timestamp_seconds) > 600
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Shell reconciler has not completed a sweep in {{ $value | humanizeDuration }}"
            description: "octogee_shell_reconcile on {{ $labels.pod }} last succeeded >10m ago — stale shell docs won't flip to dead. Check octogee_shell_reconcile_errors_total + the reconciler logs."
