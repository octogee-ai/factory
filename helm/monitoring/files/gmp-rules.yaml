# Octogee alert rules — GMP managed rule evaluation. Ported from the retired
# PrometheusRule (kube-prometheus-stack). The managed rule-evaluator evaluates
# these against Monarch and writes their state to the ALERTS metric. WEST
# Terraform Cloud Monitoring policies select firing critical/warning ALERTS
# series and notify the verified operator email and SMS channels.
apiVersion: monitoring.googleapis.com/v1
kind: ClusterRules
metadata:
  name: octogee-alerts
spec:
  groups:
    - name: octogee.gateway
      rules:
        - alert: GatewayDown
          expr: |
            (
              sum by (namespace) (up{job="octogee-gateway",namespace=~"octogee|octogee-test"} == 1)
              or on(namespace)
              (0 * kube_namespace_created{job="gmp-kube-state-metrics",namespace=~"octogee|octogee-test"})
            ) < 1
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Octogee gateway is unreachable"
            description: "No gateway metrics for 2m. Pod may be crashlooping or stuck."
        - alert: GatewayHighRestarts
          expr: kube_pod_container_status_restarts_total{job="gmp-kube-state-metrics",namespace=~"octogee|octogee-test",container="gateway"} > 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Gateway pod has restarted {{ $value }} times"
            description: "Container {{ $labels.container }} in {{ $labels.namespace }} has restarted {{ $value }} times."
        - alert: GatewayPodNotReady
          expr: kube_pod_status_ready{job="gmp-kube-state-metrics",namespace=~"octogee|octogee-test",pod=~"octogee-gateway-.*", condition="true"} == 0
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "Gateway pod not ready for 3m"
            description: "Pod {{ $labels.pod }} in {{ $labels.namespace }} has been not-ready for 3 minutes."
        - alert: GatewayDesiredRunningUnavailable
          expr: glm_gateway_desired_running_unavailable{namespace=~"octogee|octogee-test"} == 1
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "Desired-running gateway {{ $labels.gateway_id }} has no available pod"
            description: "Cowboy expects gateway {{ $labels.gateway_id }} to be running, but Kubernetes has reported zero available replicas for 3 minutes. Check the gateway card, rollout operation, and pod events."
        - alert: GatewayOnDemandFallback
          expr: |
            (
              kube_pod_info{job="gmp-kube-state-metrics",namespace=~"octogee|octogee-test",pod=~"octogee-gateway-.*"}
              * on(namespace,pod) group_left()
              kube_pod_labels{job="gmp-kube-state-metrics",namespace=~"octogee|octogee-test",label_gateway_class=~"builder|operator"}
            )
            * on(node) group_left()
            kube_node_labels{job="gmp-kube-state-metrics",label_cloud_google_com_gke_spot!="true"}
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Gateway {{ $labels.pod }} is running on on-demand capacity"
            description: "An owner-bound regional Spot-first ComputeClass exhausted a Spot placement and activated its on-demand fallback. Service remains available and active migration returns the gateway to Spot when capacity permits."
        - alert: SharedGatewayPoolDegraded
          expr: |
            (
              count by (namespace) (
                (kube_pod_status_ready{job="gmp-kube-state-metrics",namespace=~"octogee|octogee-test",condition="true"} == 1)
                * on(namespace,pod) group_left()
                kube_pod_labels{job="gmp-kube-state-metrics",namespace=~"octogee|octogee-test",label_gateway_class="shared"}
              )
              or on(namespace)
              (0 * kube_namespace_created{job="gmp-kube-state-metrics",namespace=~"octogee|octogee-test"})
            ) < 2
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Shared gateway pool is degraded in {{ $labels.namespace }}"
            description: "Fewer than two Ready shared gateway pods are available from the on-demand reliability floor. Each per-identity minAvailable: 1 PDB protects its Ready gateway during voluntary disruption while AlwaysAllow permits eviction of an unhealthy stale pod. Inspect gateway pods, node capacity, and recovery operations."
        - alert: SharedGatewayZoneDiversityLost
          expr: |
            (
              count by (namespace) (
                count by (namespace, label_topology_kubernetes_io_zone) (
                  (
                    (kube_pod_status_ready{job="gmp-kube-state-metrics",namespace=~"octogee|octogee-test",condition="true"} == 1)
                    * on(namespace,pod) group_left(node)
                    kube_pod_info{job="gmp-kube-state-metrics",namespace=~"octogee|octogee-test",pod=~"octogee-gateway-.*"}
                    * on(namespace,pod) group_left()
                    kube_pod_labels{job="gmp-kube-state-metrics",namespace=~"octogee|octogee-test",label_gateway_class="shared"}
                    * on(node) group_left(label_topology_kubernetes_io_zone)
                    kube_node_labels{job="gmp-kube-state-metrics",label_topology_kubernetes_io_zone!=""}
                  )
                )
              )
              or on(namespace)
              (0 * kube_namespace_created{job="gmp-kube-state-metrics",namespace=~"octogee|octogee-test"})
            ) < 2
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Shared gateway pool lost zone diversity in {{ $labels.namespace }}"
            description: "Ready shared gateway pods occupy fewer than two Central zones. Capacity remains available, but a zonal disruption can now remove the entire shared pool."
        - alert: SharedGatewayMaxCapacity
          expr: increase(glm_shared_gateway_max_capacity_total{namespace=~"octogee|octogee-test"}[5m]) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "Shared Barn reached its configured member limit"
            description: "Cowboy needs another whole Shared Barn member but shared-a through shared-d are already running. Raise the configured member ceiling or reduce assignment pressure before another disposable gateway is preempted."
        - alert: GlmControllerReconcileStalled
          expr: (time() - glm_reconcile_last_success_timestamp_seconds{namespace=~"octogee|octogee-test"}) > 600
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Cowboy has not completed a successful reconcile in >10m"
            description: "glm-controller reconcile success is stale. Gateway desired state may not be reaching Kubernetes; check glm-controller logs and /metrics."
    - name: octogee.mattermost
      rules:
        - alert: MattermostDown
          expr: kube_deployment_status_replicas_available{job="gmp-kube-state-metrics",namespace=~"octogee|octogee-test",deployment="mattermost"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Mattermost is unreachable"
            description: "No Mattermost metrics for 2m. Chat is broken for all customers."
        - alert: MattermostPodNotReady
          expr: kube_pod_status_ready{job="gmp-kube-state-metrics",namespace=~"octogee|octogee-test",pod=~"mattermost-.*", condition="true"} == 0
          for: 3m
          labels:
            severity: critical
          annotations:
            summary: "Mattermost pod not ready for 3m"
            description: "Pod {{ $labels.pod }} in {{ $labels.namespace }} has been not-ready for 3 minutes."
    - name: octogee.activity
      rules:
        - alert: ActivityFinalMissing
          expr: sum by (namespace) (increase(octogee_activity_missing_final_total{namespace=~"octogee|octogee-test"}[10m])) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "An agent run ended without a durable final response"
            description: "The Activity journal reached a terminal run state but the primary Mattermost conversation has no final answer or failure notice."
        - alert: ActivityRoutineDeliveredNormally
          expr: sum by (namespace) (increase(octogee_activity_routine_normal_delivery_total{namespace=~"octogee|octogee-test"}[10m])) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "Routine Activity created ordinary Mattermost attention"
            description: "A routine journal post was delivered without silent semantics. Disable Activity intake and verify the exact Mattermost capability artifact."
        - alert: ActivityOrphansSustained
          expr: sum by (namespace) (increase(octogee_activity_orphan_total{namespace=~"octogee|octogee-test"}[15m])) > 2
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Activity items are arriving without committed run roots"
            description: "Multiple normalized Activity events could not resolve their run root. Check producer ordering, receipt health, and pair integrity."
        - alert: ActivityAttachmentResultUnknown
          expr: sum by (namespace) (increase(octogee_activity_attachment_unknown_total{namespace=~"octogee|octogee-test"}[10m])) > 0
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "A Mattermost upload completed with an unknown file id"
            description: "The summary post is durable, but attachment detail is intentionally lossy and will not be uploaded again automatically."
    - name: octogee.cloudsql
      rules:
        - alert: CloudSQLProxyDown
          expr: kube_deployment_status_replicas_available{job="gmp-kube-state-metrics",namespace=~"octogee|octogee-test",deployment="cloud-sql-proxy"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Cloud SQL proxy has no available replicas"
            description: "Mattermost and Gitea cannot reach the database."
    - name: octogee.pods
      rules:
        - alert: PodCrashLooping
          expr: rate(kube_pod_container_status_restarts_total{job="gmp-kube-state-metrics",namespace=~"octogee|octogee-test"}[5m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} is crash-looping"
            description: "Container {{ $labels.container }} in {{ $labels.namespace }} is restarting frequently."
        - alert: PodOOMKilled
          expr: kube_pod_container_status_last_terminated_reason{job="gmp-kube-state-metrics",reason="OOMKilled", namespace=~"octogee|octogee-test"} == 1
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "Pod OOMKilled: {{ $labels.pod }}"
            description: "Container {{ $labels.container }} was OOM-killed. Check memory limits."
        - alert: PVCNearFull
          expr: |
            (kubelet_volume_stats_used_bytes{namespace=~"octogee|octogee-test"}
            / kubelet_volume_stats_capacity_bytes{namespace=~"octogee|octogee-test"}) > 0.85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "PVC {{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage }} full"
            description: "PVC in {{ $labels.namespace }} is above 85% capacity. Expand or clean up."
        - alert: PodStuckPending
          expr: kube_pod_status_phase{job="gmp-kube-state-metrics",namespace=~"octogee|octogee-test", phase="Pending"} == 1
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.pod }} has been Pending for 15m"
            description: "Pod {{ $labels.pod }} in {{ $labels.namespace }} has been Pending for 15+ minutes; normal Autopilot provisioning completes in minutes. Read the pod's scheduler events first. An unsatisfiable compute class or exhausted regional capacity/quota leaves a pod Pending with no scale-up coming, and an unpullable image does the same after scheduling succeeds."
    - name: octogee.runners
      rules:
        - alert: RunnerDown
          expr: octogee_runner_up{namespace=~"octogee|octogee-test"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "In-pod runner {{ $labels.runner }} is down"
            description: "Runner {{ $labels.runner }} on {{ $labels.pod }} has reported down (or its supervisor's heartbeat went stale) for 5m."
        - alert: RunnerCrashLooping
          expr: increase(octogee_runner_restart_total{namespace=~"octogee|octogee-test"}[10m]) > 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "In-pod runner {{ $labels.runner }} is crash-looping"
            description: "Runner {{ $labels.runner }} on {{ $labels.pod }} restarted {{ $value }} times in 10m. Check its structured restart logs."
        - alert: ShellReconcilerStalled
          expr: (time() - octogee_shell_reconcile_last_success_timestamp_seconds{namespace=~"octogee|octogee-test"}) > 600
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Shell reconciler has not completed a sweep in {{ $value | humanizeDuration }}"
            description: "octogee_shell_reconcile on {{ $labels.pod }} last succeeded >10m ago — stale shell docs won't flip to dead. Check octogee_shell_reconcile_errors_total + the reconciler logs."
    - name: octogee.activity-pairs
      rules:
        - alert: ActivityPairReconciliationFailures
          expr: sum by (namespace) (increase(octogee_activity_pair_reconciliations_total{namespace=~"octogee|octogee-test",result="failure"}[15m])) >= 3
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Repeated Activity pair reconciliation failures in {{ $labels.namespace }}"
            description: "At least three Activity pair reconciliations failed within 15m. Pair membership or archive state may be unsafe; inspect gateway-edge logs and run the report-only inventory."
    - name: octogee.email
      rules:
        - alert: ResendBounceRateHigh
          expr: |
            sum by (namespace) (rate(octogee_email_delivery_total{namespace=~"octogee|octogee-test",event="bounced"}[1h]))
            /
            clamp_min(sum by (namespace) (rate(octogee_email_sent_total{namespace=~"octogee|octogee-test",result="sent"}[1h])), 0.001)
            > 0.05
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Resend bounce rate > 5% over the last hour in {{ $labels.namespace }}"
            description: "Bounces over the last 1h are >5% of sent volume in {{ $labels.namespace }}. Likely DKIM/DMARC drift, a bad address list, or a domain reputation issue. Check the Resend dashboard."
        - alert: ResendComplaintRateHigh
          expr: |
            sum by (namespace) (rate(octogee_email_delivery_total{namespace=~"octogee|octogee-test",event="complained"}[1h]))
            /
            clamp_min(sum by (namespace) (rate(octogee_email_sent_total{namespace=~"octogee|octogee-test",result="sent"}[1h])), 0.001)
            > 0.001
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Resend complaint rate above 0.1% in {{ $labels.namespace }} (deliverability risk)"
            description: "Complaint rate > 0.1% over 1h in {{ $labels.namespace }}. Mailbox providers will start filtering — review send list + unsubscribe path."
        - alert: ResendWebhookStale
          expr: |
            (sum by (namespace) (rate(octogee_email_sent_total{namespace=~"octogee|octogee-test",result="sent"}[1h])) > 0.001)
            and
            (sum by (namespace) (increase(octogee_email_delivery_total{namespace=~"octogee|octogee-test"}[1h])) == 0)
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "No Resend webhook events in 1h despite recent sends in {{ $labels.namespace }}"
            description: "Delivery feedback is broken in {{ $labels.namespace }} — check the Resend webhook URL, signing secret, and event subscriptions (delivered/bounced/complained/delivery_delayed/failed)."
    - name: octogee.cronjobs
      rules:
        - alert: ActivityPairAuditCronStale
          expr: (time() - kube_cronjob_status_last_successful_time{job="gmp-kube-state-metrics",namespace=~"octogee|octogee-test",cronjob="activity-pair-audit"} > 3600) or absent(kube_cronjob_status_last_successful_time{job="gmp-kube-state-metrics",namespace=~"octogee|octogee-test",cronjob="activity-pair-audit"})
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Activity pair report has not completed cleanly in {{ $labels.namespace }}"
            description: "The report-only Activity pair inventory has not produced a drift-free success within one hour. Inspect the CronJob output; it never mutates pairs."
        - alert: DigestDailyCronStale
          expr: (time() - kube_cronjob_status_last_successful_time{job="gmp-kube-state-metrics",namespace=~"octogee",cronjob="notification-digest-daily"} > 90000) or absent(kube_cronjob_status_last_successful_time{job="gmp-kube-state-metrics",namespace=~"octogee",cronjob="notification-digest-daily"})
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Daily digest cron hasn't succeeded in >25h"
            description: "notification-digest-daily (ns octogee) last succeeded >25h ago, or its metric is absent — Builders are not getting digest emails. Check `kubectl -n octogee get cronjob notification-digest-daily` and recent job logs."
        - alert: DigestWeeklyCronStale
          expr: (time() - kube_cronjob_status_last_successful_time{job="gmp-kube-state-metrics",namespace=~"octogee",cronjob="notification-digest-weekly"} > 691200) or absent(kube_cronjob_status_last_successful_time{job="gmp-kube-state-metrics",namespace=~"octogee",cronjob="notification-digest-weekly"})
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Weekly digest cron hasn't succeeded in >8d"
            description: "notification-digest-weekly (ns octogee) last succeeded >8 days ago, or its metric is absent."
        - alert: TrialExpiryCronStale
          expr: (time() - kube_cronjob_status_last_successful_time{job="gmp-kube-state-metrics",namespace=~"octogee",cronjob="trial-expiry"} > 7200) or absent(kube_cronjob_status_last_successful_time{job="gmp-kube-state-metrics",namespace=~"octogee",cronjob="trial-expiry"})
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Trial-expiry cron hasn't succeeded in >2h"
            description: "trial-expiry (ns octogee, hourly) last succeeded >2h ago, or its metric is absent — trial state may be going stale."
    - name: octogee.firestore
      rules:
        - alert: FirestoreReadRateHigh
          expr: sum(rate(firestore_googleapis_com:document_read_count{monitored_resource="firestore.googleapis.com/Database"}[10m])) > 150
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Firestore document reads are sustained at {{ $value }}/s"
            description: "Reads have held above 150/s for 15m against a healthy fleet baseline near 27/s. A read storm is almost always amplification, not customer load: a listener whose watchers redeliver every document on each change, or a reconciler rewriting documents that did not change. Read-rate storms have run 750-1,150/s for days. Check the fleet-event listener hub, Cowboy's reconcile fingerprints, and the placement and heartbeat write paths."
        - alert: FirestoreWriteRateHigh
          expr: sum(rate(firestore_googleapis_com:document_write_count{monitored_resource="firestore.googleapis.com/Database"}[10m])) > 50
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Firestore document writes are sustained at {{ $value }}/s"
            description: "Writes have held above 50/s for 15m. Each write republishes its document to every watcher, so a write loop is the leading indicator of a read storm. Check Cowboy's Kubernetes observation and operator-heartbeat writers, which suppress a write only when the observed state and its freshness stamp are both unchanged, and the operations journal."
