name: Verify isolated Builder backports

on: workflow_dispatch

permissions:
  contents: read

jobs:
  builder:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check patched packages in the exact isolated Builder digest
        env:
          BUILDER_IMAGE: ghcr.io/octogee-ai/octogee-cloud/octogee-gateway-builder@sha256:eb3b1e7f406dbaadafb8a424534ac33ead1c9cb90a89652dd28f94a1f3a4951d
        run: |
          docker run --rm -i --network none --entrypoint /bin/bash "$BUILDER_IMAGE" -seuo pipefail <<'SH'
          verify-runtime-image builder
          for package in libxml2 openssh-client; do
            version=$(dpkg-query -W -f='${Version}' "$package")
            [[ "$version" == *+octogee1 ]]
            printf '%s %s\n' "$package" "$version"
          done
          differences=$(dpkg -V libxml2 openssh-client)
          if [[ -n "$differences" ]]; then
            printf '%s\n' "$differences"
            printf '%s\n' "$differences" | awk 'NF && $2 != "c" { failed = 1 } END { exit failed }'
          fi
          ldd /usr/bin/ffmpeg | grep 'libxml2.so.2 => /'
          ssh -V
          work=$(mktemp -d)
          ssh-keygen -q -t ed25519 -N '' -f "$work/id"
          ssh-keygen -l -f "$work/id.pub" | grep ED25519
          SH
