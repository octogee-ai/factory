name: Gateway backports kind replay

on: workflow_dispatch

permissions:
  actions: read
  contents: read

jobs:
  kind-smoke:
    name: Kind smoke (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.4'
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-manifest-a5957696495c9e9834c9266689cf060ede4ab54b
          github-token: ${{ github.token }}
          run-id: 43508187246
          path: ${{ runner.temp }}/build-manifest
      - name: Install octogee-fleet
        run: GOBIN="$RUNNER_TEMP/bin" go install github.com/octogee-ai/octogee-fleet@2b1bdeaf956ad9d9a8763a6510138b4d615ab62b
      - name: Install the published images
        run: |
          OCTOGEE_KIND_STATE="$RUNNER_TEMP/kind-state" \
            scripts/ops/kind-install.sh up --pull --sha=a5957696495c9e9834c9266689cf060ede4ab54b --manifest="$RUNNER_TEMP/build-manifest/image-manifest.json"
      - name: List gateways through the Admin API
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/kind-state/octogee"
          kubectl --kubeconfig="$state/kubeconfig" -n octogee-local \
            port-forward --address 127.0.0.1 svc/glm-controller 18080:8080 > "$RUNNER_TEMP/kind-port-forward.log" 2>&1 &
          forward_pid=$!
          trap 'kill "$forward_pid" 2>/dev/null || true; cat "$RUNNER_TEMP/kind-port-forward.log"' EXIT
          curl --fail --silent --show-error --retry 15 --retry-delay 1 --retry-connrefused \
            --max-time 3 http://127.0.0.1:18080/healthz > /dev/null
          OCTOGEE_FLEET_CONFIG="$state/fleet-config.json" "$RUNNER_TEMP/bin/octogee-fleet" --env=kind gateway ls --format=json \
            | jq -e 'if .gateways == [] then . else error("expected an empty gateway list") end'
      - name: Boot the exact published Gateway in kind
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/kind-state/octogee"
          kubectl --kubeconfig="$state/kubeconfig" -n octogee-local \
            port-forward --address 127.0.0.1 svc/glm-controller 18080:8080 > "$RUNNER_TEMP/kind-port-forward.log" 2>&1 &
          forward_pid=$!
          trap 'kill "$forward_pid" 2>/dev/null || true; cat "$RUNNER_TEMP/kind-port-forward.log"' EXIT
          curl --fail --silent --show-error --retry 15 --retry-delay 1 --retry-connrefused \
            --max-time 3 http://127.0.0.1:18080/healthz >/dev/null
          export OCTOGEE_FLEET_CONFIG="$state/fleet-config.json"
          fleet="$RUNNER_TEMP/bin/octogee-fleet"
          "$fleet" --env=kind gateway add --id=shared-a --apply
          for _ in {1..90}; do
            listing="$("$fleet" --env=kind gateway ls --format=json)"
            if jq -e 'any(.gateways[]; .gatewayId == "shared-a" and .status == "ready")' <<< "$listing"; then
              exit 0
            fi
            sleep 5
          done
          printf 'Shared Gateway failed to become ready: %s\n' "$listing" >&2
          exit 1
      - name: Check the Gateway browser, media, and Python tools
        run: |
          kubeconfig="$RUNNER_TEMP/kind-state/octogee/kubeconfig"
          # shellcheck disable=SC2016
          kubectl --kubeconfig="$kubeconfig" -n octogee-local exec deployment/octogee-gateway-shared-a -c gateway -- bash -euo pipefail -c '
            chromium --version
            ffmpeg -v error -f lavfi -i sine=duration=0.1 -f wav pipe:1 | ffprobe -v error -show_entries stream=codec_name -of csv=p=0 pipe:0 | grep -qx pcm_s16le
            convert -size 2x2 xc:white png:- | identify -format "%m" - | grep -qx PNG
            python3 -c "import bs4, matplotlib, pandas, yaml"
            test "$(dpkg-query -W -f="\${Version}" libxml2 | sed "s/.*+//")" = octogee1
            test "$(dpkg-query -W -f="\${Version}" openssh-client | sed "s/.*+//")" = octogee1
            ldd /usr/bin/ffmpeg | grep "libxml2.so.2 => /"
            ssh -V
            work=$(mktemp -d)
            ssh-keygen -q -t ed25519 -N "" -f "$work/id"
            ssh-keygen -l -f "$work/id.pub" | grep -q ED25519
            rm -rf "$work"
          '
      - name: Show cluster status on failure
        if: failure()
        run: |
          kubeconfig="$RUNNER_TEMP/kind-state/octogee/kubeconfig"
          if [[ -f "$kubeconfig" ]]; then
            kubectl --kubeconfig="$kubeconfig" -n octogee-local get pods,events
            kubectl --kubeconfig="$kubeconfig" -n octogee-local logs deployment/octogee-gateway-shared-a \
              --all-containers --tail=200 || true
          fi
          df -h /
