# Values for the platform on a local kind cluster, in namespace octogee-local.
# kind-install.sh layers the image references over this file.
global:
  ingressClassName: ""
  nodeSelector: {}
  deploymentTargetId: kind
  deploymentProjectId: kind
  customerHostingProjectId: kind
  secretStoreBackend: postgres
  secretStoreRootKeySecretName: platform-root-key
  encryptionRootKeySecretName: platform-root-key
  blobStoreBackend: s3
  blobStore:
    endpoint: http://seaweedfs:8333
    bucket: octogee-assets
    workspaceBucket: octogee-workspaces
    credentialsSecretName: blob-store-s3
  publicAppOrigins:
    - http://localhost:4322
  logLevel: debug

cloud-sql-proxy:
  enabled: false

mattermost:
  architecture: ""
  db:
    host: postgres
    name: mattermost
  siteUrl: http://mattermost.octogee-local.svc.cluster.local:8065
  allowedCorsOrigins: http://localhost:8065
  pvc:
    size: 2Gi
    storageClass: standard
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
      ephemeral-storage: 256Mi
    limits:
      memory: 1Gi

gitea:
  persistence:
    storageClass: standard
    size: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
  gitea:
    admin:
      email: admin@users.invalid
    config:
      database:
        HOST: postgres:5432
        NAME: gitea
        USER: gitea
      server:
        DOMAIN: octogee-gitea-http.octogee-local.svc.cluster.local
        ROOT_URL: http://octogee-gitea-http.octogee-local.svc.cluster.local:3000

gateway-edge:
  ingress:
    enabled: false

octogee-api:
  serviceAccount:
    annotations: {}
  gatewayServiceAccount: ""
  env:
    MM_URL: http://mattermost.octogee-local.svc.cluster.local:8065
    MM_INTERNAL_URL: http://mattermost.octogee-local.svc.cluster.local:8065
    APP_URL: http://localhost:4322
    API_PUBLIC_URL: http://localhost:3001
    SITE_URL: http://localhost:4321
    PREVIEW_PUBLIC_URL: http://localhost:3001

serviceAccount:
  gcpServiceAccount: ""

glm-controller:
  fleetIdentity:
    operatorKeySecretName: fleet-operator-key
  gcpServiceAccount: ""
  gatewayServiceAccount: none
  workloadIdentityProject: none
  sharedPool:
    minReplicas: 1
    maxReplicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  deploymentTargets:
    schemaVersion: 1
    activeTargets:
      kind: kind
    targets:
      kind:
        environment: kind
        lifecycle: active
        clusterName: kind
        namespace: octogee-local
        siteOrigin: http://localhost:4321
        appOrigin: http://localhost:4322
        apiOrigin: http://localhost:3001
        gitOrigin: http://localhost:3000
        mattermostOrigin: http://localhost:8065
        gatewayValuesFile: values.yaml
  gatewayValues:
    nodeSelector: {}
    computeClass: ""
    runtimeClassName: ""
    podAntiAffinity: preferred
    pdb:
      enabled: false
    networkPolicy:
      enabled: false
    env:
      gcloudProject: kind
      firebaseProjectId: kind
      githubOrg: octogee
      mmInternalUrl: http://mattermost.octogee-local.svc.cluster.local:8065
      mmSiteUrl: http://mattermost.octogee-local.svc.cluster.local:8065
      apiPublicUrl: http://localhost:3001
      giteaPublicBaseUrl: http://localhost:3000
      allowedWsOrigins: http://localhost:4322
      openaiEmbeddingsEnabled: "false"
      openclawLogLevel: debug
      logLevel: debug
    tiers:
      s:
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
            ephemeral-storage: 2Gi
          limits:
            cpu: "2"
            memory: 4Gi
            ephemeral-storage: 5Gi
        nodejs:
          uvThreadpoolSize: "4"
          maxOldSpaceSizeMb: "3072"
      m:
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
            ephemeral-storage: 2Gi
          limits:
            cpu: "2"
            memory: 4Gi
            ephemeral-storage: 5Gi
        nodejs:
          uvThreadpoolSize: "4"
          maxOldSpaceSizeMb: "3072"
    gatewayEdge:
      publicAppOrigins:
        - http://localhost:4322
      env:
        FIREBASE_PROJECT_ID: kind
        GCLOUD_PROJECT: kind
        GCP_PROJECT_ID: kind
        APP_URL: http://localhost:4322
        API_PUBLIC_URL: http://localhost:3001
        SITE_URL: http://localhost:4321

gatewayFleet:
  computeClass:
    enabled: false
  networkPolicy:
    enabled: false

llmBroker:
  replicas: 1
  providerSecret:
    optional: true
  resources:
    requests:
      cpu: 25m
      memory: 128Mi

npmCacheProxy:
  enabled: false

artifactWorker:
  enabled: false

opsAgent:
  enabled: false
