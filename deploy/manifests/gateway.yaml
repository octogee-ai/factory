apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
data:
  openclaw.json: |
    {
      "gateway": {
        "mode": "local",
        "bind": "lan",
        "port": 18789,
        "auth": {
          "mode": "token",
          "token": { "source": "env", "provider": "default", "id": "OPENCLAW_GATEWAY_TOKEN" }
        },
        "controlUi": { "enabled": true }
      },
      "secrets": {
        "providers": { "default": { "source": "env" } }
      },
      "agents": {
        "defaults": { "workspace": "~/.openclaw/workspace" }
      },
      "channels": {
        "mattermost": {
          "enabled": true,
          "baseUrl": "http://mattermost:8065",
          "botToken": { "source": "env", "provider": "default", "id": "MATTERMOST_BOT_TOKEN" },
          "dmPolicy": "open",
          "allowFrom": ["*"],
          "network": { "dangerouslyAllowPrivateNetwork": true }
        }
      }
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gateway-state
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector:
    app: gateway
  ports:
    - port: 18789
      name: gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: install-mattermost-plugin
          image: ghcr.io/openclaw/openclaw:2026.11.1
          command:
            - sh
            - -c
            - |
              set -eu
              mkdir -p /home/node/.openclaw/workspace
              cp /config/openclaw.json /home/node/.openclaw/openclaw.json
              node /app/dist/index.js plugins install --force @openclaw/mattermost@2026.11.1
              if [ -n "${AGENT_MODEL:-}" ]; then
                node /app/dist/index.js config set agents.defaults.model.primary "${AGENT_MODEL}"
              fi
          env:
            - name: HOME
              value: /home/node
          envFrom:
            - secretRef:
                name: gateway-environment
            - secretRef:
                name: platform-model-keys
                optional: true
          volumeMounts:
            - name: state
              mountPath: /home/node/.openclaw
            - name: config
              mountPath: /config
      containers:
        - name: gateway
          image: ghcr.io/openclaw/openclaw:2026.11.1
          command: ["node", "/app/dist/index.js", "gateway", "run"]
          ports:
            - containerPort: 18789
          env:
            - name: HOME
              value: /home/node
            - name: NODE_ENV
              value: production
          envFrom:
            - secretRef:
                name: gateway-environment
            - secretRef:
                name: platform-model-keys
                optional: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: 18789
            periodSeconds: 10
            failureThreshold: 30
          volumeMounts:
            - name: state
              mountPath: /home/node/.openclaw
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: gateway-state
        - name: config
          configMap:
            name: gateway-config
