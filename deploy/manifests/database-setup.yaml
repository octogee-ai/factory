apiVersion: v1
kind: ConfigMap
metadata:
  name: database-setup
data:
  setup.sh: |
    #!/bin/sh
    set -eu
    ensure_service() {
      name="${1}"
      password="${2}"
      found="$(psql -d postgres -Atc "select 1 from pg_roles where rolname = '${name}'")"
      [ "${found}" = "1" ] || psql -v ON_ERROR_STOP=1 -d postgres -c "create role ${name} login"
      psql -v ON_ERROR_STOP=1 -d postgres -c "alter role ${name} password '${password}'"
      psql -v ON_ERROR_STOP=1 -d postgres -c "grant ${name} to current_user"
      found="$(psql -d postgres -Atc "select 1 from pg_database where datname = '${name}'")"
      [ "${found}" = "1" ] || psql -v ON_ERROR_STOP=1 -d postgres -c "create database ${name} owner ${name}"
    }
    ensure_service mattermost "${MATTERMOST_DB_PASSWORD}"
    ensure_service gitea "${GITEA_DB_PASSWORD}"
    ensure_service platform "${PLATFORM_DB_PASSWORD}"
    psql -v ON_ERROR_STOP=1 -d platform -c "create extension if not exists vector"
    psql -v ON_ERROR_STOP=1 -d platform -c "create extension if not exists unaccent"
    psql -v ON_ERROR_STOP=1 -d platform -c "create extension if not exists pg_trgm"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: database-setup
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: setup
          image: pgvector/pgvector:pg16
          command: ["sh", "/setup/setup.sh"]
          env:
            - name: PGHOST
              valueFrom:
                configMapKeyRef:
                  name: platform-settings
                  key: db-host
            - name: PGUSER
              valueFrom:
                configMapKeyRef:
                  name: platform-settings
                  key: db-admin-user
            - name: PGSSLMODE
              valueFrom:
                configMapKeyRef:
                  name: platform-settings
                  key: db-sslmode
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-credentials
                  key: postgres-password
            - name: MATTERMOST_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-credentials
                  key: mattermost-db-password
            - name: GITEA_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-credentials
                  key: gitea-db-password
            - name: PLATFORM_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-credentials
                  key: platform-db-password
          volumeMounts:
            - name: setup
              mountPath: /setup
      volumes:
        - name: setup
          configMap:
            name: database-setup
