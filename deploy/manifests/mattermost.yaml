apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mattermost-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mattermost
spec:
  selector:
    app: mattermost
  ports:
    - port: 8065
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mattermost
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mattermost
  template:
    metadata:
      labels:
        app: mattermost
    spec:
      securityContext:
        fsGroup: 2000
      containers:
        - name: mattermost
          image: mattermost/mattermost-team-edition@sha256:08c0b4b93a14196b0850f62faa4a437d2643533f009cac4868a0b793aad61fc3
          ports:
            - containerPort: 8065
          env:
            - name: MM_SQLSETTINGS_DRIVERNAME
              value: postgres
            - name: MM_SQLSETTINGS_DATASOURCE
              valueFrom:
                secretKeyRef:
                  name: mattermost-database
                  key: dsn
            - name: MM_SERVICESETTINGS_SITEURL
              valueFrom:
                configMapKeyRef:
                  name: platform-settings
                  key: chat-url
            - name: MM_SERVICESETTINGS_ENABLELOCALMODE
              value: "true"
            - name: MM_SERVICESETTINGS_ENABLEBOTACCOUNTCREATION
              value: "true"
            - name: MM_SERVICESETTINGS_ENABLEUSERACCESSTOKENS
              value: "true"
            - name: MM_TEAMSETTINGS_ENABLEOPENSERVER
              value: "false"
            - name: MM_EMAILSETTINGS_SENDEMAILNOTIFICATIONS
              value: "false"
            - name: MM_PLUGINSETTINGS_AUTOMATICPREPACKAGEDPLUGINS
              value: "false"
          startupProbe:
            httpGet:
              path: /api/v4/system/ping
              port: 8065
            periodSeconds: 10
            failureThreshold: 80
          readinessProbe:
            httpGet:
              path: /api/v4/system/ping
              port: 8065
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /mattermost/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mattermost-data
